---
# Prepares each named account for NanoClaw on a remote host.
#
#   build-essential, python3, curl, git   apt, shared
#   ~/nanoclaw                            the clone, one per provisioned account
#   /var/lib/systemd/linger/<user>        so the agent service survives logout
#
# This playbook stops short of installing NanoClaw. The upstream installer is
# interactive -- it registers an Anthropic API key and pairs a messaging channel --
# so it cannot run unattended, and it must run as the account that will own the
# agent. Converting to the push model does not change that: the playbook still does
# the prerequisite half, and each account finishes onboarding over its own SSH
# session. See task 6 for the commands.
#
# Usage:
#   cd _personal
#   ansible-playbook ai-agent/nanoclaw.yml -e host=ws01 -e target_users=alice

- name: Prepare named accounts for NanoClaw
  hosts: "{{ host }}"
  remote_user: ubuntu
  become: false
  gather_facts: true

  vars:
    # Accounts to provision. Accepts "alice,bob" or a YAML/JSON list.
    target_users: []
    nanoclaw_repo: https://github.com/nanocoai/nanoclaw.git
    nanoclaw_version: main

  pre_tasks:
    - name: 0. Normalise target_users into a list
      ansible.builtin.set_fact:
        nanoclaw_users: >-
          {{ (target_users.split(',') if target_users is string else target_users)
             | map('trim') | select | list }}

    - name: 0a. Require at least one target user
      ansible.builtin.assert:
        that: nanoclaw_users | length > 0
        fail_msg: >-
          No target_users given. Name the accounts to provision explicitly, e.g.
          -e target_users=alice or -e target_users=alice,bob.

    - name: 0b. Read the target host's passwd database
      ansible.builtin.getent:
        database: passwd

    - name: 0c. Require every target user to exist on the host
      ansible.builtin.assert:
        that: item in ansible_facts.getent_passwd
        fail_msg: "No account '{{ item }}' on {{ inventory_hostname }}."
      loop: "{{ nanoclaw_users }}"

    # Stated out loud because the list can be silently truncated upstream of the
    # playbook: `ansible-playbook -e target_users="alice, bob"` splits on whitespace
    # and binds only "alice,", and a stray trailing comma drops an account the same
    # way. Read this line before letting the run continue.
    - name: 0d. Show the accounts this run will provision
      ansible.builtin.debug:
        msg: >-
          Provisioning {{ nanoclaw_users | length }} account(s) on {{ inventory_hostname }}:
          {{ nanoclaw_users | join(', ') }}

  tasks:
    # check_mode: false so the probe runs under --check too. Without it the task is
    # skipped and registers rc: 0, which reads as "Docker present" and lets 1a pass on
    # a host that has no Docker at all.
    - name: 1. Check Docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 1a. Fail if Docker is not installed
      ansible.builtin.fail:
        msg: >-
          Docker is not installed on {{ inventory_hostname }}.
          Run it from _multi-user/, granting the accounts you need:
          ansible-playbook container/docker.yml -e host={{ inventory_hostname }}
          -e docker_users={{ nanoclaw_users | join(',') }}
      when: docker_check.rc != 0

    # Checked per account, not for the connecting user: _multi-user/container/docker.yml
    # grants the docker group only to the accounts named in docker_users and defaults to
    # granting none, so membership is exactly the kind of thing that differs between the
    # account Ansible logs in as and the ones being set up.
    # check_mode: false for the same reason as task 1, failing the other way: skipped
    # under --check the task registers an empty stdout, so 1c sees no docker group and
    # fails every account no matter its real membership.
    - name: 1b. Read the group membership of each target account
      ansible.builtin.command: "id -nG {{ item }}"
      register: user_groups
      changed_when: false
      check_mode: false
      loop: "{{ nanoclaw_users }}"

    - name: 1c. Fail if any target account is not in the docker group
      ansible.builtin.fail:
        msg: >-
          Account '{{ item.item }}' on {{ inventory_hostname }} is not in the docker
          group, so it cannot build or run the agent container. Grant it from
          _multi-user/: ansible-playbook container/docker.yml
          -e host={{ inventory_hostname }} -e docker_users={{ item.item }}
          (or directly: usermod -aG docker {{ item.item }}). The group is
          root-equivalent on this host -- grant it deliberately.
      when: "'docker' not in item.stdout.split()"
      loop: "{{ user_groups.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 2. Install system prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - python3
          - curl
          - git
        state: present
        update_cache: true

    - name: 3. Clone the NanoClaw repository for each account
      become: true
      become_user: "{{ item }}"
      ansible.builtin.git:
        repo: "{{ nanoclaw_repo }}"
        dest: "{{ ansible_facts.getent_passwd[item][4] }}/nanoclaw"
        version: "{{ nanoclaw_version }}"
        update: true
      loop: "{{ nanoclaw_users }}"

    - name: 4. Enable lingering so the agent service survives logout
      become: true
      ansible.builtin.command: "loginctl enable-linger {{ item }}"
      args:
        creates: "/var/lib/systemd/linger/{{ item }}"
      loop: "{{ nanoclaw_users }}"

    # check_mode: false so the branch is really read; skipped, the task registers an
    # empty stdout that task 6 prints as "(branch )". Like task 3 in vertex-ai-proxy.yml
    # this reads what an earlier task produced, so under --check against a host with no
    # clone yet there is legitimately nothing to read -- hence failed_when: false, with
    # 5a keeping the real run's failure.
    - name: 5. Verify the clone is readable by the account that owns it
      become: true
      become_user: "{{ item }}"
      ansible.builtin.command: "git -C {{ ansible_facts.getent_passwd[item][4] }}/nanoclaw rev-parse --abbrev-ref HEAD"
      register: nanoclaw_branch
      changed_when: false
      check_mode: false
      failed_when: false
      loop: "{{ nanoclaw_users }}"

    - name: 5a. Fail if the clone is not readable by its owning account
      ansible.builtin.fail:
        msg: >-
          The clone at ~/nanoclaw is not readable by '{{ item.item }}', so that account
          cannot run the onboarding installer against it.
      when: item.rc != 0 and not ansible_check_mode
      loop: "{{ nanoclaw_branch.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 6. Print onboarding instructions
      ansible.builtin.debug:
        msg:
          - "NanoClaw prerequisites installed on {{ inventory_hostname }} for:"
          - "  {{ nanoclaw_users | join(', ') }} (branch {{ nanoclaw_branch.results[0].stdout or 'not read -- clone absent under --check' }})"
          - ""
          - "Onboarding is interactive and must be run by each account itself, over SSH:"
          - "  ssh <account>@{{ inventory_hostname }}"
          - "  cd ~/nanoclaw && bash nanoclaw.sh"
          - ""
          - "The installer registers an Anthropic API key and pairs a messaging channel,"
          - "which is why it is not run from here: those are that account's credentials."
          - ""
          - "It then installs a nanoclaw-v2-<slug> systemd user service, managed as:"
          - "  systemctl --user status nanoclaw-v2-<slug>"
          - "  journalctl --user -u nanoclaw-v2-<slug> -f"
          - ""
          - "Troubleshooting:"
          - "  sqlite3 build failure:  cd ~/nanoclaw && pnpm rebuild better-sqlite3"
          - "  Container build issue:  cd ~/nanoclaw && docker builder prune -f && ./container/build.sh"
          - "  Installer log:          ~/nanoclaw/logs/setup.log"
          - ""
          - "Updating: cd ~/nanoclaw && git pull && bash nanoclaw.sh"
          - "Documentation: https://docs.nanoclaw.dev/"
