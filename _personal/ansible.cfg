# Ansible configuration for the personal (per-identity) workstation playbooks.
#
# These provision one account's $HOME -- an agent's credentials, a user systemd
# service, a checkout under /home/<user> -- rather than a tool every account shares.
# Ansible only picks this file up when invoked from this directory, so every
# documented command starts with `cd _personal`:
#
#   cd _personal
#   ansible -m ping workstations
#   ansible-playbook ai-agent/claude-code.yml -e host=ws01 -e target_users=alice
#
# Two vars, not one: `host` is the machine, `target_users` is the list of accounts on
# it to provision. The connecting account is neither -- see inventory.ini.example.

[defaults]
inventory = inventory.ini
host_key_checking = True
# Facts are required, not optional: the playbooks map ansible_architecture onto upstream
# release asset names and fail loudly on an unmapped value.
gathering = smart
interpreter_python = auto_silent
# YAML-formatted task results, via ansible-core's own default callback rather than the
# `yaml` one: that name resolves to community.general.yaml, which was removed in
# community.general 12 and aborts every playbook run on a control node that has it
# ("The 'community.general.yaml' callback plugin has been removed"). The ini key is
# callback_result_format, not result_format -- the latter is the option's name but not
# its ini spelling, and is silently ignored. Both settings are ansible-core 2.13+, so
# this works on the 24.04 (2.16) and 26.04 (2.20) control nodes alike. Ad-hoc `ansible`
# ignores stdout_callback by default, which is why `ansible -m ping` kept working while
# `ansible-playbook` did not.
stdout_callback = default
callback_result_format = yaml

[privilege_escalation]
# Deliberately the opposite of _multi-user/ansible.cfg, which defaults become to True
# because everything it installs is root-owned. Here the payload is a specific user's
# $HOME, so escalating by default would land it in /root or leave root-owned files in
# someone's home directory -- e.g. an installer piped to bash would install for root
# rather than for the account being provisioned. Escalate deliberately instead:
# `become: true` on the apt tasks, `become_user: "{{ target_user }}"` on the $HOME work.
become = False
become_method = sudo
# Applies only where a task opts in with `become: true` and names no become_user.
become_user = root
# Targets are expected to give the connecting account passwordless sudo. Where they do
# not, pass -K on the command line rather than flipping this.
become_ask_pass = False

[ssh_connection]
# Cuts one SSH round trip per task. Requires that sudo on the target not set requiretty,
# which is the default on Ubuntu. Keep it on here for a second reason: it skips module
# temp-file transfer entirely, which is what otherwise forces
# allow_world_readable_tmpfiles when becoming an unprivileged user.
pipelining = True
