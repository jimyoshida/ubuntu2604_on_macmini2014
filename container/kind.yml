---
- name: Install Kind (Kubernetes in Docker)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    kind_user: "{{ lookup('env', 'USER') }}"
    kind_version: "v0.27.0"

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: 2. Check if Kind is already installed
      stat:
        path: /usr/local/bin/kind
      register: kind_check

    - name: 3. Download Kind binary
      become: yes
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: '0755'
      when: not kind_check.stat.exists

    - name: 4. Verify Kind installation
      command: kind version
      register: kind_version_out
      changed_when: false

    - name: 5. Display Kind version
      debug:
        msg: "{{ kind_version_out.stdout }}"

    - name: 6. Add Kind bash completion to ~/.bashrc
      blockinfile:
        path: "/home/{{ kind_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: kind"
        block: |
          # kind bash completion
          source <(kind completion bash)
        create: true
        mode: '0644'
