---
- name: Install Minikube
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    minikube_user: "{{ lookup('env', 'USER') }}"
    minikube_version: "v1.35.0"

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: 2. Check if Minikube is already installed
      stat:
        path: /usr/local/bin/minikube
      register: minikube_check

    - name: 3. Download Minikube binary
      become: yes
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'
      when: not minikube_check.stat.exists

    - name: 4. Verify Minikube installation
      command: minikube version
      register: minikube_version_out
      changed_when: false

    - name: 5. Display Minikube version
      debug:
        msg: "{{ minikube_version_out.stdout }}"

    - name: 6. Set Docker as default driver
      command: minikube config set driver docker
      become: no
      changed_when: false

    - name: 7. Add Minikube bash completion to ~/.bashrc
      blockinfile:
        path: "/home/{{ minikube_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: minikube"
        block: |
          # minikube bash completion
          source <(minikube completion bash)
        create: true
        mode: '0644'
