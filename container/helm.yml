---
- name: Install Helm
  hosts: localhost
  connection: local
  gather_facts: no
  become: yes

  vars:
    helm_user: "{{ lookup('env', 'USER') }}"
    helm_apt_key_id: "DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6"

  tasks:
    - name: 1. Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: 2. Remove retired baltocdn Helm apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/helm.asc] https://baltocdn.com/helm/stable/debian/ all main"
        state: absent

    - name: 2a. Remove retired baltocdn Helm apt key
      file:
        path: /etc/apt/keyrings/helm.asc
        state: absent

    - name: 3. Create directory for APT keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 4. Download Helm apt key
      get_url:
        url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
        dest: /tmp/helm-apt.key
        mode: '0644'
        force: yes

    - name: 4a. Read fingerprint of the downloaded Helm apt key
      command: gpg --show-keys --with-colons /tmp/helm-apt.key
      register: helm_key_show
      changed_when: false

    - name: 4b. Verify the Helm apt key fingerprint
      assert:
        that:
          - (helm_key_show.stdout_lines | select('match', '^fpr:') | map('split', ':') | map(attribute=9) | first) == helm_apt_key_id
        fail_msg: "Unexpected Helm APT key ID: potential key compromise"

    - name: 4c. Dearmor Helm apt key
      shell: gpg --batch --no-tty --yes --dearmor -o /etc/apt/keyrings/helm.gpg /tmp/helm-apt.key
      args:
        creates: /etc/apt/keyrings/helm.gpg

    - name: 5. Add Helm apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
        state: present
        filename: helm-stable-debian
        update_cache: yes

    - name: 6. Install Helm
      apt:
        name: helm
        state: present
        update_cache: yes

    - name: 7. Add Helm bash completion to ~/.bashrc
      become: no
      blockinfile:
        path: "/home/{{ helm_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - helm"
        block: |
          # helm bash completion
          source <(helm completion bash)
        create: true
        mode: '0644'

    - name: 8. Verify Helm installation
      become: no
      command: helm version
      register: helm_version
      changed_when: false

    - name: 9. Show installed Helm version
      debug:
        msg: "{{ helm_version.stdout }}"
