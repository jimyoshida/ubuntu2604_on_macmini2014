---
- name: Install Claude Code CLI
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    claude_user: "{{ lookup('env', 'USER') }}"
    user_home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: 2. Check if Claude Code is already installed
      command: which claude
      register: claude_check
      changed_when: false
      failed_when: false

    - name: 3. Download and install Claude Code using official script
      shell: |
        curl -fsSL https://claude.ai/install.sh | bash
      args:
        executable: /bin/bash
      when: claude_check.rc != 0
      environment:
        HTTPS_PROXY: "{{ lookup('env', 'HTTPS_PROXY') | default('') }}"

    - name: 4. Ensure ~/.local/bin is in PATH (bashrc)
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
        state: present
        create: yes

    - name: 5. Ensure ~/.local/bin is in PATH (profile)
      lineinfile:
        path: "{{ user_home }}/.profile"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
        state: present
        create: yes

    - name: 6. Verify Claude Code installation
      command: "{{ user_home }}/.local/bin/claude --version"
      register: claude_version
      changed_when: false
      failed_when: false

    - name: 7. Display Claude Code version
      debug:
        msg: "Claude Code installed: {{ claude_version.stdout }}"
      when: claude_version.rc == 0

    - name: 8. Configure OpenTelemetry for Claude Code
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: "{{ item.line }}"
        regexp: "{{ item.regexp }}"
        state: present
      loop:
        - { line: 'export CLAUDE_CODE_ENABLE_TELEMETRY=1',             regexp: '^export CLAUDE_CODE_ENABLE_TELEMETRY=' }
        - { line: 'export OTEL_METRICS_EXPORTER=otlp',                 regexp: '^export OTEL_METRICS_EXPORTER=' }
        - { line: 'export OTEL_LOGS_EXPORTER=otlp',                    regexp: '^export OTEL_LOGS_EXPORTER=' }
        - { line: 'export OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf',  regexp: '^export OTEL_EXPORTER_OTLP_PROTOCOL=' }
        - { line: 'export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318', regexp: '^export OTEL_EXPORTER_OTLP_ENDPOINT=' }
