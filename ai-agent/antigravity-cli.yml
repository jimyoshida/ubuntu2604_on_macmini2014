---
- name: Install Antigravity CLI
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    current_user: "{{ lookup('env', 'USER') }}"
    user_home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
          - ca-certificates
          - libsecret-1-0
        state: present
        update_cache: yes

    - name: 2. Check if Antigravity CLI (agy) is already installed
      command: which agy
      register: agy_check
      changed_when: false
      failed_when: false

    - name: 3. Download and install Antigravity CLI using official script
      shell: |
        curl -fsSL https://antigravity.google/cli/install.sh | bash
      args:
        executable: /bin/bash
      when: agy_check.rc != 0
      environment:
        HTTPS_PROXY: "{{ lookup('env', 'HTTPS_PROXY') | default('') }}"

    - name: 4. Ensure ~/.local/bin is in PATH (bashrc)
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
        state: present
        create: yes

    - name: 5. Ensure ~/.local/bin is in PATH (profile)
      lineinfile:
        path: "{{ user_home }}/.profile"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
        state: present
        create: yes

    - name: 6. Verify Antigravity CLI installation
      command: "{{ user_home }}/.local/bin/agy --version"
      register: agy_version
      changed_when: false
      failed_when: false

    - name: 7. Display Antigravity CLI version
      debug:
        msg: "Antigravity CLI installed: {{ agy_version.stdout }}"
      when: agy_version.rc == 0
