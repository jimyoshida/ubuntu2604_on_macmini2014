---
- name: n8n Workflow Automation Setup
  hosts: localhost
  connection: local
  gather_facts: no
  become: yes

  vars:
    target_user: "{{ lookup('env', 'USER') }}"
    n8n_port: "{{ lookup('env', 'N8N_PORT') | default('5678', true) }}"
    n8n_data_dir: /var/lib/n8n

  tasks:
    - name: 1. Check Docker is installed
      command: docker --version
      register: docker_check
      changed_when: false
      failed_when: docker_check.rc != 0

    - name: 2. Pull n8n Docker image
      command: docker pull n8nio/n8n
      register: docker_pull
      changed_when: "'Status: Downloaded newer image' in docker_pull.stdout or 'Pull complete' in docker_pull.stdout"

    - name: 3. Create n8n data directory
      file:
        path: "{{ n8n_data_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0750'

    - name: 4. Create n8n systemd service
      copy:
        dest: /etc/systemd/system/n8n.service
        content: |
          [Unit]
          Description=n8n Workflow Automation
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          User={{ target_user }}
          Restart=on-failure
          RestartSec=5
          ExecStartPre=-/usr/bin/docker rm -f n8n
          ExecStart=/usr/bin/docker run --rm --name n8n \
            -p {{ n8n_port }}:5678 \
            -v {{ n8n_data_dir }}:/home/node/.n8n \
            n8nio/n8n
          ExecStop=/usr/bin/docker stop n8n

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
      notify: Restart n8n

    - name: 5. Enable and start n8n service
      systemd:
        name: n8n
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: Restart n8n
      systemd:
        name: n8n
        state: restarted
        daemon_reload: yes
