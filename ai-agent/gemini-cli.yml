- name: Install Gemini CLI
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    current_user: "{{ lookup('env', 'USER') }}"
    user_home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: 1. Check system-wide Node.js is installed via apt
      command: dpkg -s nodejs
      register: nodejs_dpkg
      changed_when: false
      ignore_errors: true

    - name: 1a. Fail if Node.js is not installed as a system package
      fail:
        msg: >-
          System-wide Node.js is not installed.
          Run: sudo apt install nodejs npm
      when: nodejs_dpkg.rc != 0

    - name: 1b. Resolve node binary path
      command: which node
      register: node_path
      changed_when: false

    - name: 1c. Fail if node in PATH is managed by a version manager
      fail:
        msg: >-
          Node.js in PATH is '{{ node_path.stdout }}', which appears to be managed by a version manager.
          Ensure /usr/bin/node takes precedence, or unset version manager shims for this session.
      when: "'/usr/' not in node_path.stdout"

    - name: 2. Check if Gemini CLI is already installed
      command: which gemini
      register: gemini_check
      changed_when: false
      failed_when: false

    - name: 3. Install Gemini CLI globally via npm
      command: npm install -g @google/gemini-cli@latest
      become: true
      when: gemini_check.rc != 0

    - name: 4. Verify Gemini CLI installation
      command: gemini --version
      register: gemini_version
      changed_when: false
      failed_when: false

    - name: 5. Display Gemini CLI version
      debug:
        msg: "Gemini CLI installed: {{ gemini_version.stdout }}"
      when: gemini_version.rc == 0
