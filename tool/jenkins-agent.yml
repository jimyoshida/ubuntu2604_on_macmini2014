---
- name: Setup Jenkins inbound (JNLP) agent
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes

  vars:
    jenkins_url: "{{ lookup('env', 'JENKINS_URL') }}"
    agent_name: "{{ lookup('env', 'JENKINS_AGENT_NAME') }}"
    agent_secret: "{{ lookup('env', 'JENKINS_AGENT_SECRET') }}"
    agent_user: "{{ lookup('env', 'JENKINS_AGENT_USER') }}"
    agent_workdir_override: "{{ lookup('env', 'JENKINS_AGENT_WORKDIR') }}"

  tasks:
    - name: 1. Validate required environment variables
      assert:
        that:
          - jenkins_url | length > 0
          - agent_name | length > 0
          - agent_secret | length > 0
          - agent_user | length > 0
        fail_msg: >-
          JENKINS_URL, JENKINS_AGENT_NAME, JENKINS_AGENT_SECRET and
          JENKINS_AGENT_USER must all be set (e.g. via env.sh). Create the
          agent node on the controller first to obtain the name and secret.
        quiet: yes

    - name: 2. Look up agent user account
      getent:
        database: passwd
        key: "{{ agent_user }}"

    - name: 3. Resolve agent work directory
      set_fact:
        agent_workdir: >-
          {{ agent_workdir_override if (agent_workdir_override | length > 0)
             else (getent_passwd[agent_user][4] ~ '/jenkins-agent') }}

    - name: 4. Install Java runtime and prerequisites
      apt:
        name:
          - openjdk-21-jre-headless
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: 5. Create agent work directory
      file:
        path: "{{ agent_workdir }}"
        state: directory
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: '0750'

    - name: 6. Download agent.jar from the controller
      get_url:
        url: "{{ jenkins_url }}/jnlpJars/agent.jar"
        dest: "{{ agent_workdir }}/agent.jar"
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: '0644'
        force: yes

    - name: 7. Write agent secret to a protected file
      copy:
        content: "{{ agent_secret }}"
        dest: "{{ agent_workdir }}/secret"
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: '0600'
      no_log: true
      notify: Restart Jenkins agent

    - name: 8. Install Jenkins agent systemd service
      copy:
        dest: /etc/systemd/system/jenkins-agent.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Jenkins inbound (JNLP) agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ agent_user }}
          WorkingDirectory={{ agent_workdir }}
          ExecStart=/usr/bin/java -jar {{ agent_workdir }}/agent.jar \
            -url {{ jenkins_url }} \
            -name {{ agent_name }} \
            -secret @{{ agent_workdir }}/secret \
            -webSocket \
            -workDir {{ agent_workdir }}
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify: Restart Jenkins agent

    - name: 9. Enable and start the Jenkins agent service
      systemd:
        name: jenkins-agent
        daemon_reload: yes
        enabled: yes
        state: started

    - name: Apply any pending restart before confirming the connection
      meta: flush_handlers

    - name: 10. Wait for the agent service to be active
      command: systemctl is-active jenkins-agent
      register: agent_active
      until: agent_active.stdout == "active"
      retries: 15
      delay: 2
      changed_when: false

    # systemctl reports "active" even while the agent is stuck retrying a
    # failed handshake, so confirm it actually connected: the most recent
    # connection-state line in the journal must be "Connected". Scope the scan
    # to the current service invocation so a stale "Connected" from an earlier
    # run/restart cannot make this pass falsely.
    - name: 11. Wait for the agent to connect to the controller
      shell: |
        set -o pipefail
        inv="$(systemctl show -p InvocationID --value jenkins-agent)"
        journalctl ${inv:+_SYSTEMD_INVOCATION_ID="$inv"} -u jenkins-agent --no-pager \
          | grep -aE 'INFO: Connected|Failed to connect|Terminated|X-Remoting-Capability' \
          | tail -1 | grep -q 'INFO: Connected'
      args:
        executable: /bin/bash
      register: agent_connected
      until: agent_connected.rc == 0
      retries: 20
      delay: 3
      changed_when: false
      failed_when: false

    - name: 12. Confirm the agent connected successfully
      assert:
        that: agent_connected.rc == 0
        quiet: yes
        success_msg: "Agent '{{ agent_name }}' is connected to {{ jenkins_url }}."
        fail_msg: >-
          The jenkins-agent service is running but never connected to
          {{ jenkins_url }}. This is almost always a controller-side issue:
          the reverse proxy must allow WebSocket upgrades, the node must have
          WebSocket enabled (webSocket=true), and JENKINS_AGENT_SECRET must
          match the node's current secret. See the troubleshooting notes in
          tool/README.md, then inspect: sudo journalctl -u jenkins-agent -e

    - name: 13. Show post-install instructions
      debug:
        msg:
          - "Jenkins inbound agent '{{ agent_name }}' is running as user '{{ agent_user }}'."
          - "Controller : {{ jenkins_url }}"
          - "Work dir   : {{ agent_workdir }}"
          - "Transport  : WebSocket"
          - ""
          - "Manage the service:"
          - "  sudo systemctl status jenkins-agent"
          - "  sudo journalctl -u jenkins-agent -f"
          - ""
          - "The agent should now show as online under the node on the controller."
          - "If it stays offline, re-check JENKINS_AGENT_SECRET matches the node and"
          - "that {{ jenkins_url }} is reachable from this machine."

  handlers:
    - name: Restart Jenkins agent
      systemd:
        name: jenkins-agent
        daemon_reload: yes
        state: restarted
