---
- name: Install gomplate
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    gomplate_version: "4.3.0"

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: 2. Check if gomplate is already installed
      stat:
        path: /usr/local/bin/gomplate
      register: gomplate_check

    - name: 3. Download gomplate binary
      become: yes
      get_url:
        url: "https://github.com/hairyhenderson/gomplate/releases/download/v{{ gomplate_version }}/gomplate_linux-amd64"
        dest: /usr/local/bin/gomplate
        mode: '0755'
      when: not gomplate_check.stat.exists

    - name: 4. Verify gomplate installation
      command: gomplate --version
      register: gomplate_version_out
      changed_when: false

    - name: 5. Display gomplate version
      debug:
        msg: "{{ gomplate_version_out.stdout }}"
