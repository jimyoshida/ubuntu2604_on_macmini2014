---
- name: Install Devcontainers CLI
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: 1. Check system-wide Node.js is installed via apt
      command: dpkg -s nodejs
      register: nodejs_dpkg
      changed_when: false
      ignore_errors: true

    - name: 1a. Fail if Node.js is not installed as a system package
      fail:
        msg: >-
          System-wide Node.js is not installed.
          Run: sudo apt install nodejs npm
      when: nodejs_dpkg.rc != 0

    - name: 1b. Resolve node binary path
      command: which node
      register: node_path
      changed_when: false

    - name: 1c. Fail if node in PATH is managed by mise or nvm
      fail:
        msg: >-
          Node.js in PATH is '{{ node_path.stdout }}', which appears to be managed by mise/nvm.
          Ensure /usr/bin/node takes precedence, or unset mise/nvm shims for this session.
      when: "'/usr/' not in node_path.stdout"

    - name: 2. Check if Devcontainers CLI is already installed
      command: which devcontainer
      register: devcontainer_check
      changed_when: false
      failed_when: false

    - name: 3. Install Devcontainers CLI globally via npm
      command: npm install -g @devcontainers/cli@latest
      become: true
      when: devcontainer_check.rc != 0

    - name: 4. Verify Devcontainers CLI installation
      command: devcontainer --version
      register: devcontainer_version
      changed_when: false
      failed_when: false

    - name: 5. Display Devcontainers CLI version and usage
      debug:
        msg:
          - "Devcontainers CLI installed: {{ devcontainer_version.stdout }}"
          - ""
          - "Common devcontainer commands:"
          - "  devcontainer build                      - Build a container image"
          - "  devcontainer run-user-commands          - Run user commands in container"
          - "  devcontainer up                         - Create and start a dev container"
          - "  devcontainer open                       - Open a folder in a dev container"
          - "  devcontainer features log               - Show installed features"
          - ""
          - "Documentation: https://containers.dev"
      when: devcontainer_version.rc == 0
