---
- name: Install Bats Testing Framework via Homebrew
  hosts: localhost
  connection: local
  vars:
    brew_user: "{{ lookup('env', 'USER') }}"

  tasks:
    - name: Check if Homebrew is installed
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_check

    - name: Fail if Homebrew is not installed
      ansible.builtin.fail:
        msg: "Homebrew is not installed. Please run homebrew.yml playbook first."
      when: not brew_check.stat.exists

    - name: Update Homebrew
      become: true
      become_user: "{{ brew_user }}"
      ansible.builtin.command:
        cmd: /home/linuxbrew/.linuxbrew/bin/brew update
      changed_when: false
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"

    - name: Add bats-core tap for bats-assert and bats-support
      become: true
      become_user: "{{ brew_user }}"
      community.general.homebrew_tap:
        name: bats-core/bats-core
        state: present
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"

    - name: Install Bats testing framework via Homebrew
      become: true
      become_user: "{{ brew_user }}"
      community.general.homebrew:
        name:
          - bats-core         # Bash Automated Testing System
          - bats-assert       # Bats assertion library
          - bats-support      # Bats support library
        state: present
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"

    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "Bats testing framework installed successfully!"
          - ""
          - "  - bats-core: Bash Automated Testing System"
          - "  - bats-assert: Assertion library for Bats tests"
          - "  - bats-support: Support library for Bats tests"
          - ""
          - "Usage examples:"
          - "  bats test.bats              # Run Bats tests"
