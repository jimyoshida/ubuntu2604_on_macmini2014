---
- name: Install Modern CLI Tools via Homebrew
  hosts: localhost
  connection: local
  vars:
    brew_user: "{{ lookup('env', 'USER') }}"

  tasks:
    - name: Check if Homebrew is installed
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_check

    - name: Fail if Homebrew is not installed
      ansible.builtin.fail:
        msg: "Homebrew is not installed. Please run homebrew.yml playbook first."
      when: not brew_check.stat.exists

    - name: Update Homebrew
      become: true
      become_user: "{{ brew_user }}"
      ansible.builtin.command:
        cmd: /home/linuxbrew/.linuxbrew/bin/brew update
      changed_when: false
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"

    - name: Install modern CLI tools via Homebrew
      become: true
      become_user: "{{ brew_user }}"
      community.general.homebrew:
        name:
          - gum           # Charming CLI for building interactive scripts
          - fzf           # Fuzzy finder for command-line
          - ripgrep       # Fast recursive grep replacement (provides 'rg')
          - jq            # JSON processor (newer version than apt)
          - yq            # YAML processor like jq
          - jsonnet       # Data templating language
          - bat           # Cat clone with syntax highlighting
          - llhttp        # HTTP parser library (dependency for eza)
          - eza           # Modern replacement for ls
          - lsd           # LSDeluxe - another modern ls replacement
          - duf           # Modern replacement for df (disk usage)
          - dust          # Modern replacement for du (directory usage)
          - procs         # Modern replacement for ps
          - gdu           # Fast disk usage analyzer with TUI
          - htop          # Interactive process viewer
          - glow          # Markdown renderer for the terminal
        state: present
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}"

    - name: Ensure libllhttp.so.9.3 symlink is available for eza compatibility
      ansible.builtin.file:
        src: /home/linuxbrew/.linuxbrew/Cellar/llhttp/9.3.1/lib/libllhttp.so.9.3
        dest: /home/linuxbrew/.linuxbrew/lib/libllhttp.so.9.3
        state: link
        force: true

    - name: Create gdu symlink (Homebrew installs it as gdu-go on Linux)
      ansible.builtin.file:
        src: /home/linuxbrew/.linuxbrew/bin/gdu-go
        dest: /home/linuxbrew/.linuxbrew/bin/gdu
        state: link
        force: true

    - name: Add fzf key bindings and completion to ~/.bashrc
      become: true
      become_user: "{{ brew_user }}"
      ansible.builtin.blockinfile:
        path: "/home/{{ brew_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: fzf"
        block: |
          # fzf key bindings and fuzzy completion
          eval "$(fzf --bash)"
        create: true
        mode: '0644'

    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "Modern CLI tools installed successfully!"
          - "Installed tools:"
          - "  - gum: Interactive CLI builder"
          - "  - fzf: Fuzzy finder (key bindings added to ~/.bashrc)"
          - "  - ripgrep: Fast recursive grep replacement (provides 'rg')"
          - "  - jq: JSON processor"
          - "  - yq: YAML processor"
          - "  - jsonnet: Data templating language"
          - "  - bat: Enhanced cat with syntax highlighting"
          - "  - llhttp: HTTP parser library"
          - "  - eza: Modern replacement for ls"
          - "  - lsd: LSDeluxe - modern ls replacement"
          - "  - duf: Modern replacement for df (disk usage)"
          - "  - dust: Modern replacement for du (directory usage)"
          - "  - procs: Modern replacement for ps"
          - "  - gdu: Fast disk usage analyzer with TUI"
          - "  - htop: Interactive process viewer"
          - "  - glow: Markdown renderer for the terminal"
          - ""
          - "Source your ~/.bashrc or start a new shell to use fzf key bindings:"
          - "  source ~/.bashrc"
