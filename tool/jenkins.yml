---
- name: Install Jenkins
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes

  vars:
    target_user: "{{ lookup('env', 'USER') }}"
    jenkins_port: 8080
    jenkins_home: /var/lib/jenkins

  tasks:
    - name: 1. Install prerequisites
      apt:
        name:
          - openjdk-21-jdk
          - openjdk-21-jre
          - gnupg
          - curl
          - lsb-release
        state: present
        update_cache: yes

    - name: 2. Create directory for APT keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 3. Download Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
        dest: /etc/apt/keyrings/jenkins-archive-keyring.asc
        mode: '0644'
        force: yes

    - name: 4. Add Jenkins GPG key to apt keyring
      shell: |
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 7198F4B714ABFC68
      changed_when: false
      failed_when: false

    - name: 5. Add Jenkins apt repository
      apt_repository:
        repo: "deb https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: 6. Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: 7. Enable and start Jenkins service
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: 8. Add JENKINS_HOME to .bashrc
      become: no
      blockinfile:
        path: ~/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK - jenkins"
        block: |
          export JENKINS_HOME='{{ jenkins_home }}'
        create: yes

    - name: 9. Wait for Jenkins to be ready
      uri:
        url: "http://127.0.0.1:{{ jenkins_port }}/login"
        status_code: 200
      register: jenkins_status
      until: jenkins_status.status == 200
      retries: 30
      delay: 2

    - name: 10. Get initial admin password
      slurp:
        src: "{{ jenkins_home }}/secrets/initialAdminPassword"
      register: jenkins_password
      no_log: true

    - name: 11. Show post-install instructions
      debug:
        msg:
          - "Jenkins is installed and running on http://127.0.0.1:{{ jenkins_port }}"
          - "Initial setup wizard is waiting at the login page"
          - ""
          - "Initial Admin Password:"
          - "{{ jenkins_password['content'] | b64decode }}"
          - ""
          - "Next steps:"
          - "  1. Open http://127.0.0.1:{{ jenkins_port }}/login in your browser"
          - "  2. Paste the initial admin password above"
          - "  3. Follow the setup wizard to install plugins and create your first admin user"
          - ""
          - "CLI alias available after sourcing bashrc:"
          - "  jenkins-cli help"
          - ""
          - "NOTE: Re-open your shell (or run: source ~/.bashrc) to pick up JENKINS_HOME and jenkins-cli alias."

  handlers:
    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted
