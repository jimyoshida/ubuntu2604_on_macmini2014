---
- name: Install Visual Studio Code
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    vscode_user: "{{ lookup('env', 'USER') }}"

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
          - gpg
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: yes

    - name: 2. Check if VSCode package is already installed
      command: dpkg -l code
      register: vscode_check
      changed_when: false
      failed_when: false

    - name: 3. Download Microsoft GPG key
      become: yes
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /tmp/microsoft.asc
        mode: '0644'
      environment:
        HTTPS_PROXY: "{{ lookup('env', 'HTTPS_PROXY') | default('') }}"
      when: vscode_check.rc != 0

    - name: 4. Add Microsoft GPG key to apt keyring
      become: yes
      shell: |
        cat /tmp/microsoft.asc | gpg --dearmor > /usr/share/keyrings/packages.microsoft.gpg
      when: vscode_check.rc != 0

    - name: 5. Clean up temporary GPG key file
      become: yes
      file:
        path: /tmp/microsoft.asc
        state: absent

    - name: 6. Add VSCode repository
      become: yes
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
        filename: vscode
        state: present
      when: vscode_check.rc != 0

    - name: 7. Update apt cache
      become: yes
      apt:
        update_cache: yes
      when: vscode_check.rc != 0

    - name: 8. Install Visual Studio Code
      become: yes
      apt:
        name: code
        state: present
      when: vscode_check.rc != 0

    - name: 9. Verify VSCode installation
      command: code --version
      register: vscode_version
      changed_when: false

    - name: 10. Print installed version and instructions
      debug:
        msg:
          - "Visual Studio Code version: {{ vscode_version.stdout_lines[0] }}"
          - ""
          - "VSCode has been successfully installed"
          - ""
          - "Common VSCode commands:"
          - "  code .                      - Open current directory in VSCode"
          - "  code <file>                 - Open file in VSCode"
          - "  code --install-extension    - Install extension"
          - "  code --list-extensions      - List installed extensions"
          - "  code --disable-extensions   - Start with extensions disabled"
          - ""
          - "Recommended extensions to install:"
          - "  code --install-extension ms-python.python"
          - "  code --install-extension golang.go"
          - "  code --install-extension rust-lang.rust-analyzer"
          - "  code --install-extension redhat.ansible"
          - "  code --install-extension hashicorp.terraform"
