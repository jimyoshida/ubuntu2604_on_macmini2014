---
- name: Install junit2html
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    pipx_user: "{{ lookup('env', 'USER') }}"

  tasks:
    - name: 1. Ensure pipx is installed via apt
      apt:
        name: pipx
        state: present
        update_cache: yes
      become: true

    - name: 2. Ensure pipx bin dir is on PATH (~/.local/bin)
      command: pipx ensurepath
      register: pipx_ensurepath
      changed_when: "'is already in PATH' not in pipx_ensurepath.stdout"

    - name: 3. Install junit2html via pipx
      community.general.pipx:
        name: junit2html
        state: install

    - name: 4. Verify junit2html installation
      command: "{{ ansible_env.HOME }}/.local/bin/junit2html --help"
      register: junit2html_check
      changed_when: false
      failed_when: false

    - name: 5. Display junit2html installation result and usage
      debug:
        msg:
          - "junit2html installed successfully via pipx!"
          - ""
          - "junit2html converts JUnit XML reports into a standalone HTML report."
          - ""
          - "Common junit2html commands:"
          - "  junit2html results.xml report.html   # Convert a JUnit XML report to HTML"
          - "  junit2html results.xml               # Write HTML to stdout"
          - "  junit2html --summary-matrix *.xml    # Summarise multiple report files"
          - ""
          - "Note: junit2html lives in ~/.local/bin. Start a new shell or run"
          - "'source ~/.bashrc' if the command is not yet on your PATH."
          - ""
          - "Documentation: https://github.com/inorton/junit2html"
      when: junit2html_check.rc == 0
