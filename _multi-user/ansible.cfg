# Ansible configuration for the multi-user workstation playbooks.
#
# These push to a remote host, unlike the rest of this repo, which runs locally on the
# machine being provisioned. Ansible only picks this file up when invoked from this
# directory, so every documented command starts with `cd _multi-user`:
#
#   cd _multi-user
#   ansible -m ping workstations
#   ansible-playbook tools/gomplate.yml -e host=workstations

[defaults]
inventory = inventory.ini
host_key_checking = True
# Facts are required, not optional: the playbooks map ansible_architecture onto upstream
# release asset names and fail loudly on an unmapped value.
gathering = smart
interpreter_python = auto_silent
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
# Targets are expected to give the connecting account passwordless sudo. Where they do
# not, pass -K on the command line rather than flipping this.
become_ask_pass = False

[ssh_connection]
# Cuts one SSH round trip per task. Requires that sudo on the target not set requiretty,
# which is the default on Ubuntu.
pipelining = True
