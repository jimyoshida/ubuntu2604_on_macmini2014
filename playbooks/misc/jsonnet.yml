---
# Install jsonnet system-wide on a multi-user workstation.
#
# jsonnet's Ubuntu apt package is current enough to use as-is, so the
# multi-user story is simple:
#
#   /usr/bin/jsonnet   installed by apt, root-owned
#
# There is no per-user state and nothing to add to a shell profile.
#
# Split out from core/modern-tools.yml (like jq.yml) so it can be pinned and
# verified independently of the rest of that bundle.
#
# Usage:
#   ansible-playbook misc/jsonnet.yml -e host=<inventory host or group>
#   ansible-playbook misc/jsonnet.yml -e host=ws01 -e jsonnet_version=0.20.0+ds-3.3build1

- name: Install jsonnet system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    jsonnet_dpkg_ok: "install ok installed|"
    # apt candidate version on Ubuntu 26.04 (resolute). apt versions are
    # release-specific (see shellcheck.yml's note on the same issue), so
    # overriding this only helps if that exact dpkg version is available
    # from the target's configured apt sources.
    jsonnet_version: "0.20.0+ds-3.3build1"
    # uid/gid used to prove the install is usable by an arbitrary user
    jsonnet_verify_uid: 65534    # nobody
    jsonnet_verify_gid: 65534    # nogroup

  tasks:
    - name: 1. Check the currently installed jsonnet version
      # ${Status} as well as ${Version} -- see jsonnet_dpkg_ok above.
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' jsonnet
      register: jsonnet_installed
      changed_when: false
      # check_mode: false throughout this playbook wherever a task only
      # READS state: without it a dry run skips them, and the guards and
      # checks below then act on output that was never produced.
      check_mode: false
      failed_when: false

    - name: 2. Decide whether jsonnet needs installing
      ansible.builtin.set_fact:
        jsonnet_install_needed: >-
          {{ jsonnet_installed.rc != 0
             or jsonnet_installed.stdout != (jsonnet_dpkg_ok ~ jsonnet_version) }}
        jsonnet_can_verify: >-
          {{ not (ansible_check_mode
                  and (jsonnet_installed.rc != 0
                       or jsonnet_installed.stdout != (jsonnet_dpkg_ok ~ jsonnet_version))) }}

    - name: 2a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install jsonnet {{ jsonnet_version }}, so the version
          check and the unprivileged evaluation below are skipped rather than failed.
          Re-run without --check to verify.
      when: not (jsonnet_can_verify | bool)

    - name: 3. Install jsonnet via apt
      ansible.builtin.apt:
        name: "jsonnet={{ jsonnet_version }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: jsonnet_install_needed | bool

    - name: 4. Verify the installed jsonnet version
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' jsonnet
      register: jsonnet_version_out
      changed_when: false
      failed_when: jsonnet_version_out.stdout != (jsonnet_dpkg_ok ~ jsonnet_version)
      check_mode: false
      when: jsonnet_can_verify | bool

    - name: 5. Evaluate a jsonnet expression as an unprivileged user
      ansible.builtin.shell:
        cmd: >-
          echo '1 + 1' |
          setpriv --reuid={{ jsonnet_verify_uid }} --regid={{ jsonnet_verify_gid }} --clear-groups
          jsonnet -
        chdir: /tmp
      environment:
        HOME: /tmp
        TMPDIR: /tmp
      register: jsonnet_smoke
      changed_when: false
      failed_when: (jsonnet_smoke.stdout | trim) != '2'
      check_mode: false
      when: jsonnet_can_verify | bool

    - name: 6. Display installation summary
      ansible.builtin.debug:
        msg:
          - "jsonnet {{ jsonnet_version }} installed system-wide."
          - ""
          - "  /usr/bin/jsonnet"
          - ""
          - "Verified runnable by an unprivileged user (uid {{ jsonnet_verify_uid }})."
          - ""
          - "Usage:"
          - "  jsonnet file.jsonnet         # Evaluate a jsonnet file to JSON"
          - "  echo '{a: 1}' | jsonnet -    # Evaluate from stdin"
      when: jsonnet_can_verify | bool
