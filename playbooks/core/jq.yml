---
# Install jq system-wide on a multi-user workstation.
#
# jq's Ubuntu apt package is current enough to use as-is, so the multi-user
# story is simple:
#
#   /usr/bin/jq   installed by apt, root-owned
#
# There is no per-user state and nothing to add to a shell profile.
#
# Split out from core/modern-tools.yml (like jsonnet.yml) so it can be pinned
# and verified independently of the rest of that bundle.
#
# Usage:
#   ansible-playbook core/jq.yml -e host=<inventory host or group>
#   ansible-playbook core/jq.yml -e host=ws01 -e jq_version=1.8.1-4ubuntu2

- name: Install jq system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    jq_dpkg_ok: "install ok installed|"
    # apt candidate version on Ubuntu 26.04 (resolute). apt versions are
    # release-specific (see shellcheck.yml's note on the same issue), so
    # overriding this only helps if that exact dpkg version is available
    # from the target's configured apt sources.
    jq_version: "1.8.1-4ubuntu2"
    # uid/gid used to prove the install is usable by an arbitrary user
    jq_verify_uid: 65534    # nobody
    jq_verify_gid: 65534    # nogroup

  tasks:
    - name: 1. Check the currently installed jq version
      # ${Status} as well as ${Version} -- see jq_dpkg_ok above.
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' jq
      register: jq_installed
      changed_when: false
      # check_mode: false throughout this playbook wherever a task only
      # READS state: without it a dry run skips them, and the guards and
      # checks below then act on output that was never produced.
      check_mode: false
      failed_when: false

    - name: 2. Decide whether jq needs installing
      ansible.builtin.set_fact:
        jq_install_needed: >-
          {{ jq_installed.rc != 0
             or jq_installed.stdout != (jq_dpkg_ok ~ jq_version) }}
        jq_can_verify: >-
          {{ not (ansible_check_mode
                  and (jq_installed.rc != 0
                       or jq_installed.stdout != (jq_dpkg_ok ~ jq_version))) }}

    - name: 2a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install jq {{ jq_version }}, so the version
          check and the unprivileged filter below are skipped rather than failed.
          Re-run without --check to verify.
      when: not (jq_can_verify | bool)

    - name: 3. Install jq via apt
      ansible.builtin.apt:
        name: "jq={{ jq_version }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: jq_install_needed | bool

    - name: 4. Verify the installed jq version
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' jq
      register: jq_version_out
      changed_when: false
      failed_when: jq_version_out.stdout != (jq_dpkg_ok ~ jq_version)
      check_mode: false
      when: jq_can_verify | bool

    - name: 5. Filter a JSON value as an unprivileged user
      ansible.builtin.shell:
        cmd: >-
          echo '{"a": 1}' |
          setpriv --reuid={{ jq_verify_uid }} --regid={{ jq_verify_gid }} --clear-groups
          jq '.a'
        chdir: /tmp
      environment:
        HOME: /tmp
        TMPDIR: /tmp
      register: jq_smoke
      changed_when: false
      failed_when: (jq_smoke.stdout | trim) != '1'
      check_mode: false
      when: jq_can_verify | bool

    - name: 6. Display installation summary
      ansible.builtin.debug:
        msg:
          - "jq {{ jq_version }} installed system-wide."
          - ""
          - "  /usr/bin/jq"
          - ""
          - "Verified runnable by an unprivileged user (uid {{ jq_verify_uid }})."
          - ""
          - "Usage:"
          - "  jq '.key' file.json          # Read a value"
          - "  echo '{}' | jq '.key = 1'    # Build/transform JSON"
      when: jq_can_verify | bool
