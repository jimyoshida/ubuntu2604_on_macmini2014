---
# Install the fixed list of general-purpose CLI packages system-wide on a
# multi-user workstation.
#
#   /usr/bin/<tool>                    for every package that ships a binary
#
# All fourteen packages already come from Ubuntu's own apt archive, so unlike
# most of _multi-user/tools/ this migration needed no reach work: the source
# playbook (core/misc-tools.yml, renamed from core/agent-base.yml on
# 2026-08-14 and from core/core-tools.yml on 2026-08-25) already installs to
# root-owned /usr paths. What it does not do
# is pin anything (plain `state: present` on all of them) or verify that any
# of them actually work, so this is pure correctness work: version-aware
# idempotency (policy point 6) and per-package unprivileged verification
# (policy point 9).
#
# The verification list is heterogeneous on purpose, not twelve copies of
# `--version`: two packages do not fit that shape at all.
#   - aha has no reliable --version output. Verified by feeding it a
#     real ANSI escape sequence and checking it did real work: converted to
#     an HTML document, not just echoed back.
#   - docx2txt has no --version output either. Verified the same way: built
#     a minimal real .docx and checked the extracted text came back correctly.
# Every verify_cmd below was confirmed against the actual installed binary
# rather than carried over from documentation, which is worth doing rather
# than assuming: several plausible-looking guesses turned out to be wrong.
#
# A verify_cmd must FAIL when the binary is absent, which is not automatic:
# `<tool> --version 2>&1 | grep -qi '<tool>'` passes with the tool uninstalled,
# because the shell's own "bash: <tool>: command not found" contains the tool's
# name and 2>&1 feeds it straight into the grep. ncat's verify_cmd had that
# shape and was vacuous until it was found on ws02: only redirect stderr when
# the tool actually writes its version there, and always grep for a version-
# bearing string rather than the tool's own name.
#
# There is no shell configuration here, and the only per-user state any of
# these creates is parallel's: running a job -- not `--version`, which writes
# nothing -- makes ~/.parallel/tmp in the invoking account's own home, which
# is exactly where it belongs. Nothing here writes into anyone's $HOME (the
# unprivileged checks get the scratch one below), so there is nothing else
# for B2/B3 to say and nothing to add to a shell profile.
#
# Usage:
#   ansible-playbook core/misc-tools.yml -e host=<inventory host or group>

- name: Install misc CLI tools system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    misc_tools_dpkg_ok: "install ok installed|"
    # apt candidate versions on Ubuntu 26.04 (resolute), checked 2026-08-15.
    # Like modern-tools.yml's pins, these are release-specific: overriding
    # one only helps if that exact dpkg version is available from the
    # target's configured apt sources.
    misc_tools_packages:
      - name: curl
        # Advanced from 8.18.0-1ubuntu2.3, which resolute-updates superseded
        # and the archive no longer carries -- so the pin was unsatisfiable on
        # every host, and because task 3 installs all fourteen packages in
        # one apt transaction, that one stale pin blocked the other
        # thirteen too.
        # The verify_cmd matches on the upstream version alone, so it needs no
        # change when the Ubuntu revision moves.
        version: "8.18.0-1ubuntu2.4"
        verify_cmd: "curl --version | grep -q '^curl 8.18.0'"
      - name: gnupg
        version: "2.4.8-4ubuntu3"
        verify_cmd: "gpg --version | grep -q 'gpg (GnuPG) 2.4.8'"
      - name: git
        version: "1:2.53.0-1ubuntu1"
        verify_cmd: "git --version | grep -q 'git version 2.53.0'"
      - name: git-lfs
        version: "3.7.1-1"
        verify_cmd: "git lfs version | grep -q '^git-lfs/3.7.1'"
      - name: git-secret
        version: "0.5.0-1build1"
        verify_cmd: "git secret --version | grep -q '^0.5.0$'"
      # mailutils recommends default-mta (postfix), which task 3 no longer
      # pulls in now that install_recommends is false -- see that task.
      - name: mailutils
        version: "1:3.20-3build1"
        verify_cmd: "dotlock --version | grep -q 'GNU Mailutils 3.20'"
      - name: jq
        version: "1.8.1-4ubuntu1"
        verify_cmd: "jq --version | grep -q 'jq-1.8.1'"
      - name: xlsx2csv
        version: "1:0.8.3-1build1"
        verify_cmd: "xlsx2csv --version | grep -q '^0.8.3$'"
      # docx2txt has no --version output at all (like aha): verified by
      # building a minimal real .docx -- a zip with a bare
      # word/document.xml and word/_rels/document.xml.rels, no XML
      # declaration or namespace attributes needed since docx2txt's
      # extraction is regex-based, not a real XML parser -- and checking the
      # extracted text comes back correctly. Built with python3's zipfile
      # rather than the zip binary, which this playbook no longer installs.
      # Single-quoted throughout: this verify_cmd is spliced into a
      # double-quoted bash -c string in task 6, so it must not contain a
      # literal double quote -- the zipfile one-liner takes its filenames as
      # argv instead of string literals so it needs no quotes of its own.
      - name: docx2txt
        version: "1.4-5build1"
        verify_cmd: >-
          mkdir -p word/_rels
          && printf '<w:document><w:body><w:p><w:r><w:t>misc-tools-smoke-test</w:t></w:r></w:p></w:body></w:document>' > word/document.xml
          && printf '<Relationships></Relationships>' > word/_rels/document.xml.rels
          && python3 -c 'import sys,zipfile;z=zipfile.ZipFile(sys.argv[1],sys.argv[2]);z.write(sys.argv[3]);z.write(sys.argv[4]);z.close()' smoke.docx w word/document.xml word/_rels/document.xml.rels
          && docx2txt smoke.docx - | grep -q 'misc-tools-smoke-test'
      - name: net-tools
        version: "2.10-2ubuntu1"
        verify_cmd: "netstat --version | grep -q 'net-tools 2.10'"
      # ncat really does print its version to stderr, so it keeps 2>&1 --
      # but greps for the version line, which "command not found" cannot
      # match.
      - name: ncat
        version: "7.98+dfsg-1"
        verify_cmd: "ncat --version 2>&1 | grep -q 'Ncat: Version 7.98'"
      - name: make
        version: "4.4.1-3"
        verify_cmd: "make --version | grep -q 'GNU Make 4.4.1'"
      # The one verify_cmd here that does real work rather than reading a
      # version string: running jobs is GNU parallel's whole purpose, so this
      # runs three of them and checks their combined output. Ubuntu's package
      # prints no citation notice -- confirmed, an unprivileged run writes
      # nothing at all to stderr -- so there is nothing to silence for it.
      - name: parallel
        version: "20240222+ds-3"
        verify_cmd: >-
          parallel --version | grep -q '^GNU parallel 20240222'
          && seq 3 | parallel echo | sort | tr '\n' ' ' | grep -q '1 2 3'
    misc_tools_aha_version: "0.5.1-3build2"
    misc_tools_smoke_home: /var/tmp/misc-tools-smoke-home
    # uid/gid used to prove the install is usable by an arbitrary user
    misc_tools_verify_uid: 65534    # nobody
    misc_tools_verify_gid: 65534    # nogroup

  tasks:
    - name: 1. Check the currently installed version of each package
      # ${Status} as well as ${Version}: dpkg-query reports a version for a
      # package in `deinstall ok config-files` state -- removed, binary gone,
      # only conffiles retained -- so a ${Version}-only guard reads that as
      # "already at the pin" and never reinstalls it. Found on ws02, where a
      # removed figlet was skipped here and then reported as installed by
      # task 4, which had the identical blindness.
      ansible.builtin.command: "dpkg-query -W -f='${Status}|${Version}' {{ item.name }}"
      register: misc_tools_installed
      loop: >-
        {{ misc_tools_packages
           + [{'name': 'aha', 'version': misc_tools_aha_version}] }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 2. Decide which packages need installing
      # A single filtered list, rather than a per-package task, so the
      # install task below is one apt-get invocation instead of twenty-three.
      ansible.builtin.set_fact:
        misc_tools_pending: "{{ misc_tools_pending | default([]) + [item.item.name ~ '=' ~ item.item.version] }}"
      loop: "{{ misc_tools_installed.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: (item.stdout | default('')) != (misc_tools_dpkg_ok ~ item.item.version)

    - name: 2a. Decide whether this run can verify what it installed
      ansible.builtin.set_fact:
        misc_tools_can_verify: >-
          {{ not (ansible_check_mode
                  and (misc_tools_pending | default([]) | length > 0)) }}

    - name: 2b. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install
          {{ misc_tools_pending | default([]) | join(', ') }}, so the version
          checks and the unprivileged verify commands below are skipped
          rather than failed. Re-run without --check to verify.
      when: not (misc_tools_can_verify | bool)

    - name: 3. Install the packages that need installing
      # install_recommends: false -- added for mailutils, whose only
      # recommendation is default-mta (postfix): pulling in a full mail
      # server as a side effect of a CLI tool list is not what this playbook
      # is for. Applies to all fourteen packages, not just mailutils, which
      # is the intended, minimal-footprint behavior for this playbook.
      ansible.builtin.apt:
        name: "{{ misc_tools_pending | default([]) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        allow_downgrade: true
        install_recommends: false
      when: (misc_tools_pending | default([])) | length > 0

    - name: 4. Verify the installed version of each package
      # Same ${Status} reasoning as task 1: without it this reports a
      # config-files leftover as a satisfied pin and the summary prints a
      # version for a package whose binary is not on the host.
      ansible.builtin.command: "dpkg-query -W -f='${Status}|${Version}' {{ item.name }}"
      register: misc_tools_version_out
      loop: >-
        {{ misc_tools_packages
           + [{'name': 'aha', 'version': misc_tools_aha_version}] }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      failed_when: misc_tools_version_out.stdout != (misc_tools_dpkg_ok ~ item.version)
      check_mode: false
      when: misc_tools_can_verify | bool

    - name: 5. Create a scratch HOME for the unprivileged checks
      ansible.builtin.file:
        path: "{{ misc_tools_smoke_home }}"
        state: directory
        owner: "{{ misc_tools_verify_uid }}"
        group: "{{ misc_tools_verify_gid }}"
        mode: '0700'
      check_mode: false

    - name: 6. Run each package's verify command as an unprivileged user
      # chdir into the scratch HOME, not ansible's own working directory:
      # uid 65534 cannot stat this playbook's checkout path, and git (lfs,
      # secret) stats the current directory just to start up, which failed
      # here on the first run with "Permission denied" before this was added.
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ misc_tools_verify_uid }} --regid={{ misc_tools_verify_gid }} --clear-groups
          env HOME={{ misc_tools_smoke_home }} bash -c "{{ item.verify_cmd }}"
        chdir: "{{ misc_tools_smoke_home }}"
      loop: "{{ misc_tools_packages }}"
      loop_control:
        label: "{{ item.name }}"
      register: misc_tools_smoke
      changed_when: false
      failed_when: misc_tools_smoke.rc != 0
      check_mode: false
      when: misc_tools_can_verify | bool

    - name: 7. Convert an ANSI escape sequence to HTML as an unprivileged user (aha)
      # aha's --version output is not reliable enough to pin a match string
      # against, so this proves real work instead: a bold ANSI escape must
      # come back as an actual HTML document, not merely echoed unchanged.
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ misc_tools_verify_uid }} --regid={{ misc_tools_verify_gid }} --clear-groups
          env HOME={{ misc_tools_smoke_home }} bash -c
          "printf '\\033[1mmulti-user-smoke-test\\033[0m\\n' | aha"
        chdir: "{{ misc_tools_smoke_home }}"
      register: misc_tools_aha_smoke
      changed_when: false
      failed_when: >-
        'multi-user-smoke-test' not in misc_tools_aha_smoke.stdout
        or '<html' not in (misc_tools_aha_smoke.stdout | lower)
      check_mode: false
      when: misc_tools_can_verify | bool

    - name: 8. Remove the scratch HOME
      ansible.builtin.file:
        path: "{{ misc_tools_smoke_home }}"
        state: absent
      check_mode: false

    - name: 9. Display installation summary
      # Built as a real Jinja list, not a folded string joined on a literal
      # '\n' -- confirmed at run time that a '\n' inside a >- folded scalar
      # never reaches Jinja as an escape (YAML block scalars do not process
      # backslash escapes, so it stays two literal characters). A YAML/Jinja
      # list handed straight to debug's msg prints one line per element with
      # no join or escaping needed at all.
      ansible.builtin.debug:
        msg: >-
          {{ ['Misc CLI tools installed system-wide:']
             + ((misc_tools_packages | map(attribute='name') | list)
                | zip(misc_tools_packages | map(attribute='version') | list)
                | map('join', ' ')
                | map('regex_replace', '^', '  ')
                | list)
             + ['  aha ' ~ misc_tools_aha_version,
                '',
                'Verified runnable by an unprivileged user (uid ' ~ misc_tools_verify_uid ~ ').',
                'No shell configuration was changed and no per-user state was written.'] }}
      when: misc_tools_can_verify | bool
