---
# Install the fixed list of general-purpose CLI packages system-wide on a
# multi-user workstation.
#
#   /usr/bin/<tool>                    for every package that ships a binary
#   /etc/ssl/certs/ca-certificates.crt the one package here with no binary
#
# All eighteen packages already come from Ubuntu's own apt archive, so unlike
# most of _multi-user/tools/ this migration needed no reach work: the source
# playbook (core/core-tools.yml, renamed from core/agent-base.yml on
# 2026-08-14) already installs to root-owned /usr paths. What it does not do
# is pin anything (plain `state: present` on all of them) or verify that any
# of them actually work, so this is pure correctness work: version-aware
# idempotency (policy point 6) and per-package unprivileged verification
# (policy point 9).
#
# The verification list is heterogeneous on purpose, not fifteen copies of
# `--version`: two packages do not fit that shape at all.
#   - ca-certificates ships no binary. Verified by checking the bundle file
#     itself: present, non-empty, world-readable.
#   - aha has no reliable --version output. Verified by feeding it a
#     real ANSI escape sequence and checking it did real work: converted to
#     an HTML document, not just echoed back.
# Every verify_cmd below was confirmed against the actual installed binary
# rather than carried over from documentation, which is worth doing rather
# than assuming: several plausible-looking guesses turned out to be wrong.
#
# A verify_cmd must FAIL when the binary is absent, which is not automatic:
# `<tool> --version 2>&1 | grep -qi '<tool>'` passes with the tool uninstalled,
# because the shell's own "bash: <tool>: command not found" contains the tool's
# name and 2>&1 feeds it straight into the grep. Three commands here had that
# shape (ncat, figlet, dos2unix) and were vacuous until it was found on ws02.
# So: only redirect stderr when the tool actually writes its version there
# (ncat does; figlet and dos2unix do not), and always grep for a version-
# bearing string rather than the tool's own name.
#
# There is no shell configuration here, and the only per-user state any of
# these creates is parallel's: running a job -- not `--version`, which writes
# nothing -- makes ~/.parallel/tmp in the invoking account's own home, which
# is exactly where it belongs. Nothing here writes into anyone's $HOME (the
# unprivileged checks get the scratch one below), so there is nothing else
# for B2/B3 to say and nothing to add to a shell profile.
#
# Usage:
#   ansible-playbook core/core-tools.yml -e host=<inventory host or group>

- name: Install core CLI tools system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # apt candidate versions on Ubuntu 26.04 (resolute), checked 2026-08-15.
    # Like modern-tools.yml's pins, these are release-specific: overriding
    # one only helps if that exact dpkg version is available from the
    # target's configured apt sources.
    core_tools_packages:
      - name: curl
        version: "8.18.0-1ubuntu2.3"
        verify_cmd: "curl --version | grep -q '^curl 8.18.0'"
      - name: gnupg
        version: "2.4.8-4ubuntu3"
        verify_cmd: "gpg --version | grep -q 'gpg (GnuPG) 2.4.8'"
      - name: lsb-release
        version: "12.1-2build1"
        verify_cmd: "lsb_release -a 2>/dev/null | grep -q '^Distributor ID:.*Ubuntu'"
      - name: git
        version: "1:2.53.0-1ubuntu1"
        verify_cmd: "git --version | grep -q 'git version 2.53.0'"
      - name: git-lfs
        version: "3.7.1-1"
        verify_cmd: "git lfs version | grep -q '^git-lfs/3.7.1'"
      - name: git-secret
        version: "0.5.0-1build1"
        verify_cmd: "git secret --version | grep -q '^0.5.0$'"
      - name: python3-pip
        version: "25.1.1+dfsg-1ubuntu2"
        verify_cmd: "python3 -m pip --version | grep -q 'pip 25.1.1'"
      - name: zip
        version: "3.0-15ubuntu3"
        verify_cmd: "zip -v | grep -q 'This is Zip 3.0'"
      - name: unzip
        version: "6.0-29ubuntu1"
        verify_cmd: "unzip -v | grep -q 'UnZip 6.00'"
      - name: vim
        version: "2:9.1.2141-1ubuntu4.7"
        verify_cmd: "vim --version | grep -q 'VIM - Vi IMproved 9.1'"
      - name: net-tools
        version: "2.10-2ubuntu1"
        verify_cmd: "netstat --version | grep -q 'net-tools 2.10'"
      # ncat is the one of these three that really does print its version to
      # stderr, so it keeps 2>&1 -- but greps for the version line, which
      # "command not found" cannot match.
      - name: ncat
        version: "7.98+dfsg-1"
        verify_cmd: "ncat --version 2>&1 | grep -q 'Ncat: Version 7.98'"
      - name: figlet
        version: "2.2.5-3.1"
        verify_cmd: "figlet -v | grep -q 'Version: 2.2.5'"
      - name: dos2unix
        version: "7.5.4-1"
        verify_cmd: "dos2unix -V | grep -q '^dos2unix 7.5.4'"
      - name: make
        version: "4.4.1-3"
        verify_cmd: "make --version | grep -q 'GNU Make 4.4.1'"
      # The one verify_cmd here that does real work rather than reading a
      # version string: running jobs is GNU parallel's whole purpose, so this
      # runs three of them and checks their combined output. Ubuntu's package
      # prints no citation notice -- confirmed, an unprivileged run writes
      # nothing at all to stderr -- so there is nothing to silence for it.
      - name: parallel
        version: "20240222+ds-3"
        verify_cmd: >-
          parallel --version | grep -q '^GNU parallel 20240222'
          && seq 3 | parallel echo | sort | tr '\n' ' ' | grep -q '1 2 3'
    # ca-certificates ships no binary, so it is installed with the rest but
    # verified separately (task 8), not through core_tools_packages.
    core_tools_ca_certificates_version: "20260601~26.04.1"
    core_tools_aha_version: "0.5.1-3build2"
    core_tools_smoke_home: /var/tmp/core-tools-smoke-home
    # uid/gid used to prove the install is usable by an arbitrary user
    core_tools_verify_uid: 65534    # nobody
    core_tools_verify_gid: 65534    # nogroup

  tasks:
    - name: 1. Check the currently installed version of each package
      # ${Status} as well as ${Version}: dpkg-query reports a version for a
      # package in `deinstall ok config-files` state -- removed, binary gone,
      # only conffiles retained -- so a ${Version}-only guard reads that as
      # "already at the pin" and never reinstalls it. Found on ws02, where a
      # removed figlet was skipped here and then reported as installed by
      # task 4, which had the identical blindness.
      ansible.builtin.command: "dpkg-query -W -f='${Status}|${Version}' {{ item.name }}"
      register: core_tools_installed
      loop: >-
        {{ core_tools_packages
           + [{'name': 'ca-certificates', 'version': core_tools_ca_certificates_version},
              {'name': 'aha', 'version': core_tools_aha_version}] }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 2. Decide which packages need installing
      # A single filtered list, rather than a per-package task, so the
      # install task below is one apt-get invocation instead of nineteen.
      ansible.builtin.set_fact:
        core_tools_pending: "{{ core_tools_pending | default([]) + [item.item.name ~ '=' ~ item.item.version] }}"
      loop: "{{ core_tools_installed.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: (item.stdout | default('')) != ('install ok installed|' ~ item.item.version)

    - name: 3. Install the packages that need installing
      ansible.builtin.apt:
        name: "{{ core_tools_pending | default([]) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        allow_downgrade: true
      when: (core_tools_pending | default([])) | length > 0

    - name: 4. Verify the installed version of each package
      # Same ${Status} reasoning as task 1: without it this reports a
      # config-files leftover as a satisfied pin and the summary prints a
      # version for a package whose binary is not on the host.
      ansible.builtin.command: "dpkg-query -W -f='${Status}|${Version}' {{ item.name }}"
      register: core_tools_version_out
      loop: >-
        {{ core_tools_packages
           + [{'name': 'ca-certificates', 'version': core_tools_ca_certificates_version},
              {'name': 'aha', 'version': core_tools_aha_version}] }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      failed_when: core_tools_version_out.stdout != ('install ok installed|' ~ item.version)

    - name: 5. Verify the ca-certificates bundle
      # ca-certificates ships no binary -- policy point 9's "exercise the
      # tool" becomes "confirm the data file it installs is real and
      # readable by everyone", which is the equivalent check for a package
      # with no executable to run.
      ansible.builtin.stat:
        path: /etc/ssl/certs/ca-certificates.crt
      register: core_tools_ca_bundle

    - name: 6. Assert the ca-certificates bundle is present, non-empty and world-readable
      ansible.builtin.assert:
        that:
          - core_tools_ca_bundle.stat.exists
          - core_tools_ca_bundle.stat.size > 0
          - core_tools_ca_bundle.stat.roth
        fail_msg: >-
          /etc/ssl/certs/ca-certificates.crt is missing, empty, or not
          world-readable.

    - name: 7. Create a scratch HOME for the unprivileged checks
      ansible.builtin.file:
        path: "{{ core_tools_smoke_home }}"
        state: directory
        owner: "{{ core_tools_verify_uid }}"
        group: "{{ core_tools_verify_gid }}"
        mode: '0700'
      check_mode: false

    - name: 8. Run each package's verify command as an unprivileged user
      # chdir into the scratch HOME, not ansible's own working directory:
      # uid 65534 cannot stat this playbook's checkout path, and git (lfs,
      # secret) stats the current directory just to start up, which failed
      # here on the first run with "Permission denied" before this was added.
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ core_tools_verify_uid }} --regid={{ core_tools_verify_gid }} --clear-groups
          env HOME={{ core_tools_smoke_home }} bash -c "{{ item.verify_cmd }}"
        chdir: "{{ core_tools_smoke_home }}"
      loop: "{{ core_tools_packages }}"
      loop_control:
        label: "{{ item.name }}"
      register: core_tools_smoke
      changed_when: false
      failed_when: core_tools_smoke.rc != 0

    - name: 9. Convert an ANSI escape sequence to HTML as an unprivileged user (aha)
      # aha's --version output is not reliable enough to pin a match string
      # against, so this proves real work instead: a bold ANSI escape must
      # come back as an actual HTML document, not merely echoed unchanged.
      ansible.builtin.shell:
        cmd: >-
          setpriv --reuid={{ core_tools_verify_uid }} --regid={{ core_tools_verify_gid }} --clear-groups
          env HOME={{ core_tools_smoke_home }} bash -c
          "printf '\\033[1mmulti-user-smoke-test\\033[0m\\n' | aha"
        chdir: "{{ core_tools_smoke_home }}"
      register: core_tools_aha_smoke
      changed_when: false
      failed_when: >-
        'multi-user-smoke-test' not in core_tools_aha_smoke.stdout
        or '<html' not in (core_tools_aha_smoke.stdout | lower)

    - name: 10. Remove the scratch HOME
      ansible.builtin.file:
        path: "{{ core_tools_smoke_home }}"
        state: absent
      check_mode: false

    - name: 11. Display installation summary
      # Built as a real Jinja list, not a folded string joined on a literal
      # '\n' -- confirmed at run time that a '\n' inside a >- folded scalar
      # never reaches Jinja as an escape (YAML block scalars do not process
      # backslash escapes, so it stays two literal characters). A YAML/Jinja
      # list handed straight to debug's msg prints one line per element with
      # no join or escaping needed at all.
      ansible.builtin.debug:
        msg: >-
          {{ ['Core CLI tools installed system-wide:']
             + ((core_tools_packages | map(attribute='name') | list)
                | zip(core_tools_packages | map(attribute='version') | list)
                | map('join', ' ')
                | map('regex_replace', '^', '  ')
                | list)
             + ['  ca-certificates ' ~ core_tools_ca_certificates_version,
                '  aha ' ~ core_tools_aha_version,
                '',
                'Verified runnable by an unprivileged user (uid ' ~ core_tools_verify_uid ~ ').',
                'No shell configuration was changed and no per-user state was written.'] }}
