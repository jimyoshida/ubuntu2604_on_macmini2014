---
# Install promtool and amtool system-wide on a multi-user workstation.
#
#   /usr/bin/promtool   from the `promtool` package
#   /usr/bin/amtool     from the `prometheus-alertmanager` package
#
# Both are Ubuntu archive packages installed to root-owned paths, so this
# migration is correctness work: the source playbook (cloud-cli/
# prometheus-cli.yml) installed the same two packages unpinned and with no
# verification of any kind.
#
# This installs CLI tools only. The `prometheus-alertmanager` package exists
# here purely because it is what ships amtool; its daemon is stopped and
# disabled, exactly as the source playbook did. Deploying an actual
# Alertmanager is out of scope for this repository.
#
# There is no per-user state to speak of: amtool reads an optional
# ~/.config/amtool/config.yml, which this playbook does not create for anyone.
#
# Usage:
#   ansible-playbook cloud-cli/promtool.yml -e host=<inventory host or group>
#   ansible-playbook cloud-cli/promtool.yml -e host=ws01 -e promtool_version=2.53.5+ds1-3

- name: Install promtool and amtool system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    promtool_dpkg_ok: "install ok installed|"
    # Ubuntu archive (resolute/universe) versions. Unlike the vendor-repo
    # playbooks these pins are release-specific: apt candidates differ between
    # 24.04 and 26.04, and an install fails outright when the pin is not what
    # the target's sources carry. Check `apt-cache policy` on the target
    # before bumping -- the same caveat core/shellcheck.yml carries.
    promtool_version: "2.53.5+ds1-3"
    alertmanager_version: "0.28.1+ds-3"
    promtool_smoke_dir: /var/tmp/promtool-smoke
    # uid/gid used to prove the install is usable by an arbitrary user
    promtool_verify_uid: 65534    # nobody
    promtool_verify_gid: 65534    # nogroup

  tasks:
    - name: 1. Check the currently installed promtool and alertmanager versions
      # One dpkg-query for both packages. It exits non-zero when either is
      # absent while still printing the one that is present, hence
      # failed_when: false. check_mode: false because this reads state that
      # already exists -- a skipped command task registers rc 0 and an empty
      # stdout, which task 2 would read as "neither is at the pinned version",
      # true here by accident rather than by measurement.
      # ${Status} as well as ${Version} -- see promtool_dpkg_ok above.
      ansible.builtin.command:
        cmd: dpkg-query -W -f='${Package} ${Status}|${Version}\n' promtool prometheus-alertmanager
      register: promtool_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 2. Decide whether either package needs installing
      ansible.builtin.set_fact:
        promtool_install_needed: >-
          {{ ('promtool ' ~ promtool_dpkg_ok ~ promtool_version)
             not in promtool_installed.stdout
               or ('prometheus-alertmanager ' ~ promtool_dpkg_ok ~ alertmanager_version)
                  not in promtool_installed.stdout }}
        promtool_can_verify: >-
          {{ not (ansible_check_mode
                  and (('promtool ' ~ promtool_dpkg_ok ~ promtool_version)
                     not in promtool_installed.stdout
                         or ('prometheus-alertmanager ' ~ promtool_dpkg_ok ~ alertmanager_version)
                            not in promtool_installed.stdout)) }}

    - name: 2a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install promtool {{ promtool_version }} /
          prometheus-alertmanager {{ alertmanager_version }}, so the daemon
          disable, the version check and both config-check smoke tests below
          are skipped rather than failed. Re-run without --check to verify.
      when: not (promtool_can_verify | bool)

    - name: 3. Install promtool and prometheus-alertmanager via apt
      # allow_downgrade so that moving a pin backwards actually applies:
      # without it apt refuses, and the pin silently means "this version or
      # anything newer already present".
      ansible.builtin.apt:
        name:
          - "promtool={{ promtool_version }}"
          - "prometheus-alertmanager={{ alertmanager_version }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        allow_downgrade: true
      when: promtool_install_needed | bool

    - name: 4. Stop and disable the Alertmanager daemon
      # This playbook installs a client. The package ships a service unit and
      # enables it on install, which on a workstation means an Alertmanager
      # listening on :9093 that nobody asked for. Carried over from the source
      # playbook, which was right to do it.
      ansible.builtin.systemd:
        name: prometheus-alertmanager
        enabled: false
        state: stopped
      when: promtool_can_verify | bool

    - name: 5. Verify the installed package versions
      ansible.builtin.command:
        cmd: dpkg-query -W -f='${Package} ${Status}|${Version}\n' promtool prometheus-alertmanager
      register: promtool_dpkg
      changed_when: false
      failed_when: >-
        ('promtool ' ~ promtool_dpkg_ok ~ promtool_version) not in promtool_dpkg.stdout
          or ('prometheus-alertmanager ' ~ promtool_dpkg_ok ~ alertmanager_version)
             not in promtool_dpkg.stdout
      when: promtool_can_verify | bool

    - name: 6. Create the scratch directory for the unprivileged checks
      # Disk-backed rather than /tmp, which is a size-capped tmpfs on these
      # hosts (see POLICY.md's C4). World-readable, since the configs written
      # into it are read back by uid 65534.
      ansible.builtin.file:
        path: "{{ promtool_smoke_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: promtool_can_verify | bool

    - name: 7. Write the configs the unprivileged checks validate
      # Deliberately minimal but genuinely valid: each exercises the real
      # parser and semantic validation, which is A4's strongest form of
      # verification -- offline real work rather than a version string.
      ansible.builtin.copy:
        dest: "{{ promtool_smoke_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: '0644'
        content: "{{ item.content }}"
      loop:
        - name: prometheus.yml
          content: |
            global:
              scrape_interval: 15s
            scrape_configs:
              - job_name: prometheus
                static_configs:
                  - targets: ['localhost:9090']
        - name: alertmanager.yml
          content: |
            route:
              receiver: default
            receivers:
              - name: default
      loop_control:
        label: "{{ item.name }}"
      when: promtool_can_verify | bool

    - name: 8. Check a Prometheus config as an unprivileged user
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ promtool_verify_uid }} --regid={{ promtool_verify_gid }} --clear-groups
          promtool check config {{ promtool_smoke_dir }}/prometheus.yml
      register: promtool_smoke_promtool
      changed_when: false
      failed_when: "'SUCCESS' not in promtool_smoke_promtool.stdout"
      when: promtool_can_verify | bool

    - name: 9. Check an Alertmanager config as an unprivileged user
      # amtool reads an optional ~/.config/amtool/config.yml. HOME is left
      # pointing wherever setpriv leaves it rather than given a scratch
      # directory: the absence of that file is part of the zero-configuration
      # path under test, and amtool tolerates it.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ promtool_verify_uid }} --regid={{ promtool_verify_gid }} --clear-groups
          amtool check-config {{ promtool_smoke_dir }}/alertmanager.yml
      register: promtool_smoke_amtool
      changed_when: false
      failed_when: "'SUCCESS' not in promtool_smoke_amtool.stdout"
      when: promtool_can_verify | bool

    - name: 10. Remove the scratch directory
      ansible.builtin.file:
        path: "{{ promtool_smoke_dir }}"
        state: absent

    - name: 11. Display installation summary
      ansible.builtin.debug:
        msg:
          - >-
            promtool {{ promtool_version }} and amtool {{ alertmanager_version }}
            {{ promtool_can_verify | bool
               | ternary('are installed system-wide.', 'would be installed system-wide.') }}
          - ""
          - "  /usr/bin/promtool"
          - "  /usr/bin/amtool"
          - ""
          - >-
            {{ promtool_can_verify | bool
               | ternary('Both validated a real config file when run by an unprivileged user (uid '
                         ~ promtool_verify_uid ~ '); the Alertmanager daemon is stopped and disabled.',
                         'Not verified: this was a --check run against a host without these versions.') }}
          - ""
          - "This installs CLI tools only -- no Prometheus or Alertmanager server runs here."
          - ""
          - "Usage:"
          - "  promtool check config prometheus.yml    # validate a Prometheus config"
          - "  promtool check rules rules.yml          # validate recording/alerting rules"
          - "  promtool test rules tests.yml           # unit-test alerting rules"
          - "  amtool check-config alertmanager.yml    # validate an Alertmanager config"
          - "  amtool --alertmanager.url=<url> alert query   # query a remote Alertmanager"
