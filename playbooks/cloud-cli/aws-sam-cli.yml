  tasks:
    - name: 1. Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Fail on an unsupported CPU architecture
      ansible.builtin.fail:
        msg: >-
          No AWS SAM CLI installer is mapped for architecture
          '{{ ansible_facts['architecture'] }}'. Add it to
          aws_sam_cli_arch_map.
      when: aws_sam_cli_arch | length == 0

    - name: 3. Check the currently installed AWS SAM CLI version
      ansible.builtin.command: "{{ aws_sam_cli_bin }} --version"
      register: aws_sam_cli_installed
      changed_when: false
      # check_mode: false throughout this playbook wherever a task only
      # READS state: without it a dry run skips them and the checks below
      # act on output that was never produced.
      check_mode: false
      failed_when: false

    - name: 4. Decide whether the AWS SAM CLI needs installing
      # The version is compared, not merely the presence of the binary, so
      # that bumping aws_sam_cli_version actually replaces the install.
      ansible.builtin.set_fact:
        aws_sam_cli_install_needed: >-
          {{ (aws_sam_cli_installed.stdout | default('') | trim) != aws_sam_cli_version_line }}
        aws_sam_cli_can_verify: >-
          {{ not (ansible_check_mode
                  and (aws_sam_cli_installed.stdout | default('') | trim) != aws_sam_cli_version_line) }}

    - name: 4a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install the AWS SAM CLI {{ aws_sam_cli_version }},
          so the version check and the unprivileged event-generation check
          below are skipped rather than failed. Re-run without --check to
          verify.
      when: not (aws_sam_cli_can_verify | bool)

    - name: 5. Create the staging directories
      # The gnupg subdirectory is created here rather than left to gpg: under
      # --batch, gpg will not create a missing --homedir and fails with
      # "no writable keyring found" instead. 0700 is required, or gpg warns
      # about unsafe permissions on every invocation.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ aws_sam_cli_stage_dir }}"
        - "{{ aws_sam_cli_stage_dir }}/gnupg"
      when:
        - aws_sam_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either -- and get_url, unlike command, is NOT
        # skipped in check mode, so it really does try to download.
        - not ansible_check_mode

    - name: 6. Write the AWS SAM CLI signing keys
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ aws_sam_cli_stage_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - name: aws-sam-cli-primary-key.asc
          content: "{{ aws_sam_cli_primary_key }}"
        - name: aws-sam-cli-signer-key.asc
          content: "{{ aws_sam_cli_signer_key }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 7. Download the AWS SAM CLI installer and its signature
      ansible.builtin.get_url:
        url: "{{ aws_sam_cli_base_url }}/{{ item }}"
        dest: "{{ aws_sam_cli_stage_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - "{{ aws_sam_cli_zip }}"
        - "{{ aws_sam_cli_zip }}.sig"
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 8. Import both signing keys into a throwaway keyring
      # A staging GNUPGHOME rather than root's own keyring: these keys are
      # used to check one artifact and should not become permanently trusted
      # for anything else on the host.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_sam_cli_stage_dir }}/gnupg --batch --quiet
          --import {{ aws_sam_cli_stage_dir }}/aws-sam-cli-primary-key.asc
          {{ aws_sam_cli_stage_dir }}/aws-sam-cli-signer-key.asc
      changed_when: true
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 9. Confirm the imported keys are the pinned AWS SAM CLI keys
      # Guards the embedded key blocks themselves: a swapped key would
      # otherwise produce a "good" signature for a swapped installer.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_sam_cli_stage_dir }}/gnupg --batch
          --with-colons --fingerprint
      register: aws_sam_cli_fpr
      changed_when: false
      failed_when: >-
        aws_sam_cli_primary_fingerprint not in aws_sam_cli_fpr.stdout
        or aws_sam_cli_signer_fingerprint not in aws_sam_cli_fpr.stdout
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 10. Confirm the primary key certifies the signer key
      # The step that makes two keys worth having. Without it, pinning the
      # signer key alone would be no stronger than the AWS CLI's single key:
      # the artifact would be checked against whatever key this file happens
      # to carry. `--check-sigs` verifies the signatures on the signer key
      # rather than merely listing them (`--list-sigs`), and the primary's
      # long key id must appear among them.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_sam_cli_stage_dir }}/gnupg --batch
          --check-sigs {{ aws_sam_cli_signer_fingerprint }}
      register: aws_sam_cli_chain
      changed_when: false
      # A `sig!` line, not merely the key id somewhere in the output: `sig-`
      # is what gpg prints for a signature that did not check out, and it
      # carries the same key id.
      failed_when: >-
        aws_sam_cli_chain.stdout_lines
        | select('search', '^sig!\s+' ~ aws_sam_cli_primary_keyid)
        | list | length == 0
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 11. Verify the installer's signature
      # gpg exits 0 only for a good signature; the "key is not certified with
      # a trusted signature" warning it prints for an uncertified key does not
      # affect the exit status, so the exit code is the gate. Task 10 is what
      # answers that warning here.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_sam_cli_stage_dir }}/gnupg --batch
          --verify {{ aws_sam_cli_stage_dir }}/{{ aws_sam_cli_zip }}.sig
          {{ aws_sam_cli_stage_dir }}/{{ aws_sam_cli_zip }}
      changed_when: false
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 12. Unpack the installer
      ansible.builtin.unarchive:
        src: "{{ aws_sam_cli_stage_dir }}/{{ aws_sam_cli_zip }}"
        dest: "{{ aws_sam_cli_stage_dir }}"
        remote_src: true
        owner: root
        group: root
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 13. Run the AWS SAM CLI installer
      # --update makes the installer replace an existing install instead of
      # refusing ("Found preexisting AWS SAM CLI installation ... rerun with
      # --update"); the install/bin dirs are passed explicitly rather than
      # relying on the installer's defaults staying what they are today.
      ansible.builtin.command:
        cmd: >-
          {{ aws_sam_cli_stage_dir }}/install --update
          --install-dir {{ aws_sam_cli_install_dir }}
          --bin-dir {{ aws_sam_cli_bin_dir }}
      changed_when: true
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 14. Make the install tree readable by every account
      # The installer applies root's umask rather than an explicit mode, so
      # this is set here instead of being inherited from whoever ran the play.
      ansible.builtin.file:
        path: "{{ aws_sam_cli_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: 'u=rwX,go=rX'
        recurse: true
      when:
        - aws_sam_cli_install_needed | bool
        - not ansible_check_mode

    - name: 15. Remove the staging directory
      ansible.builtin.file:
        path: "{{ aws_sam_cli_stage_dir }}"
        state: absent

    - name: 16. Verify the installed AWS SAM CLI version
      ansible.builtin.command: "{{ aws_sam_cli_bin }} --version"
      register: aws_sam_cli_version_out
      changed_when: false
      failed_when: (aws_sam_cli_version_out.stdout | trim) != aws_sam_cli_version_line
      check_mode: false
      when: aws_sam_cli_can_verify | bool

    - name: 17. Create a scratch HOME for the unprivileged check
      # `sam` writes ~/.aws-sam even for offline subcommands -- see the
      # header. 0700 so the check exercises a HOME it fully owns.
      #
      # It doubles as the working directory for the check below (chdir), and
      # that is not optional: every sam subcommand looks for a samconfig.yml
      # in the *current directory*, so with the cwd left wherever ansible ran
      # from -- /home/ubuntu -- the check dies as uid 65534 on
      # "PermissionError: [Errno 13] ... '/home/ubuntu/samconfig.yml'" the
      # moment that home is 0750 rather than 0755. Found on ws02, where an
      # install that worked perfectly failed its own verification; ws01, whose
      # /home/ubuntu is 0755, passed the identical play. cloud-cli/gcx-cli.yml
      # documents the same trap for its repository-level .gcx.yaml.
      ansible.builtin.file:
        path: "{{ aws_sam_cli_smoke_home }}"
        state: directory
        owner: "{{ aws_sam_cli_verify_uid }}"
        group: "{{ aws_sam_cli_verify_gid }}"
        mode: '0700'
      check_mode: false
      when: aws_sam_cli_can_verify | bool

    - name: 18. Generate a sample event as an unprivileged user
      # Exercises far more than --version does: `local generate-event` loads
      # the bundled interpreter and the SAM template machinery and renders a
      # real event document, entirely offline -- no credentials, no Docker,
      # no network. With no AWS identity present it still exits 0, which is
      # the expected result here: this playbook installs a client and
      # deliberately configures no identity.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ aws_sam_cli_verify_uid }} --regid={{ aws_sam_cli_verify_gid }} --clear-groups
          env HOME={{ aws_sam_cli_smoke_home }} SAM_CLI_TELEMETRY=0
          {{ aws_sam_cli_bin }} local generate-event s3 put
        chdir: "{{ aws_sam_cli_smoke_home }}"
      register: aws_sam_cli_smoke
      changed_when: false
      failed_when: '"aws:s3" not in aws_sam_cli_smoke.stdout'
      check_mode: false
      when: aws_sam_cli_can_verify | bool

    - name: 19. Remove the scratch HOME
      ansible.builtin.file:
        path: "{{ aws_sam_cli_smoke_home }}"
        state: absent
      check_mode: false
      when: aws_sam_cli_can_verify | bool

    - name: 20. Display installation summary
      ansible.builtin.debug:
        msg:
          - "{{ aws_sam_cli_version_out.stdout | trim }}"
          - ""
          - "  {{ aws_sam_cli_install_dir }}/{{ aws_sam_cli_version }} ({{ aws_sam_cli_arch }})"
          - "  {{ aws_sam_cli_install_dir }}/current   symlink to the active version"
          - "  {{ aws_sam_cli_bin }}"
          - ""
          - >-
            Installer signature verified against
            {{ aws_sam_cli_signer_fingerprint }}, itself certified by the
            AWS SAM CLI primary key {{ aws_sam_cli_primary_keyid }}.
          - >-
            Verified runnable by an unprivileged user
            (uid {{ aws_sam_cli_verify_uid }}).
          - ""
          - "Credentials are per-account and are NOT configured by this playbook."
          - "sam uses the same credential chain as the AWS CLI:"
          - "  aws configure                 # or aws configure sso"
          - "  sam --version"
          - "  sam local generate-event s3 put   # works with no identity at all"
          - ""
          - "The SAM CLI reports telemetry by default. Per account:"
          - "  export SAM_CLI_TELEMETRY=0"
      when: aws_sam_cli_can_verify | bool
