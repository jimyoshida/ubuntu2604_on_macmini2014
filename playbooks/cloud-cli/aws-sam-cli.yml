---
# Install the AWS SAM CLI system-wide on a multi-user workstation.
#
# AWS's own installer already targets root-owned system paths:
#
#   /usr/local/aws-sam-cli/<version>/   the bundled interpreter and libraries
#   /usr/local/aws-sam-cli/current      symlink to the active version
#   /usr/local/bin/sam                  symlink into current/bin
#
# so this is the same shape as cloud-cli/aws-cli.yml, and deliberately so: the
# two installers are the same script family, down to the --update /
# --install-dir / --bin-dir flags. What was on ws01/ws02 before this playbook
# existed was an unmanaged hand-run of that installer -- no version pin, no
# signature check, and nothing that would ever move it again.
#
# NOT apt, and not pip. There is no `aws-sam-cli` package in Ubuntu 26.04 and
# no AWS apt repository that carries one; upstream's supported Linux paths are
# this zip installer and Homebrew, and Homebrew is out (see README).
# `pip install aws-sam-cli` is the third option and is rejected for the reason
# every pip-into-the-system install is rejected here: it puts a large
# dependency tree into the system Python, where it collides with apt-managed
# packages and with anything else that pins boto3/botocore.
#
# TWO KEYS, NOT ONE, AND A CHAIN BETWEEN THEM. Unlike the AWS CLI, AWS signs
# the SAM CLI with a *signer* key that is itself signed by a long-lived
# *primary* key, and documents verification as two steps: check that the
# primary certifies the signer, then check that the signer signed the artifact
# (task 10 and task 11 below). Both key blocks are published only in the
# installation documentation, not at a fetchable URL, so both are pinned here
# and their fingerprints asserted after import:
#   https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/reference-sam-cli-install-verify.html
# The signer key expires 2027-05-19. When AWS rotates it, replace
# aws_sam_cli_signer_key and aws_sam_cli_signer_fingerprint; the primary key
# is the one that should stay put across rotations.
#
# THE UNPRIVILEGED CHECK NEEDS A SCRATCH HOME. `sam` writes ~/.aws-sam
# (metadata.json, telemetry uuid) on every invocation, including the offline
# ones, so a check running as an account with no home directory fails on the
# write rather than on anything to do with the install -- the same trap
# misc/maven.yml documents for ~/.m2. SAM_CLI_TELEMETRY=0 is set for that one
# command so the check itself never phones home; it is deliberately NOT
# written to /etc/environment, because telemetry is each account's own call
# (the summary below prints how).
#
# Credentials stay per-user in ~/.aws and are not touched here: `sam deploy`
# uses the same credential chain the AWS CLI does, which cloud-cli/aws-cli.yml
# already leaves per-account.
#
# Usage:
#   ansible-playbook cloud-cli/aws-sam-cli.yml -e host=<inventory host or group>
#   ansible-playbook cloud-cli/aws-sam-cli.yml -e host=ws01 -e aws_sam_cli_version=1.165.0

- name: Install the AWS SAM CLI system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    aws_sam_cli_version: "1.165.0"
    aws_sam_cli_install_dir: /usr/local/aws-sam-cli
    aws_sam_cli_bin_dir: /usr/local/bin
    aws_sam_cli_bin: /usr/local/bin/sam
    aws_sam_cli_base_url: >-
      https://github.com/aws/aws-sam-cli/releases/download/v{{ aws_sam_cli_version }}
    # ansible_facts['architecture'] -> upstream asset name. Unlike the AWS
    # CLI's assets these are NOT the strings uname prints: the 64-bit ARM
    # asset is aws-sam-cli-linux-arm64.zip, not aarch64.
    aws_sam_cli_arch_map:
      x86_64: x86_64
      aarch64: arm64
    aws_sam_cli_arch: "{{ aws_sam_cli_arch_map[ansible_facts['architecture']] | default('') }}"
    aws_sam_cli_zip: "aws-sam-cli-linux-{{ aws_sam_cli_arch }}.zip"
    # `sam --version` prints exactly this line, so the guard compares the
    # whole trimmed string rather than searching for the number: a substring
    # test for "1.16" would be satisfied by an installed 1.165.0.
    aws_sam_cli_version_line: "SAM CLI, version {{ aws_sam_cli_version }}"
    # Disk-backed, not /tmp: the installer zip is ~90MiB and unpacks larger,
    # and /tmp is a size-capped tmpfs on these hosts.
    aws_sam_cli_stage_dir: "/var/tmp/aws-sam-cli-install-{{ aws_sam_cli_version }}"
    aws_sam_cli_smoke_home: /var/tmp/aws-sam-cli-smoke-home
    # uid/gid used to prove the install is usable by an arbitrary user
    aws_sam_cli_verify_uid: 65534    # nobody
    aws_sam_cli_verify_gid: 65534    # nogroup
    aws_sam_cli_primary_fingerprint: "DE299ABF8479DD37BE09095942FD5F7A73AD885A"
    aws_sam_cli_signer_fingerprint: "EF463E86CA31933BB688CC1A4094ABB1BEDFDAB4"
    # The long key id of the primary key, which is how `gpg --check-sigs`
    # names it in the signer key's signature list (task 10).
