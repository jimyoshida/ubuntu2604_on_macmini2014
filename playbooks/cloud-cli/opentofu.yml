  tasks:
    - name: 1. Install prerequisites
      # python3-debian is what deb822_repository needs to write a .sources
      # file. The source playbook's apt-transport-https, curl and gnupg are
      # gone: apt speaks https natively and nothing dearmors a key any more.
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Fail on an unsupported CPU architecture
      ansible.builtin.fail:
        msg: >-
          No OpenTofu apt architecture is mapped for
          '{{ ansible_facts['architecture'] }}'. Add it to opentofu_arch_map.
      when: opentofu_arch | length == 0

    - name: 3. Remove the single-user playbook's apt source for this repository
      # cloud-cli/opentofu.yml wrote opentofu.list for the same repository.
      # Its two keyrings (/usr/share/keyrings/opentofu.gpg and
      # opentofu-repo.gpg) are left alone: nothing else references them, and
      # an unused keyring is inert.
      ansible.builtin.file:
        path: "{{ opentofu_legacy_source }}"
        state: absent

    - name: 4. Add the OpenTofu apt repository
      ansible.builtin.deb822_repository:
        name: opentofu
        types:
          - deb
        uris:
          - "{{ opentofu_repo_uri }}"
        suites:
          - "{{ opentofu_suite }}"
        components:
          - main
        architectures:
          - "{{ opentofu_arch }}"
        signed_by: "{{ opentofu_signing_key }}"
        state: present
        mode: '0644'
      register: opentofu_repo

    - name: 5. Refresh the apt cache when the repository definition changed
      ansible.builtin.apt:
        update_cache: true
      when: opentofu_repo.changed

    - name: 6. Check the currently installed tofu version
      # check_mode: false because this reads state that already exists.
      # ${Status} as well as ${Version} -- see opentofu_dpkg_ok above.
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' tofu
      register: opentofu_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 7. Decide whether tofu needs installing
      ansible.builtin.set_fact:
        opentofu_install_needed: >-
          {{ opentofu_installed.rc != 0
             or opentofu_installed.stdout != (opentofu_dpkg_ok ~ opentofu_version) }}
        opentofu_can_verify: >-
          {{ not (ansible_check_mode
                  and (opentofu_installed.rc != 0
                         or opentofu_installed.stdout != (opentofu_dpkg_ok ~ opentofu_version))) }}

    - name: 7a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install tofu {{ opentofu_version }}, so the version
          check and the unprivileged fmt check below are skipped rather than
          failed. Re-run without --check to verify the install.
      when: not (opentofu_can_verify | bool)

    - name: 8. Install tofu via apt
      # allow_downgrade so that moving the pin backwards actually applies.
      ansible.builtin.apt:
        name: "tofu={{ opentofu_version }}"
        state: present
        allow_downgrade: true
      # The second clause is about --check on a host that does not yet have this
      # vendor repository: the repository task reported `changed` without
      # writing anything, so apt has no candidate for the pinned version and
      # this task would fail outright rather than simulate. Where the
      # repository IS already configured, it still runs under --check, so a
      # dry run keeps showing what apt would do.
      when:
        - opentofu_install_needed | bool
        - not (ansible_check_mode and opentofu_repo.changed)

    - name: 9. Verify the installed tofu package version
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' tofu
      register: opentofu_dpkg
      changed_when: false
      check_mode: false
      failed_when: opentofu_dpkg.stdout != (opentofu_dpkg_ok ~ opentofu_version)
      when: opentofu_can_verify | bool

    - name: 10. Create the scratch directory for the unprivileged checks
      # Also serves as HOME: tofu writes ~/.terraform.d for plugin caches.
      #
      # check_mode: false, with the matching removal in task 14. Tasks 12 and
      # 13 set chdir, and the command action validates chdir *before* check
      # mode gets to skip the task -- so a dry run fails with "Unable to
      # change directory before execution" on a directory that only this task
      # would have created. Creating and removing a throwaway directory under
      # /var/tmp within one run is not a system change worth withholding.
      ansible.builtin.file:
        path: "{{ opentofu_smoke_dir }}"
        state: directory
        owner: "{{ opentofu_verify_uid }}"
        group: "{{ opentofu_verify_gid }}"
        mode: '0700'
      check_mode: false
      when: opentofu_can_verify | bool

    - name: 11. Write a deliberately misformatted config for the fmt check
      # Misformatted on purpose: `tofu fmt -check` on already-tidy input is
      # indistinguishable from a tofu that parsed nothing at all. Making it
      # report *this* file proves the HCL parser ran.
      ansible.builtin.copy:
        dest: "{{ opentofu_smoke_dir }}/main.tf"
        owner: "{{ opentofu_verify_uid }}"
        group: "{{ opentofu_verify_gid }}"
        mode: '0644'
        content: |
          variable  "unformatted"   {
          type = string
            default   = "spacing is wrong on purpose"
          }
      when: opentofu_can_verify | bool
      check_mode: false

    - name: 12. Report the tofu version as an unprivileged user
      # chdir for the same reason task 13 needs it -- see the comment there.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ opentofu_verify_uid }} --regid={{ opentofu_verify_gid }} --clear-groups
          env HOME={{ opentofu_smoke_dir }} tofu version
        chdir: "{{ opentofu_smoke_dir }}"
      register: opentofu_smoke_version
      changed_when: false
      check_mode: false
      failed_when: opentofu_version not in opentofu_smoke_version.stdout
      when: opentofu_can_verify | bool

    - name: 13. Format-check a config as an unprivileged user
      # A4's strongest form: offline real work, not a version string. `tofu
      # fmt -check` exits non-zero precisely because the file above needs
      # reformatting, which is the expected result here -- so the assertion is
      # that tofu named the file, not that it exited 0.
      #
      # chdir, and a relative path, are both required. The task inherits
      # Ansible's own working directory, which uid 65534 cannot read; tofu
      # re-expresses whatever path it is given relative to that cwd and then
      # fails with "No file or directory at ../../../../../../var/tmp/...".
      # The absolute path in the argument is what misleads -- the argument was
      # never the problem. Same fix as commit eccd02c for tool/.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ opentofu_verify_uid }} --regid={{ opentofu_verify_gid }} --clear-groups
          env HOME={{ opentofu_smoke_dir }} tofu fmt -check -list=true .
        chdir: "{{ opentofu_smoke_dir }}"
      register: opentofu_smoke_fmt
      changed_when: false
      check_mode: false
      failed_when: "'main.tf' not in opentofu_smoke_fmt.stdout"
      when: opentofu_can_verify | bool

    - name: 14. Remove the scratch directory
      # check_mode: false to match task 10 -- see the comment there.
      ansible.builtin.file:
        path: "{{ opentofu_smoke_dir }}"
        state: absent
      check_mode: false

    - name: 15. Display installation summary
      ansible.builtin.debug:
        msg:
          - >-
            OpenTofu {{ opentofu_version }} ({{ opentofu_arch }})
            {{ opentofu_can_verify | bool
               | ternary('is installed system-wide.', 'would be installed system-wide.') }}
          - ""
          - "  /usr/bin/tofu"
          - "  /etc/apt/sources.list.d/opentofu.sources  suite {{ opentofu_suite }}, key inline"
          - ""
          - >-
            {{ opentofu_can_verify | bool
               | ternary('Format-checked a real HCL file as an unprivileged user (uid '
                         ~ opentofu_verify_uid ~ ').',
                         'Not verified: this was a --check run against a host without this version.') }}
          - ""
          - "Get started:"
          - "  tofu version"
          - "  tofu init                    # writes .terraform/ in the working tree"
          - "  tofu fmt -check              # validate formatting"
          - ""
          - "Provider credentials are per-identity and per-provider. They are secrets:"
          - "keep them in your own environment, never in /etc/environment."
