---
# Install OpenTofu system-wide on a multi-user workstation.
#
#   /usr/bin/tofu                              from the vendor apt package
#   /etc/apt/sources.list.d/opentofu.sources   repository definition, key inline
#
# The apt package already installs to root-owned paths, so this migration is
# correctness work: the source playbook (cloud-cli/opentofu.yml) installed the
# same package from the same repository, unpinned, via two get_url downloads
# and two `shell: gpg --dearmor` tasks that reported `changed` on every run.
#
# Per-user state stays per-user: `tofu init` writes ~/.terraform.d and a
# .terraform directory in whatever working tree it is run from, and provider
# credentials are per-identity. Nothing here touches any $HOME.
#
# Usage:
#   ansible-playbook cloud-cli/opentofu.yml -e host=<inventory host or group>
#   ansible-playbook cloud-cli/opentofu.yml -e host=ws01 -e opentofu_version=1.12.5

- name: Install OpenTofu system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    opentofu_dpkg_ok: "install ok installed|"
    opentofu_version: "1.12.5"
    opentofu_repo_uri: "https://packages.opentofu.org/opentofu/tofu/any/"
    opentofu_suite: any
    # ansible_facts['architecture'] -> apt architecture name. The suite is
    # called "any", but the packages inside it are per-architecture.
    opentofu_arch_map:
      x86_64: amd64
      aarch64: arm64
    opentofu_arch: "{{ opentofu_arch_map.get(ansible_facts['architecture'], '') }}"
    opentofu_legacy_source: /etc/apt/sources.list.d/opentofu.list
    opentofu_smoke_dir: /var/tmp/opentofu-smoke
    # uid/gid used to prove the install is usable by an arbitrary user
    opentofu_verify_uid: 65534    # nobody
    opentofu_verify_gid: 65534    # nogroup
    # The packagecloud repository signing key, fingerprint
    # F4AF70F66EAC4337EEECC97407D3DFCD4C61499F, served (via redirect) at
    # https://packages.opentofu.org/opentofu/tofu/gpgkey. It has no expiry, so
    # it is pinned by content: deb822_repository embeds an armored block
    # straight into Signed-By, and a rotation then fails apt's Release check
    # loudly rather than being followed silently.
    #
    # The source playbook listed a SECOND key here,
    # https://get.opentofu.org/opentofu.gpg (E3E6E43D84CB852EADB0051D0C0AF313E5FD9F80).
    # It is dropped, not lost: its own user ID says it signs OpenTofu
    # *providers*, and the repository's InRelease is signed by subkey
    # 59D41234F9F7AFD007143F6A70DF59811A8B9109 of the key below -- verified
    # directly against the published InRelease. A key that signs nothing apt
