---
# Install the Azure CLI system-wide on a multi-user workstation.
#
# Microsoft's apt package already targets root-owned system paths:
#
#   /opt/az/                          bundled Python interpreter and libraries
#   /usr/bin/az                       wrapper script
#   /etc/bash_completion.d/azure-cli  shell completion, shipped by the package
#
# so this migration is correctness work rather than reach work: the source
# playbook (cloud-cli/azure-cli.yml) installed the same package to the same
# places. What it lacked was a version pin, an architecture that comes from
# facts, and a repository definition that does not report `changed` on every
# run. Completions are already a system-wide drop-in, so this playbook has no
# dependency on the /etc/profile.d bootstrap.
#
# The identity stays per-user and is not touched here: `az login` writes its
# token cache to ~/.azure, and no environment variable is set. The DevOps
# extension is a separate playbook (azure-devops-cli.yml), which installs the
# same package from the same repository definition and is idempotent against
# this one.
#
# Note on --check: task 4 needs python3-debian on the target, which task 1
# installs but --check does not, and the install/verify tasks below skip
# themselves on a host where az is not yet present. See MIGRATION.md step 10.
#
# Usage:
#   ansible-playbook cloud-cli/azure-cli.yml -e host=<inventory host or group>
#   ansible-playbook cloud-cli/azure-cli.yml -e host=ws01 -e azure_cli_version=2.89.0

- name: Install the Azure CLI system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    azure_cli_version: "2.89.0"
    # Microsoft's Debian revision. Every version published to this repository
    # so far is `-1`; it is a separate var so that a `-2` respin can be taken
    # without overriding the whole package version string.
    azure_cli_deb_revision: "1"
    azure_cli_repo_uri: "https://packages.microsoft.com/repos/azure-cli/"
    # Microsoft does not publish a suite for every Ubuntu release: as of this
    # writing /repos/azure-cli/dists/ has noble but neither resolute nor
    # plucky (both 404), so the target release has to be mapped onto the
    # newest suite that exists. Carried over from the source playbook.
    azure_cli_suite_map:
      resolute: noble
      plucky: noble
    azure_cli_suite: >-
      {{ azure_cli_suite_map.get(ansible_facts['distribution_release'],
                                 ansible_facts['distribution_release']) }}
    # The suite is part of the package version, so it is composed rather than
    # written out: 2.89.0-1~noble on a host mapped to noble.
    azure_cli_pkg_version: "{{ azure_cli_version }}-{{ azure_cli_deb_revision }}~{{ azure_cli_suite }}"
    # ansible_facts['architecture'] -> apt architecture name. The repository
    # publishes amd64 and arm64; the source playbook hardcoded arch=amd64.
    azure_cli_arch_map:
      x86_64: amd64
      aarch64: arm64
    azure_cli_arch: "{{ azure_cli_arch_map.get(ansible_facts['architecture'], '') }}"
    # The source playbook's apt source, which named the same repository. Both
    # would be read, so apt warns that the target is configured twice; this
    # playbook supersedes it rather than living alongside it.
    azure_cli_legacy_source: /etc/apt/sources.list.d/azure-cli.list
    azure_cli_smoke_home: /var/tmp/azure-cli-smoke-home
    # uid/gid used to prove the install is usable by an arbitrary user
    azure_cli_verify_uid: 65534    # nobody
    azure_cli_verify_gid: 65534    # nogroup
    # Microsoft's release-signing key, fingerprint
    # BC528686B50D79E339D3721CEB3E94ADBE1229CF, as served at
    # https://packages.microsoft.com/keys/microsoft.asc. Pinned here rather
    # than fetched at run time: deb822_repository embeds an armored block
    # straight into Signed-By, so the key is verified by being the one written
    # in this file instead of by whatever the URL serves on the day of the
    # run. A rotated key then fails apt's Release check loudly, which is the
    # wanted outcome for a repository this playbook installs software from.
    # The armor's `Version:` header line is dropped: it is not part of the key
    # material (the fingerprint is unchanged without it) and it is the only
    # colon in the block, which keeps the value unambiguously not a URL to the
    # module's URL/path/inline dispatch.
    azure_cli_signing_key: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----

      mQENBFYxWIwBCADAKoZhZlJxGNGWzqV+1OG1xiQeoowKhssGAKvd+buXCGISZJwT
      LXZqIcIiLP7pqdcZWtE9bSc7yBY2MalDp9Liu0KekywQ6VVX1T72NPf5Ev6x6DLV
      7aVWsCzUAF+eb7DC9fPuFLEdxmOEYoPjzrQ7cCnSV4JQxAqhU4T6OjbvRazGl3ag
      OeizPXmRljMtUUttHQZnRhtlzkmwIrUivbfFPD+fEoHJ1+uIdfOzZX8/oKHKLe2j
      H632kvsNzJFlROVvGLYAk2WRcLu+RjjggixhwiB+Mu/A8Tf4V6b+YppS44q8EvVr
      M+QvY7LNSOffSO6Slsy9oisGTdfE39nC7pVRABEBAAG0N01pY3Jvc29mdCAoUmVs
      ZWFzZSBzaWduaW5nKSA8Z3Bnc2VjdXJpdHlAbWljcm9zb2Z0LmNvbT6JATQEEwEI
      AB4FAlYxWIwCGwMGCwkIBwMCAxUIAwMWAgECHgECF4AACgkQ6z6Urb4SKc+P9gf/
      diY2900wvWEgV7iMgrtGzx79W/PbwWiOkKoD9sdzhARXWiP8Q5teL/t5TUH6TZ3B
      ENboDjwr705jLLPwuEDtPI9jz4kvdT86JwwG6N8gnWM8Ldi56SdJEtXrzwtlB/Fe
      6tyfMT1E/PrJfgALUG9MWTIJkc0GhRJoyPpGZ6YWSLGXnk4c0HltYKDFR7q4wtI8
      4cBu4mjZHZbxIO6r8Cci+xxuJkpOTIpr4pdpQKpECM6x5SaT2gVnscbN0PE19KK9
      nPsBxyK4wW0AvAhed2qldBPTipgzPhqB2gu0jSryil95bKrSmlYJd1Y1XfNHno5D
      xfn5JwgySBIdWWvtOI05gw==
      =zPfd
      -----END PGP PUBLIC KEY BLOCK-----

  tasks:
    - name: 1. Install prerequisites
      # python3-debian is what deb822_repository needs to write a .sources
      # file; the module does not install it itself unless asked to. The
      # source playbook's apt-transport-https, curl, gnupg and lsb-release are
      # all gone: apt has spoken https natively since 1.5, the codename comes
      # from facts, and nothing dearmors a key any more.
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Fail on an unsupported CPU architecture
      ansible.builtin.fail:
        msg: >-
          No Azure CLI apt architecture is mapped for
          '{{ ansible_facts['architecture'] }}'. Add it to azure_cli_arch_map.
      when: azure_cli_arch | length == 0

    - name: 3. Remove the single-user playbook's apt source for this repository
      # cloud-cli/azure-cli.yml wrote azure-cli.list for the same repository.
      # Left in place next to the .sources file below, apt reads the repository
      # twice and warns that the target is configured multiple times. Its
      # keyring (/etc/apt/keyrings/microsoft.gpg) is left alone: no other
      # playbook in this repo references it, and an unused keyring is inert.
      ansible.builtin.file:
        path: "{{ azure_cli_legacy_source }}"
        state: absent

    - name: 4. Add the Microsoft azure-cli apt repository
      # deb822_repository rather than get_url + a shell dearmor +
      # apt_repository: the signing key goes inline into Signed-By, so there
      # is no key file to manage and no command task reporting `changed` on
      # every run. The module does not refresh the apt cache, hence task 5.
      ansible.builtin.deb822_repository:
        name: azure-cli
        types:
          - deb
        uris:
          - "{{ azure_cli_repo_uri }}"
        suites:
          - "{{ azure_cli_suite }}"
        components:
          - main
        architectures:
          - "{{ azure_cli_arch }}"
        signed_by: "{{ azure_cli_signing_key }}"
        state: present
        mode: '0644'
      register: azure_cli_repo

    - name: 5. Refresh the apt cache when the repository definition changed
      ansible.builtin.apt:
        update_cache: true
      when: azure_cli_repo.changed

    - name: 6. Check the currently installed azure-cli version
      # check_mode: false because this reads state that already exists. A
      # skipped command task still registers, with rc 0 and an empty stdout,
      # which task 7 would read as "some version is installed, just not the
      # pinned one" -- true by accident, but for the wrong reason.
      ansible.builtin.command: dpkg-query -W -f='${Version}' azure-cli
      register: azure_cli_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 7. Decide whether azure-cli needs installing
      # The installed version is compared, not the presence of the binary, so
      # that bumping azure_cli_version actually replaces the install.
      ansible.builtin.set_fact:
        azure_cli_install_needed: >-
          {{ azure_cli_installed.rc != 0
             or azure_cli_installed.stdout != azure_cli_pkg_version }}
        # Nothing downstream can be verified in a dry run that would have had
        # to install first: task 8 does not really run under --check.
        azure_cli_can_verify: >-
          {{ not (ansible_check_mode
                  and (azure_cli_installed.rc != 0
                       or azure_cli_installed.stdout != azure_cli_pkg_version)) }}

    - name: 7a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install azure-cli {{ azure_cli_pkg_version }}, so the
          version check and the unprivileged smoke test below are skipped
          rather than failed. Re-run without --check to verify the install.
      when: not (azure_cli_can_verify | bool)

    - name: 8. Install azure-cli via apt
      # allow_downgrade so that moving the pin backwards actually applies:
      # without it apt refuses, and the pin silently means "this version or
      # anything newer already present".
      ansible.builtin.apt:
        name: "azure-cli={{ azure_cli_pkg_version }}"
        state: present
        allow_downgrade: true
      # The second clause is about --check on a host that does not yet have this
      # vendor repository: the repository task reported `changed` without
      # writing anything, so apt has no candidate for the pinned version and
      # this task would fail outright rather than simulate. Where the
      # repository IS already configured, it still runs under --check, so a
      # dry run keeps showing what apt would do.
      when:
        - azure_cli_install_needed | bool
        - not (ansible_check_mode and azure_cli_repo.changed)

    - name: 9. Verify the installed azure-cli package version
      ansible.builtin.command: dpkg-query -W -f='${Version}' azure-cli
      register: azure_cli_dpkg
      changed_when: false
      failed_when: azure_cli_dpkg.stdout != azure_cli_pkg_version
      when: azure_cli_can_verify | bool

    - name: 10. Create a scratch HOME for the unprivileged check
      # az writes to $HOME/.azure on every invocation and aborts outright when
      # HOME is unset or unwritable (PermissionError on /nonexistent), so the
      # smoke test needs a HOME of its own. /var/tmp rather than /tmp: /tmp is
      # a size-capped tmpfs on these hosts (see MIGRATION.md).
      ansible.builtin.file:
        path: "{{ azure_cli_smoke_home }}"
        state: directory
        owner: "{{ azure_cli_verify_uid }}"
        group: "{{ azure_cli_verify_gid }}"
        mode: '0700'
      when: azure_cli_can_verify | bool

    - name: 11. Report the azure-cli version as an unprivileged user
      # Exercises more than the package database does: `az version` starts the
      # bundled interpreter, imports the CLI, and enumerates the installed
      # extensions, so it fails if anything under /opt/az is unreadable to an
      # account that did not install it. AZURE_CONFIG_DIR and
      # AZURE_EXTENSION_SYS_DIR are deliberately left unset -- default
      # discovery is the thing under test.
      #
      # AZURE_CORE_COLLECT_TELEMETRY=0 is not a discovery variable and does
      # not weaken that: it stops az forking a telemetry uploader that outlives
      # the command and recreates this scratch HOME after task 12 removes it.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ azure_cli_verify_uid }} --regid={{ azure_cli_verify_gid }} --clear-groups
          env HOME={{ azure_cli_smoke_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          az version --query '"azure-cli"' -o tsv
      register: azure_cli_smoke
      changed_when: false
      failed_when: (azure_cli_smoke.stdout | trim) != azure_cli_version
      when: azure_cli_can_verify | bool

    - name: 12. Remove the scratch HOME
      ansible.builtin.file:
        path: "{{ azure_cli_smoke_home }}"
        state: absent

    - name: 13. Display installation summary
      ansible.builtin.debug:
        msg:
          - >-
            Azure CLI {{ azure_cli_pkg_version }} ({{ azure_cli_arch }})
            {{ azure_cli_can_verify | bool
               | ternary('is installed system-wide.', 'would be installed system-wide.') }}
          - ""
          - "  /opt/az/                          bundled interpreter and libraries"
          - "  /usr/bin/az"
          - "  /etc/bash_completion.d/azure-cli  completions, no profile.d bootstrap needed"
          - "  /etc/apt/sources.list.d/azure-cli.sources  suite {{ azure_cli_suite }}, key inline"
          - ""
          - >-
            {{ azure_cli_can_verify | bool
               | ternary('Reported version ' ~ (azure_cli_smoke.stdout | default('') | trim)
                         ~ ' when run by an unprivileged user (uid ' ~ azure_cli_verify_uid ~ ').',
                         'Not verified: this was a --check run against a host without this version.') }}
          - ""
          - "No identity is configured by this playbook. Each user runs, for themselves:"
          - "  az login                     # interactive browser login, token cache in ~/.azure"
          - "  az login --use-device-code   # for a session with no local browser"
          - "  az account show              # confirm which subscription is active"
          - ""
          - "~/.azure/ stays per-user. Azure CLI secrets (service principal passwords,"
          - "AZURE_CLIENT_SECRET) must never be put in /etc/environment, which is shared"
          - "and world-readable."
