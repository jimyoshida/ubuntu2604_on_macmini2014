---
# Install the Azure CLI and its azure-devops extension system-wide on a
# multi-user workstation.
#
#   /opt/az/                                       Azure CLI, from apt
#   /usr/bin/az                                    wrapper script
#   <az purelib>/azure-cli-extensions/azure-devops the extension, root-owned
#
# This is the one genuinely broken install in cloud-cli/. The source playbook
# (cloud-cli/azure-devops-cli.yml) ran `az extension add` with `become: no`,
# which installs into the invoking account's ~/.azure/cliextensions -- so
# `az devops` worked for exactly the person who ran the playbook and was
# invisible to every other account on the box, even though the `az` binary
# underneath was a system-wide apt package. `az extension add --system` puts
# it in a root-owned directory inside the CLI's own Python environment, which
# every account reads by default.
#
# Two more things the source playbook did are gone rather than migrated:
# `az devops configure --defaults` (tasks 8 and 9) wrote one account's
# ~/.azure/config, and it read the org and project from the *installer's*
# environment via lookup('env', ...), so one person's shell silently became
# one person's default. Per-identity setup now belongs to each user (see the
# closing summary); a genuinely shared default is a play var written to
# /etc/environment by task 17, off unless asked for.
#
# The azure-cli half duplicates azure-cli.yml on purpose -- self-contained
# playbooks are policy -- using the same repository name, suite and key, so
# the two playbooks are idempotent against each other and running both
# installs one package.
#
# Note on --check: task 4 needs python3-debian on the target, which task 1
# installs but --check does not, and the install/verify tasks below skip
# themselves on a host that does not already have this version. See
# POLICY.md's C1.
#
# Usage:
#   ansible-playbook cloud-cli/azure-devops-cli.yml -e host=<inventory host or group>
#   ansible-playbook cloud-cli/azure-devops-cli.yml -e host=ws01 -e az_devops_ext_version=1.0.6
#   ansible-playbook cloud-cli/azure-devops-cli.yml -e host=ws01 \
#     -e azure_devops_default_organization=https://dev.azure.com/YOUR_ORG

- name: Install the Azure CLI and the azure-devops extension system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    azure_cli_dpkg_ok: "install ok installed|"
    # --- azure-cli, identical to azure-cli.yml ------------------------------
    azure_cli_version: "2.89.0"
    azure_cli_deb_revision: "1"
    azure_cli_repo_uri: "https://packages.microsoft.com/repos/azure-cli/"
    # Microsoft publishes no suite for every Ubuntu release: /repos/azure-cli
    # has noble but neither resolute nor plucky (both 404), so the target
    # release is mapped onto the newest suite that exists.
    azure_cli_suite_map:
      resolute: noble
      plucky: noble
    azure_cli_suite: >-
      {{ azure_cli_suite_map.get(ansible_facts['distribution_release'],
                                 ansible_facts['distribution_release']) }}
    azure_cli_pkg_version: "{{ azure_cli_version }}-{{ azure_cli_deb_revision }}~{{ azure_cli_suite }}"
    azure_cli_arch_map:
      x86_64: amd64
      aarch64: arm64
    azure_cli_arch: "{{ azure_cli_arch_map.get(ansible_facts['architecture'], '') }}"
    azure_cli_legacy_source: /etc/apt/sources.list.d/azure-cli.list

    # --- the azure-devops extension ----------------------------------------
    # `az extension list-versions --name azure-devops` marks one version "max
    # compatible version" for the installed CLI. Pin to that rather than to
    # the newest published: a newer extension than the CLI supports installs
    # and then fails at load time.
    az_devops_ext_name: azure-devops
    az_devops_ext_version: "1.0.6"
    # Shared, non-secret defaults, written to /etc/environment only when set.
    #
    # The DOUBLE underscore is not a typo and must not be "fixed": the
    # extension builds its knack config with config_env_var_prefix
    # 'AZURE_DEVOPS_EXT_' (const.py CLI_ENV_VARIABLE_PREFIX), and knack
    # appends another '_' before '{section}_{option}', so the override for
    # defaults.organization is AZURE_DEVOPS_EXT__DEFAULTS_ORGANIZATION.
    # Verified on the target: with it set, `az devops project list` gets past
    # organization resolution and fails on credentials instead; with
    # AZURE_DEVOPS_ORG (what the source playbook read) or
    # AZURE_DEFAULTS_ORGANIZATION (the azure-cli core spelling) it still fails
    # with "--organization must be specified". The source playbook's
    # AZURE_DEVOPS_ORG / AZURE_DEVOPS_PROJECT were inputs to the *playbook*,
    # read with lookup('env', ...) and fed to `az devops configure`; the CLI
    # itself never read them.
    #
    # Note how close AZURE_DEVOPS_EXT__DEFAULTS_* sits to
    # AZURE_DEVOPS_EXT_PAT, which is a secret and must never be set here.
    azure_devops_default_organization: ""
    azure_devops_default_project: ""
    azure_devops_shared_env:
      AZURE_DEVOPS_EXT__DEFAULTS_ORGANIZATION: "{{ azure_devops_default_organization }}"
      AZURE_DEVOPS_EXT__DEFAULTS_PROJECT: "{{ azure_devops_default_project }}"

    # --- verification ------------------------------------------------------
    # Two scratch HOMEs, because az refuses to run without a writable one and
    # the two callers need different owners. The root one also keeps the probe
    # honest: with an empty HOME there can be no per-user extension in
    # /root/.azure to mask the system copy this playbook is asserting about.
    az_devops_root_home: /var/tmp/azure-devops-root-home
    az_devops_smoke_home: /var/tmp/azure-devops-smoke-home
    az_devops_verify_uid: 65534    # nobody
    az_devops_verify_gid: 65534    # nogroup

    # Microsoft's release-signing key, fingerprint
    # BC528686B50D79E339D3721CEB3E94ADBE1229CF, as served at
    # https://packages.microsoft.com/keys/microsoft.asc. Pinned rather than
    # fetched: deb822_repository embeds an armored block straight into
    # Signed-By, so the key is verified by being the one written here instead
    # of by whatever the URL serves on the day of the run. The armor's
    # `Version:` header is dropped -- not part of the key material, and it is
    # the only colon in the block, which keeps the value unambiguously not a
    # URL to the module's URL/path/inline dispatch.
    azure_cli_signing_key: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----

      mQENBFYxWIwBCADAKoZhZlJxGNGWzqV+1OG1xiQeoowKhssGAKvd+buXCGISZJwT
      LXZqIcIiLP7pqdcZWtE9bSc7yBY2MalDp9Liu0KekywQ6VVX1T72NPf5Ev6x6DLV
      7aVWsCzUAF+eb7DC9fPuFLEdxmOEYoPjzrQ7cCnSV4JQxAqhU4T6OjbvRazGl3ag
      OeizPXmRljMtUUttHQZnRhtlzkmwIrUivbfFPD+fEoHJ1+uIdfOzZX8/oKHKLe2j
      H632kvsNzJFlROVvGLYAk2WRcLu+RjjggixhwiB+Mu/A8Tf4V6b+YppS44q8EvVr
      M+QvY7LNSOffSO6Slsy9oisGTdfE39nC7pVRABEBAAG0N01pY3Jvc29mdCAoUmVs
      ZWFzZSBzaWduaW5nKSA8Z3Bnc2VjdXJpdHlAbWljcm9zb2Z0LmNvbT6JATQEEwEI
      AB4FAlYxWIwCGwMGCwkIBwMCAxUIAwMWAgECHgECF4AACgkQ6z6Urb4SKc+P9gf/
      diY2900wvWEgV7iMgrtGzx79W/PbwWiOkKoD9sdzhARXWiP8Q5teL/t5TUH6TZ3B
      ENboDjwr705jLLPwuEDtPI9jz4kvdT86JwwG6N8gnWM8Ldi56SdJEtXrzwtlB/Fe
      6tyfMT1E/PrJfgALUG9MWTIJkc0GhRJoyPpGZ6YWSLGXnk4c0HltYKDFR7q4wtI8
      4cBu4mjZHZbxIO6r8Cci+xxuJkpOTIpr4pdpQKpECM6x5SaT2gVnscbN0PE19KK9
      nPsBxyK4wW0AvAhed2qldBPTipgzPhqB2gu0jSryil95bKrSmlYJd1Y1XfNHno5D
      xfn5JwgySBIdWWvtOI05gw==
      =zPfd
      -----END PGP PUBLIC KEY BLOCK-----

  tasks:
    - name: 1. Install prerequisites
      # python3-debian is what deb822_repository needs to write a .sources
      # file. The source playbook's apt-transport-https, curl, gnupg and
      # lsb-release are gone: apt speaks https natively, the codename comes
      # from facts, and nothing dearmors a key any more.
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Fail on an unsupported CPU architecture
      ansible.builtin.fail:
        msg: >-
          No Azure CLI apt architecture is mapped for
          '{{ ansible_facts['architecture'] }}'. Add it to azure_cli_arch_map.
      when: azure_cli_arch | length == 0

    - name: 3. Remove the single-user playbook's apt source for this repository
      # cloud-cli/azure-cli.yml and cloud-cli/azure-devops-cli.yml both wrote
      # azure-cli.list for this repository. Left next to the .sources file
      # below, apt reads the repository twice and warns that the target is
      # configured multiple times.
      ansible.builtin.file:
        path: "{{ azure_cli_legacy_source }}"
        state: absent

    - name: 4. Add the Microsoft azure-cli apt repository
      # deb822_repository rather than get_url + a shell dearmor +
      # apt_repository: the key goes inline into Signed-By, so there is no key
      # file to manage and no command task reporting `changed` every run. The
      # module does not refresh the apt cache, hence task 5.
      ansible.builtin.deb822_repository:
        name: azure-cli
        types:
          - deb
        uris:
          - "{{ azure_cli_repo_uri }}"
        suites:
          - "{{ azure_cli_suite }}"
        components:
          - main
        architectures:
          - "{{ azure_cli_arch }}"
        signed_by: "{{ azure_cli_signing_key }}"
        state: present
        mode: '0644'
      register: azure_cli_repo

    - name: 5. Refresh the apt cache when the repository definition changed
      ansible.builtin.apt:
        update_cache: true
      when: azure_cli_repo.changed

    - name: 6. Check the currently installed azure-cli version
      # check_mode: false because this reads state that already exists. A
      # skipped command task still registers, with rc 0 and an empty stdout,
      # which the facts below would read as a version that is merely not the
      # pinned one.
      # ${Status} as well as ${Version} -- see azure_cli_dpkg_ok above.
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' azure-cli
      register: azure_cli_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 7. Decide whether azure-cli needs installing
      ansible.builtin.set_fact:
        azure_cli_install_needed: >-
          {{ azure_cli_installed.rc != 0
               or azure_cli_installed.stdout != (azure_cli_dpkg_ok ~ azure_cli_pkg_version) }}
        # Everything past task 8 needs the CLI actually present, and task 8
        # does not really run under --check.
        azure_cli_can_verify: >-
          {{ not (ansible_check_mode
                  and (azure_cli_installed.rc != 0
                         or azure_cli_installed.stdout != (azure_cli_dpkg_ok ~ azure_cli_pkg_version))) }}

    - name: 7a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install azure-cli {{ azure_cli_pkg_version }}, so the
          extension install and every check below are skipped rather than
          failed. Re-run without --check to verify.
      when: not (azure_cli_can_verify | bool)

    - name: 8. Install azure-cli via apt
      # allow_downgrade so that moving the pin backwards actually applies:
      # without it apt refuses, and the pin silently means "this version or
      # anything newer already present".
      ansible.builtin.apt:
        name: "azure-cli={{ azure_cli_pkg_version }}"
        state: present
        allow_downgrade: true
      # The second clause is about --check on a host that does not yet have this
      # vendor repository: the repository task reported `changed` without
      # writing anything, so apt has no candidate for the pinned version and
      # this task would fail outright rather than simulate. Where the
      # repository IS already configured, it still runs under --check, so a
      # dry run keeps showing what apt would do.
      when:
        - azure_cli_install_needed | bool
        - not (ansible_check_mode and azure_cli_repo.changed)

    - name: 9. Verify the installed azure-cli package version
      ansible.builtin.command: dpkg-query -W -f='${Status}|${Version}' azure-cli
      register: azure_cli_dpkg
      changed_when: false
      failed_when: azure_cli_dpkg.stdout != (azure_cli_dpkg_ok ~ azure_cli_pkg_version)
      when: azure_cli_can_verify | bool

    - name: 10. Create a scratch HOME for the root-side az invocations
      # check_mode: false, unlike the smoke-test HOME further down: task 11 is
      # a probe of pre-existing state and has to run for real in a dry run,
      # which it cannot do without a HOME. Creating and removing a throwaway
      # directory under /var/tmp is not a system change worth withholding from
      # --check, and task 16 removes it the same way.
      ansible.builtin.file:
        path: "{{ az_devops_root_home }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      check_mode: false
      when: azure_cli_can_verify | bool

    - name: 11. Check the azure-devops extension version in the system directory
      # AZURE_EXTENSION_SYS_DIR is left unset here as well as in the smoke
      # test: the default system directory is what task 13 writes to, so the
      # probe and the install have to agree on where that is. With an empty
      # HOME there is no per-user extension to be reported instead.
      ansible.builtin.command:
        cmd: >-
          env HOME={{ az_devops_root_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          az extension show --name {{ az_devops_ext_name }} --query version -o tsv
      register: az_devops_ext_installed
      changed_when: false
      check_mode: false
      failed_when: false
      when: azure_cli_can_verify | bool

    - name: 12. Decide whether the azure-devops extension needs installing
      # Guarded on the version the CLI reports, not on the directory existing:
      # bumping az_devops_ext_version has to replace the extension. Note this
      # also self-heals an azure-cli upgrade that moves the CLI's Python
      # version -- the system extension directory lives under it, so the
      # extension goes missing and is reinstalled on the next run.
      ansible.builtin.set_fact:
        az_devops_ext_install_needed: >-
          {{ az_devops_ext_installed.rc | default(1) != 0
             or (az_devops_ext_installed.stdout | default('') | trim) != az_devops_ext_version }}
        az_devops_can_verify: >-
          {{ (azure_cli_can_verify | bool)
             and not (ansible_check_mode
                      and (az_devops_ext_installed.rc | default(1) != 0
                           or (az_devops_ext_installed.stdout | default('') | trim) != az_devops_ext_version)) }}

    - name: 13. Install the azure-devops extension into the system directory
      # --system is the whole point of this playbook: without it the extension
      # lands in $HOME/.azure/cliextensions and only this account can use it.
      # --upgrade replaces a differently-versioned extension rather than
      # refusing; the task is guarded, so it never runs against a match.
      ansible.builtin.command:
        cmd: >-
          env HOME={{ az_devops_root_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          az extension add --system --upgrade --yes
          --name {{ az_devops_ext_name }} --version {{ az_devops_ext_version }}
      changed_when: true
      when:
        - azure_cli_can_verify | bool
        - az_devops_ext_install_needed | bool

    - name: 14. Resolve the system extension directory
      ansible.builtin.command:
        cmd: >-
          env HOME={{ az_devops_root_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          az extension show --name {{ az_devops_ext_name }} --query path -o tsv
      register: az_devops_ext_path
      changed_when: false
      failed_when: (az_devops_ext_path.stdout | trim) | length == 0
      when: az_devops_can_verify | bool

    - name: 15. Make the extension tree readable by every account
      # pip installs it with root's umask rather than an explicit mode, so the
      # mode is set here instead of being inherited from whoever ran the play.
      ansible.builtin.file:
        path: "{{ az_devops_ext_path.stdout | trim }}"
        state: directory
        owner: root
        group: root
        mode: 'u=rwX,go=rX'
        recurse: true
      when:
        - az_devops_can_verify | bool
        - (az_devops_ext_path.stdout | default('') | trim) | length > 0

    - name: 15a. Make the system extension directory itself readable
      # Task 13 creates this parent as well, and an unreadable parent hides a
      # readable extension. Deliberately not recursive: `recurse` on a path
      # derived from command output would chmod whatever tree that output
      # happened to name, which is a wide blast radius for a value this
      # playbook does not control.
      ansible.builtin.file:
        path: "{{ az_devops_ext_path.stdout | trim | dirname }}"
        state: directory
        owner: root
        group: root
        mode: 'u=rwX,go=rX'
      when:
        - az_devops_can_verify | bool
        - (az_devops_ext_path.stdout | default('') | trim) | length > 0

    - name: 16. Remove the scratch HOME used for the root-side az invocations
      ansible.builtin.file:
        path: "{{ az_devops_root_home }}"
        state: absent
      check_mode: false

    - name: 17. Set the shared Azure DevOps defaults in /etc/environment
      # A shared default belongs in /etc, set from an explicit play var, not
      # written into one account's ~/.azure/config from whatever the person
      # running the playbook happened to have exported. Empty by default, so
      # nothing is set unless asked for. Only non-secret endpoint config goes
      # here: AZURE_DEVOPS_EXT_PAT is a secret and stays in each user's $HOME.
      # Clearing a value again is a manual edit -- an empty var skips rather
      # than removes, so that a run without the flag does not silently drop
      # what a previous run set.
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        state: present
        create: true
        owner: root
        group: root
        mode: '0644'
      loop: "{{ azure_devops_shared_env | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value | length > 0

    - name: 18. Create a scratch HOME for the unprivileged check
      # az writes to $HOME/.azure on every invocation and aborts outright when
      # HOME is unset or unwritable (PermissionError on /nonexistent), so the
      # smoke test needs a HOME of its own. /var/tmp rather than /tmp: /tmp is
      # a size-capped tmpfs on these hosts (see POLICY.md's C4).
      ansible.builtin.file:
        path: "{{ az_devops_smoke_home }}"
        state: directory
        owner: "{{ az_devops_verify_uid }}"
        group: "{{ az_devops_verify_gid }}"
        mode: '0700'
      when: az_devops_can_verify | bool

    - name: 19. Confirm an unprivileged user discovers the system extension
      # The regression guard for this migration. This account has never run
      # `az extension add`, and its HOME is empty, so the only way the
      # extension can be reported is from the root-owned system directory --
      # which is exactly what the source playbook's `become: no` install could
      # not do. AZURE_EXTENSION_SYS_DIR and AZURE_CONFIG_DIR are deliberately
      # left unset: default discovery is the thing under test.
      #
      # AZURE_CORE_COLLECT_TELEMETRY=0 is not a discovery variable and does not
      # weaken that: it stops az forking a telemetry uploader that outlives the
      # command and recreates this scratch HOME after task 21 removes it.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ az_devops_verify_uid }} --regid={{ az_devops_verify_gid }} --clear-groups
          env HOME={{ az_devops_smoke_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          az extension show --name {{ az_devops_ext_name }} --query version -o tsv
      register: az_devops_smoke_version
      changed_when: false
      failed_when: (az_devops_smoke_version.stdout | trim) != az_devops_ext_version
      when: az_devops_can_verify | bool

    - name: 20. Load the az devops command group as an unprivileged user
      # Stronger than task 19: listing the extension proves the directory is
      # readable, while `az devops -h` proves the CLI can import the command
      # loader out of it and build the command table. Offline and
      # unauthenticated, which is the most real work this tool can do without
      # an identity.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ az_devops_verify_uid }} --regid={{ az_devops_verify_gid }} --clear-groups
          env HOME={{ az_devops_smoke_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          az devops -h
      register: az_devops_smoke_help
      changed_when: false
      failed_when: "'project' not in az_devops_smoke_help.stdout"
      when: az_devops_can_verify | bool

    - name: 20a. Confirm a shared default organization actually resolves
      # Only when one is configured. This is the check that catches a shared
      # default written under a name the CLI does not read -- the failure mode
      # that AZURE_DEVOPS_ORG (the source playbook's name) has: the variable is
      # set, /etc/environment looks right, and every user still gets
      # "--organization must be specified". Keyed on the negative, so it asserts
      # that organization resolution was reached rather than depending on the
      # exact wording of the error that follows it.
      #
      # The value is passed explicitly rather than sourced from
      # /etc/environment: PAM applies that at login, which an Ansible task is
      # not. What is under test is the variable *name*.
      #
      # Fails on credentials, which is correct and expected -- this playbook
      # configures no identity, so there is nothing to authenticate with.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ az_devops_verify_uid }} --regid={{ az_devops_verify_gid }} --clear-groups
          env HOME={{ az_devops_smoke_home }} AZURE_CORE_COLLECT_TELEMETRY=0
          AZURE_DEVOPS_EXT__DEFAULTS_ORGANIZATION={{ azure_devops_default_organization }}
          az devops project list
      register: az_devops_org_smoke
      changed_when: false
      failed_when: "'--organization must be specified' in (az_devops_org_smoke.stderr | default(''))"
      when:
        - az_devops_can_verify | bool
        - azure_devops_default_organization | length > 0

    - name: 21. Remove the scratch HOME used for the unprivileged check
      ansible.builtin.file:
        path: "{{ az_devops_smoke_home }}"
        state: absent

    - name: 22. Display installation summary
      ansible.builtin.debug:
        msg:
          - >-
            Azure CLI {{ azure_cli_pkg_version }} ({{ azure_cli_arch }}) with the
            {{ az_devops_ext_name }} {{ az_devops_ext_version }} extension
            {{ az_devops_can_verify | bool
               | ternary('is installed system-wide.', 'would be installed system-wide.') }}
          - ""
          - "  /usr/bin/az"
          - "  {{ az_devops_ext_path.stdout | default('(not resolved in this run)') | trim }}"
          - ""
          - >-
            {{ az_devops_can_verify | bool
               | ternary('Verified: uid ' ~ az_devops_verify_uid ~ ', with an empty HOME and no'
                         ~ ' extension of its own, discovers the system extension and loads the'
                         ~ ' az devops command group.',
                         'Not verified: this was a --check run against a host that does not already'
                         ~ ' have this version.') }}
          - ""
          - >-
            {{ (((azure_devops_default_organization ~ azure_devops_default_project) | length) > 0)
               | ternary('Shared defaults written to /etc/environment (log out and back in to pick'
                         ~ ' them up): AZURE_DEVOPS_EXT__DEFAULTS_ORGANIZATION /'
                         ~ ' AZURE_DEVOPS_EXT__DEFAULTS_PROJECT -- double underscore, see the vars.',
                         'No shared default org or project set. Pass -e'
                         ~ ' azure_devops_default_organization=https://dev.azure.com/YOUR_ORG to set'
                         ~ ' one for every account.') }}
          - ""
          - "No identity is configured by this playbook. Each user runs, for themselves:"
          - "  az login                                  # token cache in ~/.azure"
          - "  az devops configure --defaults organization=https://dev.azure.com/YOUR_ORG"
          - "  az devops configure --defaults project=YOUR_PROJECT"
          - "  export AZURE_DEVOPS_EXT_PAT=<pat>         # non-interactive auth; a SECRET,"
          - "                                            # keep it in ~, never /etc/environment"
          - ""
          - "Common commands:"
          - "  az devops project list                    # list projects"
          - "  az repos list                             # list Git repositories"
