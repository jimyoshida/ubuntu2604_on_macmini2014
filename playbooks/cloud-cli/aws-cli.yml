      b1rHj6Z0SrCkJujhWk3IBPic/wJgz01LEc/OAdUPlby90RJZcIBhSlWhT7mXnXIO
      c0HWlNQrns2s3CTyYwZSiSlYe9ApeLwhjDo8NhbFuCAy61l6O5UsR4AfZxx/rGKv
      2wFb1/RN/P4gNe6vmxZAPjR0AQcwD3tc2McimOLr/22kmPz8IH3I0X7WoSFr0Biz
      E91G7bb0hOb/cA==
      =knv7
      -----END PGP PUBLIC KEY BLOCK-----

  tasks:
    - name: 1. Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Fail on an unsupported CPU architecture
      ansible.builtin.fail:
        msg: >-
          No AWS CLI installer is mapped for architecture
          '{{ ansible_facts['architecture'] }}'. Add it to aws_cli_arch_map.
      when: aws_cli_arch | length == 0

    - name: 3. Check the currently installed AWS CLI version
      ansible.builtin.command: "{{ aws_cli_bin }} --version"
      register: aws_cli_installed
      changed_when: false
      # check_mode: false throughout this playbook wherever a task only
      # READS state: without it a dry run skips them and the checks below
      # act on output that was never produced.
      check_mode: false
      failed_when: false

    - name: 4. Decide whether the AWS CLI needs installing
      # The version is compared, not merely the presence of the binary, so
      # that bumping aws_cli_version actually replaces the install. The
      # trailing space anchors the match: without it, a pin of 2.36.1 would
      # be satisfied by an installed 2.36.17.
      ansible.builtin.set_fact:
        aws_cli_install_needed: >-
          {{ ('aws-cli/' ~ aws_cli_version ~ ' ') not in (aws_cli_installed.stdout | default('')) }}
        aws_cli_can_verify: >-
          {{ not (ansible_check_mode and (('aws-cli/' ~ aws_cli_version ~ ' ') not in (aws_cli_installed.stdout | default('')))) }}

    - name: 4a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install the AWS CLI {{ aws_cli_version }}, so the
          version check and the unprivileged configuration check below are
          skipped rather than failed. Re-run without --check to verify.
      when: not (aws_cli_can_verify | bool)

    - name: 5. Create the staging directories
      # The gnupg subdirectory is created here rather than left to gpg: under
      # --batch, gpg will not create a missing --homedir and fails with
      # "no writable keyring found" instead. 0700 is required, or gpg warns
      # about unsafe permissions on every invocation.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ aws_cli_stage_dir }}"
        - "{{ aws_cli_stage_dir }}/gnupg"
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 6. Write the AWS CLI signing key
      ansible.builtin.copy:
        content: "{{ aws_cli_public_key }}"
        dest: "{{ aws_cli_stage_dir }}/aws-cli-public-key.asc"
        owner: root
        group: root
        mode: '0600'
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 7. Download the AWS CLI installer and its signature
      ansible.builtin.get_url:
        url: "{{ aws_cli_base_url }}/{{ item }}"
        dest: "{{ aws_cli_stage_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - "{{ aws_cli_zip }}"
        - "{{ aws_cli_zip }}.sig"
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 8. Import the signing key into a throwaway keyring
      # A staging GNUPGHOME rather than root's own keyring: this key is used
      # to check one artifact and should not become permanently trusted for
      # anything else on the host.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_cli_stage_dir }}/gnupg --batch --quiet
          --import {{ aws_cli_stage_dir }}/aws-cli-public-key.asc
      changed_when: true
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 9. Confirm the imported key is the pinned AWS CLI signing key
      # Guards the embedded key block itself: a swapped key would otherwise
      # produce a "good" signature for a swapped installer.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_cli_stage_dir }}/gnupg --batch
          --with-colons --fingerprint
      register: aws_cli_fpr
      changed_when: false
      failed_when: aws_cli_key_fingerprint not in aws_cli_fpr.stdout
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 10. Verify the installer's signature
      # gpg exits 0 only for a good signature; the "key is not certified with
      # a trusted signature" warning it prints for an uncertified key does not
      # affect the exit status, so the exit code is the gate.
      ansible.builtin.command:
        cmd: >-
          gpg --homedir {{ aws_cli_stage_dir }}/gnupg --batch
          --verify {{ aws_cli_stage_dir }}/{{ aws_cli_zip }}.sig
          {{ aws_cli_stage_dir }}/{{ aws_cli_zip }}
      changed_when: false
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 11. Unpack the installer
      ansible.builtin.unarchive:
        src: "{{ aws_cli_stage_dir }}/{{ aws_cli_zip }}"
        dest: "{{ aws_cli_stage_dir }}"
        remote_src: true
        owner: root
        group: root
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 12. Run the AWS CLI installer
      # --update makes the installer replace an existing install instead of
      # refusing; the install/bin dirs are passed explicitly rather than
      # relying on the installer's defaults staying what they are today.
      ansible.builtin.command:
        cmd: >-
          {{ aws_cli_stage_dir }}/aws/install --update
          --install-dir {{ aws_cli_install_dir }}
          --bin-dir {{ aws_cli_bin_dir }}
      changed_when: true
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 13. Make the install tree readable by every account
      # The installer applies root's umask rather than an explicit mode, so
      # this is set here instead of being inherited from whoever ran the play.
      ansible.builtin.file:
        path: "{{ aws_cli_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: 'u=rwX,go=rX'
        recurse: true
      when:
        - aws_cli_install_needed | bool
        # A dry run creates no staging directory, so nothing downstream of it
        # can be attempted either: without this, --check on a host without the
        # AWS CLI fails at "Destination /var/tmp/awscli-install-<version> does
        # not exist" -- and get_url, unlike command, is NOT skipped in check
        # mode, so it really does try to download.
        - not ansible_check_mode

    - name: 14. Remove the staging directory
      ansible.builtin.file:
        path: "{{ aws_cli_stage_dir }}"
        state: absent

    - name: 15. Verify the installed AWS CLI version
      ansible.builtin.command: "{{ aws_cli_bin }} --version"
      register: aws_cli_version_out
      changed_when: false
      failed_when: ('aws-cli/' ~ aws_cli_version ~ ' ') not in aws_cli_version_out.stdout
      check_mode: false
      when: aws_cli_can_verify | bool

    - name: 16. Create a scratch HOME for the unprivileged check
      # `aws configure list` reads ~/.aws, so the smoke test needs a HOME it
      # can read. AWS_CONFIG_FILE and friends are deliberately left unset so
      # that the zero-configuration discovery path is what gets exercised.
      ansible.builtin.file:
        path: "{{ aws_cli_smoke_home }}"
        state: directory
        owner: "{{ aws_cli_verify_uid }}"
        group: "{{ aws_cli_verify_gid }}"
        mode: '0700'
      check_mode: false
      when: aws_cli_can_verify | bool

    - name: 17. Inspect AWS CLI configuration as an unprivileged user
      # Exercises more than --version does: `configure list` loads the
      # bundled interpreter and libraries and walks the credential chain.
      # With no credentials present it prints "<not set>" and exits 0, which
      # is the expected result here — this playbook installs a client and
      # deliberately configures no identity.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ aws_cli_verify_uid }} --regid={{ aws_cli_verify_gid }} --clear-groups
          env HOME={{ aws_cli_smoke_home }} {{ aws_cli_bin }} configure list
      register: aws_cli_smoke
      changed_when: false
      failed_when: "'access_key' not in aws_cli_smoke.stdout"
      check_mode: false
      when: aws_cli_can_verify | bool

    - name: 18. Remove the scratch HOME
      ansible.builtin.file:
        path: "{{ aws_cli_smoke_home }}"
        state: absent
      check_mode: false
      when: aws_cli_can_verify | bool

    - name: 19. Display installation summary
      ansible.builtin.debug:
        msg:
          - "{{ aws_cli_version_out.stdout | trim }}"
          - ""
          - "  {{ aws_cli_install_dir }}/v2/{{ aws_cli_version }} ({{ aws_cli_arch }})"
          - "  {{ aws_cli_bin }}"
          - "  {{ aws_cli_bin_dir }}/aws_completer"
          - ""
          - "Installer signature verified against {{ aws_cli_key_fingerprint }}."
          - "Verified runnable by an unprivileged user (uid {{ aws_cli_verify_uid }})."
          - ""
          - "Credentials are per-account and are NOT configured by this playbook."
          - "Each user runs, for themselves:"
          - "  aws configure                 # static keys, written to ~/.aws"
          - "  aws configure sso             # IAM Identity Center"
          - "  aws sts get-caller-identity   # confirm who you are"
      when: aws_cli_can_verify | bool
