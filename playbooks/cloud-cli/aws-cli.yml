---
# Install the AWS CLI v2 system-wide on a multi-user workstation.
#
# AWS's own installer already targets root-owned system paths:
#
#   /usr/local/aws-cli/v2/<version>/   the bundled interpreter and libraries
#   /usr/local/bin/aws                 symlink into the above
#   /usr/local/bin/aws_completer       symlink into the above
#
# so this migration is correctness work rather than reach work. What the
# source playbook (cloud-cli/aws-cli.yml) lacked: a version pin, signature
# verification, architecture from facts, and a guard that survives a version
# bump. Its `creates: /usr/local/bin/aws` guard made `--update` unreachable,
# so once installed the CLI could never move.
#
# Credentials stay per-user in ~/.aws and are not touched here. Nothing is
# written to any $HOME, and no environment variable is set: the AWS CLI reads
# AWS_PROFILE / AWS_REGION and its credential files per-account, which is the
# correct behaviour on a shared box.
#
# apt was considered and rejected: Ubuntu 26.04 universe carries a genuine
# v2 (2.31.x) but trails upstream by several minor releases and will drift
# further over an LTS lifetime, while `aws` ships weekly. Revisit if
# `apt-cache policy awscli` on the target ever lands close to upstream.
#
# Usage:
#   ansible-playbook cloud-cli/aws-cli.yml -e host=<inventory host or group>
#   ansible-playbook cloud-cli/aws-cli.yml -e host=ws01 -e aws_cli_version=2.36.17

- name: Install the AWS CLI v2 system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    aws_cli_version: "2.36.17"
    aws_cli_install_dir: /usr/local/aws-cli
    aws_cli_bin_dir: /usr/local/bin
    aws_cli_bin: /usr/local/bin/aws
    aws_cli_base_url: "https://awscli.amazonaws.com"
    # ansible_facts['architecture'] -> upstream installer asset name. AWS
    # happens to use the same strings uname does, but the map is kept
    # explicit so an unmapped architecture fails loudly instead of silently
    # taking amd64.
    aws_cli_arch_map:
      x86_64: x86_64
      aarch64: aarch64
    aws_cli_arch: "{{ aws_cli_arch_map[ansible_facts['architecture']] | default('') }}"
    aws_cli_zip: "awscli-exe-linux-{{ aws_cli_arch }}-{{ aws_cli_version }}.zip"
    # Disk-backed, not /tmp: the installer zip is ~70MiB and unpacks larger,
    # and /tmp is a size-capped tmpfs on these hosts (see POLICY.md's C4).
    aws_cli_stage_dir: "/var/tmp/awscli-install-{{ aws_cli_version }}"
    aws_cli_smoke_home: /var/tmp/aws-cli-smoke-home
    # uid/gid used to prove the install is usable by an arbitrary user
    aws_cli_verify_uid: 65534    # nobody
    aws_cli_verify_gid: 65534    # nogroup
    # AWS publishes this key only in the installation documentation, not at a
    # fetchable URL, so it is pinned here rather than downloaded. Fetching it
    # from awscli.amazonaws.com would in any case prove nothing that the
    # signature does not already prove, since the artifact comes from the same
    # host. Do NOT substitute a keyserver copy: keys.openpgp.org and
    # keyserver.ubuntu.com both serve a stale self-signature for this key that
    # gpg reports as expired (2026-07-07), while the documented copy carries an
    # extended expiry (2027-07-01). Same fingerprint, different expiry.
    #   https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html
    aws_cli_key_fingerprint: "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"
    aws_cli_public_key: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----

      mQINBF2Cr7UBEADJZHcgusOJl7ENSyumXh85z0TRV0xJorM2B/JL0kHOyigQluUG
