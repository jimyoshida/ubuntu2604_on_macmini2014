  pre_tasks:
    - name: 0. Normalise docker_users into a list
      ansible.builtin.set_fact:
        docker_user_list: >-
          {{ (docker_users.split(',') if docker_users is string else docker_users)
             | map('trim') | select | list }}

    - name: 0a. Read the target host's passwd database
      ansible.builtin.getent:
        database: passwd

    - name: 0b. Require every account named for the docker group to exist
      ansible.builtin.assert:
        that: item in ansible_facts.getent_passwd
        fail_msg: "No account '{{ item }}' on {{ inventory_hostname }}."
      loop: "{{ docker_user_list }}"

    # Said out loud, before anything happens, because this is the one grant in
    # this repo that is worth root. The list can also be silently truncated
    # upstream of the playbook: `-e docker_users="alice, bob"` splits on
    # whitespace at the shell and binds only "alice,".
    - name: 0c. Show which accounts this run will grant root-equivalent access to
      ansible.builtin.debug:
        msg: >-
          {{ (docker_user_list | length > 0)
             | ternary('GRANTING ROOT-EQUIVALENT DOCKER ACCESS on ' ~ inventory_hostname
                       ~ ' to ' ~ (docker_user_list | length) ~ ' account(s): '
                       ~ (docker_user_list | join(', ')),
                       'No docker_users given: this run grants nobody access to the '
                       ~ 'daemon. The engine will be installed and running, and no '
                       ~ 'account will be able to talk to it.') }}

  tasks:
    - name: 1. Install prerequisites
      # python3-debian is what deb822_repository needs to write a .sources
      # file; gnupg is for the fingerprint assertion in task 5. The source
      # playbook needed neither, and its apt-transport-https is unnecessary:
      # apt has spoken https natively since 1.5.
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Fail on an unsupported CPU architecture
      ansible.builtin.fail:
        msg: >-
          No Docker apt architecture is mapped for
          '{{ ansible_facts['architecture'] }}'. Add it to docker_arch_map.
      when: docker_arch | length == 0

    - name: 3. Remove the single-user playbook's apt source for this repository
      # The old auto-named .list. Its keyring is the same /etc/apt/keyrings/
      # docker.asc the module writes below, so there is no stale keyring to
      # clean up here -- only the duplicate source definition.
      ansible.builtin.file:
        path: "{{ docker_legacy_source }}"
        state: absent

    - name: 4. Add the Docker apt repository
      # download.docker.com publishes for this release directly, so unlike the
      # Microsoft and HashiCorp repositories no codename map is needed --
      # ansible_facts['distribution_release'] is used as-is. Confirm the suite
      # exists before bumping to a new Ubuntu release.
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - "{{ docker_repo_uri }}"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - "{{ docker_arch }}"
        signed_by: "{{ docker_signing_key }}"
        state: present
        mode: '0644'
      register: docker_repo

    - name: 5. Read the fingerprints in the pinned signing key
      # The key is read from the playbook variable, not from a file on the
      # target, because with an INLINE armored key deb822_repository writes no
      # keyring at all: it embeds the block in the .sources file's Signed-By:
      # field. It also returns `key_filename` as an empty value rather than
      # leaving it undefined, so `| default('/etc/apt/keyrings/docker.asc')`
      # does NOT fire -- Jinja's default() only substitutes undefined values
      # unless given `true` as its second argument. An earlier draft of this
      # task ran gpg with an empty path and failed here for that reason.
      #
      # (The URL form of A5, as in cloud-cli/github-cli.yml, behaves the other
      # way: the module downloads the key to /etc/apt/keyrings/<name>.gpg and
      # does return key_filename. The two forms are not interchangeable in a
      # task that wants to inspect the key.)
      #
      # Verifying the variable is the check that matters anyway: it asserts
      # that the bytes this playbook pins really are Docker's key, which is
      # what a mangled paste or a substituted block would break. apt verifies
      # the other direction for itself -- a repository signed by anything else
      # fails its Release check.
      ansible.builtin.command:
        cmd: gpg --show-keys --with-colons
        stdin: "{{ docker_signing_key }}"
      register: docker_fpr
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 6. Confirm the pinned key is Docker's signing key
      ansible.builtin.fail:
        msg: >-
          The signing key pinned in this playbook is not Docker's key
          {{ docker_key_fingerprint }}. Refusing to configure a repository
          signed by an unknown key.
      when: docker_key_fingerprint not in (docker_fpr.stdout | default(''))

    - name: 7. Refresh the apt cache when the repository definition changed
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo.changed

    - name: 8. Check the currently installed Docker package versions
      # check_mode: false because this reads state that already exists -- a
      # skipped command task registers rc 0 and an empty stdout, which task 9
      # would read as "nothing is at the pinned version" by accident rather
      # than by measurement.
      # ${Status} as well as ${Version} -- see docker_dpkg_ok above.
      ansible.builtin.command:
        cmd: >-
          dpkg-query -W -f='${Package} ${Status}|${Version}\n'
          docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      register: docker_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 9. Decide whether the Docker packages need installing
      ansible.builtin.set_fact:
        docker_install_needed: >-
          {{ ('docker-ce ' ~ docker_dpkg_ok ~ docker_version)
             not in docker_installed.stdout
               or ('docker-ce-cli ' ~ docker_dpkg_ok ~ docker_version) not in docker_installed.stdout
               or ('containerd.io ' ~ docker_dpkg_ok ~ containerd_version) not in docker_installed.stdout
               or ('docker-buildx-plugin ' ~ docker_dpkg_ok ~ docker_buildx_version)
                  not in docker_installed.stdout
               or ('docker-compose-plugin ' ~ docker_dpkg_ok ~ docker_compose_version)
                  not in docker_installed.stdout }}
        docker_can_verify: >-
          {{ not (ansible_check_mode
                  and (('docker-ce ' ~ docker_dpkg_ok ~ docker_version)
                     not in docker_installed.stdout
                         or ('docker-ce-cli ' ~ docker_dpkg_ok ~ docker_version)
                            not in docker_installed.stdout
                         or ('containerd.io ' ~ docker_dpkg_ok ~ containerd_version)
                            not in docker_installed.stdout
                         or ('docker-buildx-plugin ' ~ docker_dpkg_ok ~ docker_buildx_version)
                            not in docker_installed.stdout
                         or ('docker-compose-plugin ' ~ docker_dpkg_ok ~ docker_compose_version)
                            not in docker_installed.stdout)) }}

    - name: 9a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install the pinned Docker packages, so the version
          check, the daemon state and the unprivileged checks below are skipped
          rather than failed. Re-run without --check to verify.
      when: not (docker_can_verify | bool)

    - name: 10. Install Docker Engine, CLI, containerd and the CLI plugins
      # docker-ce-rootless-extras is installed but not configured: it is what
      # makes rootless Docker available to an account that would otherwise need
      # the root-equivalent group grant, and each account opts in for itself
      # with `dockerd-rootless-setuptool.sh install`.
      #
      # allow_downgrade so that moving a pin backwards actually applies.
      ansible.builtin.apt:
        name:
          - "docker-ce={{ docker_version }}"
          - "docker-ce-cli={{ docker_version }}"
          - "containerd.io={{ containerd_version }}"
          - "docker-buildx-plugin={{ docker_buildx_version }}"
          - "docker-compose-plugin={{ docker_compose_version }}"
          - "docker-ce-rootless-extras={{ docker_version }}"
        state: present
        allow_downgrade: true
      when:
        - docker_install_needed | bool
        - not (ansible_check_mode and docker_repo.changed)

    - name: 11. Verify the installed Docker package versions
      ansible.builtin.command:
        cmd: >-
          dpkg-query -W -f='${Package} ${Status}|${Version}\n'
          docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      register: docker_dpkg
      changed_when: false
      check_mode: false
      failed_when: >-
        ('docker-ce ' ~ docker_dpkg_ok ~ docker_version) not in docker_dpkg.stdout
        or ('docker-ce-cli ' ~ docker_dpkg_ok ~ docker_version) not in docker_dpkg.stdout
          or ('containerd.io ' ~ docker_dpkg_ok ~ containerd_version) not in docker_dpkg.stdout
          or ('docker-buildx-plugin ' ~ docker_dpkg_ok ~ docker_buildx_version) not in docker_dpkg.stdout
          or ('docker-compose-plugin ' ~ docker_dpkg_ok ~ docker_compose_version) not in docker_dpkg.stdout
      when: docker_can_verify | bool

    - name: 12. Ensure the Docker daemon is enabled and running
      # The package enables it on install; this asserts the state rather than
      # assuming it, since the smoke tests below distinguish "cannot reach the
      # socket" from "there is no socket".
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      when: docker_can_verify | bool

    - name: 13. Add the named accounts to the docker group
      # append: true is the whole of B1's "grants are additive" rule: this must
      # not remove a membership the run did not name. With docker_users empty
      # the loop is empty and nothing is granted or revoked.
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_user_list }}"

    - name: 14. Create a scratch HOME for the unprivileged checks
      # docker reads ~/.docker. /var/tmp rather than /tmp, which is a
      # size-capped tmpfs on these hosts (POLICY.md's C4).
      ansible.builtin.file:
        path: "{{ docker_smoke_home }}"
        state: directory
        owner: "{{ docker_verify_uid }}"
        group: "{{ docker_verify_gid }}"
        mode: '0700'
      check_mode: false

    - name: 15. List docker contexts as an unprivileged user
      # B4 verification, level 2 -- a subcommand that inspects the install
      # itself. It resolves the context configuration and reports the default
      # endpoint without needing to reach the daemon.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ docker_verify_uid }} --regid={{ docker_verify_gid }} --clear-groups
          env HOME={{ docker_smoke_home }} docker context ls
        chdir: "{{ docker_smoke_home }}"
      register: docker_smoke_context
      changed_when: false
      check_mode: false
      failed_when: "'unix:///var/run/docker.sock' not in docker_smoke_context.stdout"
      when: docker_can_verify | bool

    - name: 16. Run the buildx CLI plugin as an unprivileged user
      # This is the actual multi-user question for Docker's CLI: the plugins
      # live in /usr/libexec/docker/cli-plugins, and a plugin directory that
      # only root can traverse would leave `docker buildx` working for the
      # account that ran the playbook and nobody else.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ docker_verify_uid }} --regid={{ docker_verify_gid }} --clear-groups
          env HOME={{ docker_smoke_home }} docker buildx version
        chdir: "{{ docker_smoke_home }}"
      register: docker_smoke_buildx
      changed_when: false
      check_mode: false
      failed_when: "'github.com/docker/buildx' not in docker_smoke_buildx.stdout"
      when: docker_can_verify | bool

    - name: 17. Assert that an ungranted account CANNOT reach the daemon
      # B4's negative assertion, and the most important check in this playbook:
      # it proves the grant is a grant. uid 65534 is never in docker_users, so
      # it must be refused at the socket. A run where an ungranted account can
      # drive the daemon is a finding, not a pass.
      #
      # The error text is matched rather than the exit status alone, because
      # `docker ps` exits non-zero for many reasons -- including a daemon that
      # is simply not running, which would make this assertion pass while
      # proving nothing.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ docker_verify_uid }} --regid={{ docker_verify_gid }} --clear-groups
          env HOME={{ docker_smoke_home }} docker ps
        chdir: "{{ docker_smoke_home }}"
      register: docker_smoke_refused
      changed_when: false
      check_mode: false
      failed_when: >-
        docker_smoke_refused.rc == 0
        or 'permission denied' not in (docker_smoke_refused.stderr | lower)
        or '/var/run/docker.sock' not in docker_smoke_refused.stderr
      when: docker_can_verify | bool

    - name: 18. Remove the scratch HOME
      ansible.builtin.file:
        path: "{{ docker_smoke_home }}"
        state: absent
      check_mode: false

    - name: 19. Display installation summary
      ansible.builtin.debug:
        msg: >-
          {{ ([
               'Docker Engine ' ~ docker_version ~ ' (' ~ docker_arch ~ ') '
               ~ (docker_can_verify | bool
                  | ternary('is installed and running.', 'would be installed.')),
               '',
               '  /usr/bin/docker',
               '  /usr/libexec/docker/cli-plugins/   buildx ' ~ docker_buildx_version
               ~ ', compose ' ~ docker_compose_version,
               '  /etc/apt/sources.list.d/docker.sources   (signing key inline)',
               '',
             ]
             + (docker_can_verify | bool
                | ternary(['Verified: an unprivileged account (uid ' ~ docker_verify_uid
                           ~ ') can run the CLI and its buildx plugin, and is REFUSED at the '
                           ~ 'socket -- so group membership is what grants access, as intended.'],
                          ['Not verified: this was a --check run.']))
             + ['']
             + ((docker_user_list | length > 0)
                | ternary(['Granted membership of the `docker` group to: '
                           ~ (docker_user_list | join(', ')),
                           'That is EQUIVALENT TO PASSWORDLESS ROOT on this host: the socket will',
                           'start a container with the host filesystem bind-mounted, as root.',
                           'Members must log out and back in for the new group to take effect.'],
                          ['Docker is installed and running. No account was granted access to the socket.',
                           'Membership of the `docker` group is equivalent to passwordless root on this host.',
                           'Grant it deliberately, per account:',
                           '  ansible-playbook container/docker.yml -e host=' ~ inventory_hostname
                           ~ ' -e docker_users=alice,bob',
                           '',
                           'This is NOT a bug and NOT a regression from container/docker.yml, which',
                           'granted it automatically to whoever ran it. If you want the daemon usable',
                           'without a root-equivalent grant, use rootless Docker',
                           '(dockerd-rootless-setuptool.sh install, per account) or podman.']))
          ) | join('\n') }}
