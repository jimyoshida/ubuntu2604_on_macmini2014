---
# Install Docker Engine system-wide on a multi-user workstation.
#
#   /usr/bin/docker                            the CLI
#   /usr/libexec/docker/cli-plugins/           buildx and compose, shared
#   /etc/apt/sources.list.d/docker.sources     repository definition, with
#                                              Docker's signing key inline
#
# THE DEFAULT GRANTS NOBODY ACCESS TO THE DAEMON, AND THAT IS DELIBERATE.
# Membership of the `docker` group is equivalent to passwordless root on this
# host: the socket it grants will start a container with the host filesystem
# bind-mounted, as root. The source playbook (container/docker.yml) added
# whoever ran it, read from lookup('env', 'USER'). This one adds only the
# accounts named in docker_users, which defaults to empty -- so a fresh run
# produces a working daemon that the invoking account cannot talk to. That is
# the correct default on a shared box, and it will look like a regression to
# the first person who hits it (POLICY.md B1).
#
#   ansible-playbook container/docker.yml -e host=ws01 -e docker_users=alice,bob
#
# Grants are additive: an account left out of the list keeps whatever it
# already has. Revoking is a deliberate act, not a side effect of running with
# a shorter list.
#
# Alternatives to the grant, both real:
#   - rootless Docker, via the docker-ce-rootless-extras package this playbook
#     installs (`dockerd-rootless-setuptool.sh install`, per account)
#   - podman (container/podman.yml), which needs no grant at all
#
# What else changed versus the source playbook: A5 cleanup (deb822_repository
# instead of get_url + a `force: true` re-download that reported `changed` on
# every run, architecture from facts instead of a hardcoded arch=amd64), all
# five packages pinned, and the `xhost +local:docker` line appended to the
# invoker's ~/.bashrc deleted with nothing replacing it (B5, decided
# 2026-08-14).
#
# Per-user state (~/.docker/config.json, ~/.docker/contexts) is created by each
# account the first time it runs docker. This playbook touches none of it (B2).
#
# Usage:
#   ansible-playbook container/docker.yml -e host=<inventory host or group>
#   ansible-playbook container/docker.yml -e host=ws01 -e docker_users=alice,bob

- name: Install Docker Engine system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # dpkg-query's status field for a package that is really installed.
    # One removed but not purged (`deinstall ok config-files`) still reports
    # its version, so every guard below compares the status too, or a removed
    # package reads as "already at the pin" (POLICY.md's C2).
    docker_dpkg_ok: "install ok installed|"
    # Release-specific pins: the version string embeds the Ubuntu codename, so
    # these are not portable across releases the way a plain semver pin is.
    # Check `apt-cache policy` on the target before bumping.
    docker_version: "5:29.7.2-1~ubuntu.26.04~resolute"
    containerd_version: "2.3.3-1~ubuntu.26.04~resolute"
    docker_buildx_version: "0.36.1-1~ubuntu.26.04~resolute"
    docker_compose_version: "5.4.0-1~ubuntu.26.04~resolute"
    # Accounts to add to the `docker` group. ROOT-EQUIVALENT -- see the header.
    # Never defaulted to the connecting account, never read from the
    # environment. Accepts a comma-separated string or a YAML list, the same
    # shape every named-account var in this repo takes.
    docker_users: []
    docker_repo_uri: "https://download.docker.com/linux/ubuntu"
    # ansible_facts['architecture'] -> apt architecture name. The repository
    # publishes amd64 and arm64; the source playbook hardcoded arch=amd64.
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
    docker_arch: "{{ docker_arch_map.get(ansible_facts['architecture'], '') }}"
    # The source playbook used apt_repository with no filename:, so apt named
    # the file after the URI. Left in place beside the .sources file below, apt
    # reads the repository twice and warns about it.
    docker_legacy_source: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    docker_smoke_home: /var/tmp/docker-smoke-home
    # uid/gid used to prove the install is usable by an arbitrary user, and --
    # more importantly here -- that an account outside the group is refused.
    docker_verify_uid: 65534    # nobody
    docker_verify_gid: 65534    # nogroup
    # Docker's release-signing key, fingerprint
    # 9DC858229FC7DD38854AE2D88D81803C0EBFCD88. It carries NO EXPIRY, so
    # POLICY.md's A5 says to pin the bytes as well as the fingerprint: the
    # key material is the trust anchor and a rotation should fail apt's Release
    # check loudly rather than be followed silently. (Contrast github-cli.yml,
    # whose signing key expires and is therefore fetched each run with only its
    # fingerprint pinned.) Task 6 asserts the fingerprint too, which catches a
    # mangled paste of the block below.
