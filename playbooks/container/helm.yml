  tasks:
    - name: 1. Install prerequisites
      # bash-completion is a hard prerequisite for B3: /etc/bash_completion.d
      # is only read because that package's /etc/profile.d/bash_completion.sh
      # sources it.
      ansible.builtin.apt:
        name:
          - bash-completion
          - ca-certificates
          - gnupg
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 2. Remove predecessor apt sources and keyrings for Helm
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ helm_legacy_paths }}"

    - name: 3. Add the Helm apt repository
      ansible.builtin.deb822_repository:
        name: helm
        types:
          - deb
        uris:
          - "{{ helm_repo_uri }}"
        suites:
          - "{{ helm_suite }}"
        components:
          - main
        signed_by: "{{ helm_signing_key }}"
        state: present
        mode: '0644'
      register: helm_repo

    - name: 4. Read the fingerprints in the pinned signing key
      # Read from the variable, not from a file: with an inline armored key
      # deb822_repository writes no keyring and embeds the block in the
      # .sources file, returning key_filename empty. See container/docker.yml
      # task 5 for the full note.
      ansible.builtin.command:
        cmd: gpg --show-keys --with-colons
        stdin: "{{ helm_signing_key }}"
      register: helm_fpr
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 5. Confirm the pinned key is the Helm repository's signing key
      ansible.builtin.fail:
        msg: >-
          The signing key pinned in this playbook is not
          {{ helm_key_fingerprint }}. Refusing to configure a repository signed
          by an unknown key.
      when: helm_key_fingerprint not in (helm_fpr.stdout | default(''))

    - name: 6. Refresh the apt cache when the repository definition changed
      ansible.builtin.apt:
        update_cache: true
      when: helm_repo.changed

    - name: 7. Check the currently installed helm version
      ansible.builtin.command: dpkg-query -W -f='${Version}' helm
      register: helm_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: 8. Decide whether helm needs installing
      ansible.builtin.set_fact:
        helm_install_needed: >-
          {{ helm_installed.rc != 0 or helm_installed.stdout != helm_version }}
        helm_can_verify: >-
          {{ not (ansible_check_mode
                  and (helm_installed.rc != 0
                       or helm_installed.stdout != helm_version)) }}

    - name: 8a. Note that verification is deferred in this dry run
      ansible.builtin.debug:
        msg: >-
          --check did not install helm {{ helm_version }}, so the version
          check, the completion generation and the offline smoke tests below
          are skipped rather than failed. Re-run without --check.
      when: not (helm_can_verify | bool)

    - name: 8b. Warn when this run changes the installed major version
      # A 3 -> 4 move is not a routine upgrade: chart API compatibility and the
      # repository cache layout both change. Said out loud rather than left to
      # be discovered.
      ansible.builtin.debug:
        msg: >-
          MAJOR VERSION CHANGE: helm {{ helm_installed.stdout }} is installed
          and this run pins {{ helm_version }}. Charts and repository state
          written by the other major version may need attention. Pass
          -e helm_version={{ helm_installed.stdout }} to stay where you are.
      when:
        - helm_installed.rc == 0
        - helm_installed.stdout | length > 0
        - helm_installed.stdout.split('.')[0] != helm_version.split('.')[0]

    - name: 9. Install helm via apt
      # allow_downgrade so that the documented 4 -> 3 fallback actually applies
      # rather than silently leaving 4.x in place.
      ansible.builtin.apt:
        name: "helm={{ helm_version }}"
        state: present
        allow_downgrade: true
      when:
        - helm_install_needed | bool
        - not (ansible_check_mode and helm_repo.changed)

    - name: 10. Verify the installed helm package version
      ansible.builtin.command: dpkg-query -W -f='${Version}' helm
      register: helm_dpkg
      changed_when: false
      failed_when: helm_dpkg.stdout != helm_version
      when: helm_can_verify | bool

    - name: 11. Generate the shared bash completion from the installed binary
      # B3: written once at install time from the binary just installed, rather
      # than `source <(helm completion bash)` in one account's ~/.bashrc, which
      # re-runs helm on every interactive shell start.
      ansible.builtin.command: helm completion bash
      register: helm_completion
      changed_when: false
      check_mode: false
      when: helm_can_verify | bool

    - name: 12. Install the shared bash completion
      ansible.builtin.copy:
        content: "{{ helm_completion.stdout }}\n"
        dest: /etc/bash_completion.d/helm
        owner: root
        group: root
        mode: '0644'
      when: helm_can_verify | bool

    - name: 13. Create the scratch chart for the unprivileged checks
      # helm writes ~/.config/helm and ~/.cache/helm on first run, so the
      # scratch directory doubles as HOME. Owned by the verifying uid because
      # helm must be able to create those directories inside it.
      ansible.builtin.file:
        path: "{{ helm_smoke_dir }}/chart/templates"
        state: directory
        owner: "{{ helm_verify_uid }}"
        group: "{{ helm_verify_gid }}"
        mode: '0755'
        recurse: true
      check_mode: false

    - name: 14. Write a minimal but real chart
      # Deliberately exercises the template engine rather than just the parser:
      # the ConfigMap interpolates both a release value and a chart value, so
      # rendering it proves helm's own rendering path works for an account with
      # no configuration of its own.
      ansible.builtin.copy:
        dest: "{{ helm_smoke_dir }}/chart/{{ item.name }}"
        owner: root
        group: root
        mode: '0644'
        content: "{{ item.content }}"
      loop:
        - name: Chart.yaml
          content: |
            apiVersion: v2
            name: smoke
            description: Multi-user install verification chart
            type: application
            version: 0.1.0
            appVersion: "1.0.0"
        - name: values.yaml
          content: |
            value: multiuser
        - name: templates/configmap.yaml
          # !unsafe rather than {% raw %}: this content is templated twice on its
          # way to the file -- once when the loop item is built, once when
          # `content:` above is expanded -- and only the first pass strips a raw
          # block. ansible-core 2.16 then evaluates Go's `.Release` as Jinja and
          # dies on the leading dot; 2.20's engine does not re-template a
          # templated result, which is why {% raw %} passed there and failed on
          # the 2.16 floor this repo supports. !unsafe blocks both passes.
          content: !unsafe |
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ .Release.Name }}-smoke
            data:
              key: {{ .Values.value | quote }}
      loop_control:
        label: "{{ item.name }}"
      check_mode: false

    - name: 15. Report the helm version as an unprivileged user
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ helm_verify_uid }} --regid={{ helm_verify_gid }} --clear-groups
          env HOME={{ helm_smoke_dir }} helm version
        chdir: "{{ helm_smoke_dir }}"
      register: helm_smoke_version
      changed_when: false
      failed_when: ('v' ~ helm_version.split('-')[0]) not in helm_smoke_version.stdout
      when: helm_can_verify | bool

    - name: 16. Lint the chart as an unprivileged user
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ helm_verify_uid }} --regid={{ helm_verify_gid }} --clear-groups
          env HOME={{ helm_smoke_dir }} helm lint chart
        chdir: "{{ helm_smoke_dir }}"
      register: helm_smoke_lint
      changed_when: false
      failed_when: "'0 chart(s) failed' not in helm_smoke_lint.stdout"
      when: helm_can_verify | bool

    - name: 17. Render the chart offline as an unprivileged user
      # B4 verification, level 1 -- offline real work. `helm template` renders
      # locally and contacts no cluster, so it exercises the real templating
      # engine with no ~/.kube/config and no API server.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ helm_verify_uid }} --regid={{ helm_verify_gid }} --clear-groups
          env HOME={{ helm_smoke_dir }} helm template smoke chart
        chdir: "{{ helm_smoke_dir }}"
      register: helm_smoke_template
      changed_when: false
      failed_when: >-
        'name: smoke-smoke' not in helm_smoke_template.stdout
        or 'key: "multiuser"' not in helm_smoke_template.stdout
      when: helm_can_verify | bool

    - name: 18. Confirm the shared completion is loaded by an unprivileged shell
      # Proves B3 end to end rather than merely writing a file.
      ansible.builtin.command:
        cmd: >-
          setpriv --reuid={{ helm_verify_uid }} --regid={{ helm_verify_gid }} --clear-groups
          env -i HOME={{ helm_smoke_dir }} TERM=xterm PS1=$
          bash -ic 'complete -p helm >/dev/null 2>&1 && echo COMPLETION_OK'
        chdir: "{{ helm_smoke_dir }}"
      register: helm_smoke_completion
      changed_when: false
      failed_when: "'COMPLETION_OK' not in helm_smoke_completion.stdout"
      when: helm_can_verify | bool

    - name: 19. Remove the scratch directory
      ansible.builtin.file:
        path: "{{ helm_smoke_dir }}"
        state: absent
      check_mode: false

    - name: 20. Display installation summary
      ansible.builtin.debug:
        msg: >-
          {{ ([
               'Helm ' ~ helm_version ~ ' '
               ~ (helm_can_verify | bool
                  | ternary('is installed system-wide.', 'would be installed system-wide.')),
               '',
               '  /usr/bin/helm',
               '  /etc/apt/sources.list.d/helm.sources   (signing key inline)',
               '  /etc/bash_completion.d/helm            shared, generated from the binary',
               '',
             ]
             + (helm_can_verify | bool
                | ternary(['Verified: an unprivileged account (uid ' ~ helm_verify_uid
                           ~ ') linted and rendered a real chart offline, and gets the shared',
                           'completion in a non-login interactive shell.'],
                          ['Not verified: this was a --check run.']))
             + ['',
                'This is Helm ' ~ helm_version.split('.')[0] ~ '.x. The source playbook was '
                ~ 'unpinned, so hosts it ran on may',
                'carry either major version. To stay on the 3.x line:',
                '  ansible-playbook container/helm.yml -e host=<host> -e helm_version=3.21.3-1',
                '',
                'No chart repositories are configured by this playbook. Each account runs, for',
                'itself:',
                '  helm repo add <name> <url>     # writes ~/.config/helm/repositories.yaml',
                '  helm repo update']
          ) | join('\n') }}
