---
# Install Helm system-wide on a multi-user workstation.
#
#   /usr/bin/helm                            from the vendor apt package
#   /etc/apt/sources.list.d/helm.sources     repository definition, with the
#                                            signing key inline
#   /etc/bash_completion.d/helm              generated from the binary
#
# THIS INSTALLS HELM 4, WHERE THE SOURCE PLAYBOOK MAY HAVE INSTALLED HELM 3.
# container/helm.yml installed `helm` unpinned, so what landed depended on the
# day it ran: anyone who ran it before Helm 4 shipped has 3.x, anyone who ran
# it after gets 4.x, and nothing recorded which. Pinning is therefore not a
# no-op -- it is choosing, on the record, which major version this repo
# installs. 4.2.3-1 is that choice, taken because no consumer in this repo
# templates a chart and Helm was not installed on any host here at all.
#
# The 3.x line is still published from the same repository under the same
# package name, so the fallback costs nothing to support:
#
#   ansible-playbook container/helm.yml -e host=ws01 -e helm_version=3.21.3-1
#
# What else changed versus the source playbook: A5 cleanup (deb822_repository
# with the key pinned inline, replacing get_url + a `shell: gpg --dearmor` that
# reported `changed` on every run), the version is pinned and verified, the
# completion moved out of one account's ~/.bashrc into /etc/bash_completion.d
# (B3), and verification is real offline work as an arbitrary uid rather than
# `helm version` as the connecting account.
#
# Per-user state: ~/.config/helm, ~/.cache/helm and the repository list, all
# created by each account for itself. This playbook touches none of it (B2),
# and adds no chart repositories on anyone's behalf.
#
# Usage:
#   ansible-playbook container/helm.yml -e host=<inventory host or group>
#   ansible-playbook container/helm.yml -e host=ws01 -e helm_version=3.21.3-1

- name: Install Helm system-wide
  hosts: "{{ host }}"
  become_user: root
  become_method: sudo
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    # 4.2.3-1 is the newest 4.x; 3.21.3-1 is the newest 3.x. Both come from the
    # same repository and the same package name.
    helm_version: "4.2.3-1"
    helm_repo_uri: "https://packages.buildkite.com/helm-linux/helm-debian/any/"
    helm_suite: any
    # Apt sources and keyrings written by predecessors of this playbook. The
    # first two are container/helm.yml's own; the last two are the retired
    # baltocdn repository that playbook already removed, kept here so a host
    # that never ran the later version of it still gets cleaned up.
    helm_legacy_paths:
      - /etc/apt/sources.list.d/helm-stable-debian.list
      - /etc/apt/keyrings/helm.gpg
      - /etc/apt/sources.list.d/baltocdn_com_helm_stable_debian.list
      - /etc/apt/keyrings/helm.asc
    helm_smoke_dir: /var/tmp/helm-smoke
    # uid/gid used to prove the install is usable by an arbitrary user
    helm_verify_uid: 65534    # nobody
    helm_verify_gid: 65534    # nogroup
    # packagecloud's signing key for this repository, fingerprint
    # DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6 -- the same one the source
    # playbook asserted. It carries NO EXPIRY, so per POLICY.md's A5 the
    # bytes are pinned inline as well as the fingerprint, the same form
    # container/docker.yml uses. (Contrast container/kubectl.yml, whose key
    # expires and is therefore fetched by URL each run.)
    helm_key_fingerprint: "DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6"
    helm_signing_key: |
