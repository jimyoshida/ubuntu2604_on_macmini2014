---
# Installs a Vault SERVER. The CLI half now belongs to
# _multi-user/cloud-cli/vault-cli.yml, which installs the same package from the
# same repository. Two things to know before running this playbook:
#
#   * It writes /etc/apt/sources.list.d/apt_releases_hashicorp_com.list, which
#     vault-cli.yml removes in favour of its own hashicorp.sources. Both
#     describe the same repository with the same key and the same suite, so
#     either is fine on its own -- but with both present apt reads the
#     repository twice and warns. Run vault-cli.yml last, or migrate this
#     playbook.
#   * It is single-user by design: task 9 appends VAULT_ADDR to the invoking
#     account's ~/.bashrc. That is the breakage MIGRATION2.md removes; on a
#     shared workstation use /etc/environment or each user's own profile.
#
# This workstation has no local Vault server: it was removed on 2026-08-10.
# Running this playbook installs and starts one again, and it will need
# `vault operator init` -- the previous storage was deleted, not preserved.

- name: Install HashiCorp Vault OSS
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes

  vars:
    target_user: "{{ lookup('env', 'USER') }}"

  tasks:
    - name: 1. Install prerequisites
      apt:
        name:
          - gnupg
          - curl
          - lsb-release
        state: present
        update_cache: yes

    - name: 2. Create directory for APT keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 3. Download HashiCorp GPG key
      get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/keyrings/hashicorp-archive-keyring.asc
        mode: '0644'
        force: yes

    - name: 4. Add HashiCorp apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/hashicorp-archive-keyring.asc] https://apt.releases.hashicorp.com noble main"
        state: present

    - name: 5. Install Vault
      apt:
        name: vault
        state: present
        update_cache: yes

    - name: 6. Create Vault data directory
      file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: 7. Configure Vault (file storage, TCP listener, UI enabled)
      copy:
        dest: /etc/vault.d/vault.hcl
        content: |
          ui = true

          storage "file" {
            path = "/opt/vault/data"
          }

          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = 1
          }
        owner: vault
        group: vault
        mode: '0640'
      notify: Restart Vault

    - name: 8. Enable and start Vault service
      systemd:
        name: vault
        enabled: yes
        state: started

    - name: 9. Add VAULT_ADDR to .bashrc
      become: no
      blockinfile:
        path: ~/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK - vault"
        block: |
          export VAULT_ADDR='http://127.0.0.1:8200'
        create: yes

    - name: 10. Show post-install instructions
      debug:
        msg:
          - "Vault is installed and running. Next steps:"
          - "  1. Initialize:  vault operator init"
          - "     -> Save the 5 unseal keys and root token securely."
          - "  2. Unseal (run 3 times with different keys):"
          - "        vault operator unseal <unseal-key>"
          - "  3. Login:       vault login <root-token>"
          - "  4. UI:          http://127.0.0.1:8200/ui"
          - "  NOTE: Re-open your shell (or run: source ~/.bashrc) to pick up VAULT_ADDR."

  handlers:
    - name: Restart Vault
      systemd:
        name: vault
        state: restarted
