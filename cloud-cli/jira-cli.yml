---
- name: Install jira-cli via Homebrew
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    brew_user: "{{ lookup('env', 'USER') }}"
    brew_bin: /home/linuxbrew/.linuxbrew/bin/brew
    jira_url: "{{ lookup('env', 'JIRA_URL') }}"

  tasks:
    - name: 1. Check if Homebrew is installed
      ansible.builtin.stat:
        path: "{{ brew_bin }}"
      register: brew_check

    - name: 2. Fail if Homebrew is not installed
      ansible.builtin.fail:
        msg: "Homebrew is not installed. Run core/homebrew.yml first."
      when: not brew_check.stat.exists

    - name: 3. Check if jira-cli is already installed
      ansible.builtin.command: "{{ brew_bin }} list ankitpokhrel/jira-cli/jira-cli"
      register: jira_check
      changed_when: false
      failed_when: false

    - name: 4. Add ankitpokhrel/jira-cli tap
      ansible.builtin.command: "{{ brew_bin }} tap ankitpokhrel/jira-cli"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: jira_check.rc != 0

    - name: 5. Install jira-cli
      ansible.builtin.command: "{{ brew_bin }} install jira-cli"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: jira_check.rc != 0

    - name: 6. Verify installation
      ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/jira version
      register: jira_version
      changed_when: false

    - name: 7. Print installed version and instructions
      ansible.builtin.debug:
        msg:
          - "jira-cli version: {{ jira_version.stdout }}"
          - ""
          - "jira-cli has been successfully installed."
          - ""
          - "Initial setup:"
          - "  jira init --installation cloud --server {{ jira_url | default('https://YOUR_ORG.atlassian.net', true) }} --login your@email.com --project YOUR_PROJECT"
          - ""
          - "Common commands:"
          - "  jira issue list               - List issues"
          - "  jira issue create             - Create a new issue"
          - "  jira issue view <ISSUE-KEY>   - View issue details"
          - "  jira sprint list              - List sprints"
          - "  jira board list               - List boards"
          - ""
          - "Docs: https://github.com/ankitpokhrel/jira-cli"
