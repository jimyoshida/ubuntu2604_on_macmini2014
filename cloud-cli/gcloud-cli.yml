---
- name: Install Google Cloud CLI
  hosts: localhost
  connection: local
  gather_facts: no
  become: yes
  vars:
    gcloud_project: "{{ lookup('env', 'GOOGLE_CLOUD_PROJECT') }}"
    gcloud_location: "{{ lookup('env', 'GOOGLE_CLOUD_LOCATION') }}"

  tasks:
    - name: 1. Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
          - curl
        state: present
        update_cache: yes

    - name: 2. Download Google Cloud public key
      get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /tmp/cloud.google.key
        force: true

    - name: 2a. Dearmor Google Cloud public key
      shell: gpg --batch --no-tty --dearmor < /tmp/cloud.google.key > /usr/share/keyrings/cloud.google.gpg

    - name: 3. Add Google Cloud SDK repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
        state: present
        filename: google-cloud-sdk
        update_cache: yes

    - name: 4. Install Google Cloud CLI
      apt:
        name: google-cloud-cli
        state: present
        update_cache: yes

    - name: 5. Print post-install instructions
      ansible.builtin.debug:
        msg:
          - "Google Cloud CLI has been successfully installed."
          - ""
          - "Authenticate and configure defaults:"
          - "  gcloud auth login"
          - "  gcloud config set project {{ gcloud_project | default('YOUR_PROJECT', true) }}"
          - "  gcloud config set compute/region {{ gcloud_location | default('YOUR_LOCATION', true) }}"
