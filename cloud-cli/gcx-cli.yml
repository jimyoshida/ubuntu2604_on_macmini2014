---
- name: Install gcx (Grafana CLI) via Homebrew
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    brew_user: "{{ lookup('env', 'USER') }}"
    brew_bin: /home/linuxbrew/.linuxbrew/bin/brew
    user_home: "{{ lookup('env', 'HOME') }}"
    grafana_server: "{{ lookup('env', 'GRAFANA_SERVER') }}"

  tasks:
    - name: 1. Check if Homebrew is installed
      ansible.builtin.stat:
        path: "{{ brew_bin }}"
      register: brew_check

    - name: 2. Fail if Homebrew is not installed
      ansible.builtin.fail:
        msg: "Homebrew is not installed. Run core/homebrew.yml first."
      when: not brew_check.stat.exists

    - name: 3. Check if gcx is already installed
      ansible.builtin.command: "{{ brew_bin }} list grafana/grafana/gcx"
      register: gcx_check
      changed_when: false
      failed_when: false

    - name: 4. Tap grafana/grafana
      ansible.builtin.command: "{{ brew_bin }} tap grafana/grafana"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: gcx_check.rc != 0

    - name: 5. Install gcx
      ansible.builtin.command: "{{ brew_bin }} install grafana/grafana/gcx"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: gcx_check.rc != 0

    - name: 6. Verify installation
      ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/gcx --version
      register: gcx_version
      changed_when: false

    - name: 7. Print installed version and instructions
      ansible.builtin.debug:
        msg:
          - "gcx version: {{ gcx_version.stdout }}"
          - ""
          - "gcx has been successfully installed."
          - ""
          - "Authenticate with a service account token:"
          - "  gcx login my-grafana --server {{ grafana_server | default('https://YOUR_INSTANCE.grafana.net', true) }} --token glsa_xxx --yes"
          - ""
          - "Or set environment variables for CI/CD:"
          - "  export GRAFANA_SERVER=\"https://YOUR_INSTANCE.grafana.net\""
          - "  export GRAFANA_TOKEN=\"your-service-account-token\""
          - ""
          - "Verify configuration:"
          - "  gcx config check"
          - ""
          - "Docs: https://github.com/grafana/gcx"
