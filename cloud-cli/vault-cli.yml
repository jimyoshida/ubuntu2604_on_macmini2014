---
- name: Install Vault CLI (HashiCorp) via Homebrew
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    brew_user: "{{ lookup('env', 'USER') }}"
    brew_bin: /home/linuxbrew/.linuxbrew/bin/brew
    user_home: "{{ lookup('env', 'HOME') }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"

  tasks:
    - name: 1. Check if Homebrew is installed
      ansible.builtin.stat:
        path: "{{ brew_bin }}"
      register: brew_check

    - name: 2. Fail if Homebrew is not installed
      ansible.builtin.fail:
        msg: "Homebrew is not installed. Run core/homebrew.yml first."
      when: not brew_check.stat.exists

    - name: 3. Check if vault is already installed
      ansible.builtin.command: "{{ brew_bin }} list hashicorp/tap/vault"
      register: vault_check
      changed_when: false
      failed_when: false

    - name: 4. Tap hashicorp/tap
      ansible.builtin.command: "{{ brew_bin }} tap hashicorp/tap"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: vault_check.rc != 0

    - name: 5. Install vault
      ansible.builtin.command: "{{ brew_bin }} install hashicorp/tap/vault"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: vault_check.rc != 0

    - name: 6. Verify installation
      ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/vault version
      register: vault_version
      changed_when: false

    - name: 7. Print installed version and instructions
      ansible.builtin.debug:
        msg:
          - "vault version: {{ vault_version.stdout }}"
          - ""
          - "vault has been successfully installed."
          - ""
          - "Log in interactively (e.g. token auth):"
          - "  vault login -address={{ vault_addr | default('https://YOUR_VAULT_ADDR:8200', true) }}"
          - ""
          - "Or set environment variables for CI/CD:"
          - "  export VAULT_ADDR=\"https://YOUR_VAULT_ADDR:8200\""
          - "  export VAULT_TOKEN=\"your-vault-token\""
          - ""
          - "Common commands:"
          - "  vault status                    - Check server/seal status"
          - "  vault kv get secret/my-app       - Read a KV secret"
          - "  vault kv put secret/my-app key=value  - Write a KV secret"
          - ""
          - "Note: this installs the CLI only. It is NOT a running Vault server;"
          - "'vault server -dev' can be run manually for local testing, but no"
          - "service is started or enabled by this playbook."
          - ""
          - "Docs: https://developer.hashicorp.com/vault/docs/commands"
