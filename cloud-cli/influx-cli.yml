---
- name: Install influx (InfluxDB v2 CLI) via Homebrew
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    brew_user: "{{ lookup('env', 'USER') }}"
    brew_bin: /home/linuxbrew/.linuxbrew/bin/brew
    user_home: "{{ lookup('env', 'HOME') }}"
    influx_host: "{{ lookup('env', 'INFLUX_HOST') }}"
    influx_org: "{{ lookup('env', 'INFLUX_ORG') }}"

  tasks:
    - name: 1. Check if Homebrew is installed
      ansible.builtin.stat:
        path: "{{ brew_bin }}"
      register: brew_check

    - name: 2. Fail if Homebrew is not installed
      ansible.builtin.fail:
        msg: "Homebrew is not installed. Run core/homebrew.yml first."
      when: not brew_check.stat.exists

    - name: 3. Check if influxdb-cli is already installed
      ansible.builtin.command: "{{ brew_bin }} list influxdb-cli"
      register: influx_check
      changed_when: false
      failed_when: false

    - name: 4. Install influxdb-cli
      ansible.builtin.command: "{{ brew_bin }} install influxdb-cli"
      become: true
      become_user: "{{ brew_user }}"
      changed_when: true
      when: influx_check.rc != 0

    - name: 5. Verify installation
      ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/influx version
      register: influx_version
      changed_when: false

    - name: 6. Print installed version and instructions
      ansible.builtin.debug:
        msg:
          - "influx version: {{ influx_version.stdout }}"
          - ""
          - "influx has been successfully installed."
          - ""
          - "Set up a CLI config interactively:"
          - "  influx config create --config-name default --host-url {{ influx_host | default('http://localhost:8086', true) }} --org {{ influx_org | default('YOUR_ORG', true) }} --token YOUR_TOKEN --active"
          - ""
          - "Or set environment variables (recognized natively by influx):"
          - "  export INFLUX_HOST=\"http://localhost:8086\""
          - "  export INFLUX_ORG=\"your-org\""
          - "  export INFLUX_TOKEN=\"your-api-token\""
          - ""
          - "Common commands:"
          - "  influx bucket list             - List buckets"
          - "  influx query 'from(bucket:\"b\") |> range(start:-1h)'  - Run a Flux query"
          - "  influx write -b my-bucket -f data.lp                  - Write line-protocol data"
          - ""
          - "Docs: https://docs.influxdata.com/influxdb/v2/reference/cli/influx/"
