---
# DEPENDENCY: This playbook configures Alloy to ship logs to Loki.
# Run loki.yml BEFORE this playbook to avoid issues.
- name: Install Grafana Alloy (log shipper)
  hosts: localhost
  connection: local
  gather_facts: no
  become: yes

  tasks:
    - name: 0. Check if Loki is running (required for log shipping)
      systemd:
        name: loki
      register: loki_status
      failed_when: false

    - name: 0a. Warn if Loki is not running
      debug:
        msg: "WARNING: Loki is not running. Alloy will fail to ship logs. Run loki.yml first."
      when: loki_status.status.ActiveState != "active"

    - name: 1. Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
          - curl
        state: present
        update_cache: yes

    - name: 2. Download Grafana GPG key
      get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /tmp/grafana.key
        force: true

    - name: 2a. Dearmor Grafana GPG key
      shell: gpg --dearmor -o /usr/share/keyrings/grafana.gpg < /tmp/grafana.key

    - name: 3. Set permissions on Grafana keyring
      file:
        path: /usr/share/keyrings/grafana.gpg
        mode: '0644'

    - name: 4. Add Grafana repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        state: present
        filename: grafana
        update_cache: yes

    - name: 5. Install Alloy
      apt:
        name: alloy
        state: present
        update_cache: yes

    - name: 6. Add alloy user to adm group
      user:
        name: alloy
        groups: adm
        append: yes

    - name: 7. Write Alloy config
      copy:
        dest: /etc/alloy/config.alloy
        content: |
          loki.relabel "journal_rules" {
            forward_to = []

            rule {
              source_labels = ["__journal__systemd_unit"]
              target_label  = "unit"
            }

            rule {
              source_labels = ["__journal__systemd_user_unit"]
              target_label  = "user_unit"
            }

            rule {
              source_labels = ["__journal__transport"]
              target_label  = "transport"
            }

            rule {
              source_labels = ["__journal_syslog_identifier"]
              target_label  = "app"
            }
          }

          loki.source.journal "journal" {
            forward_to    = [loki.process.system_journal.receiver, loki.process.user_journal.receiver]
            relabel_rules = loki.relabel.journal_rules.rules
          }

          loki.process "system_journal" {
            forward_to = [loki.write.local.receiver]

            stage.match {
              selector = `{unit="loki.service"}`
              action   = "drop"
            }

            stage.match {
              selector = `{unit="alloy.service"}`
              action   = "drop"
            }

            stage.match {
              selector = `{user_unit=""}`
              action   = "keep"

              stage.static_labels {
                values = {job = "journal"}
              }
            }

            stage.match {
              selector = `{detected_level="debug"}`
              action   = "drop"
            }

            stage.drop {
              expression = `\blevel=debug\b`
            }
          }

          loki.process "user_journal" {
            forward_to = [loki.write.local.receiver]

            stage.match {
              selector = `{user_unit!=""}`
              action   = "keep"

              stage.static_labels {
                values = {job = "user_journal"}
              }
            }

            stage.match {
              selector = `{detected_level="debug"}`
              action   = "drop"
            }

            stage.drop {
              expression = `\blevel=debug\b`
            }
          }

          loki.write "local" {
            endpoint {
              url = "http://localhost:3100/loki/api/v1/push"
            }
          }

          otelcol.receiver.otlp "claude_code" {
            http {
              endpoint = "0.0.0.0:4318"
            }

            output {
              logs    = [otelcol.exporter.loki.claude_code.input]
              metrics = [otelcol.exporter.prometheus.claude_code.input]
            }
          }

          otelcol.exporter.loki "claude_code" {
            forward_to = [loki.write.local.receiver]
          }

          otelcol.exporter.prometheus "claude_code" {
            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.remote_write "mimir" {
            endpoint {
              url = "http://localhost:9009/api/v1/push"
            }
          }
      notify: Restart Alloy

    - name: 8. Set HTTP listen port
      lineinfile:
        path: /etc/default/alloy
        regexp: "CUSTOM_ARGS="
        line: 'CUSTOM_ARGS="--server.http.listen-addr=:12345"'
      notify: Restart Alloy

    - name: 9. Enable and start Alloy service
      systemd:
        name: alloy
        enabled: yes
        state: started

  handlers:
    - name: Restart Alloy
      systemd:
        name: alloy
        state: restarted
