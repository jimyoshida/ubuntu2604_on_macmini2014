---
- name: Install Node.js LTS (via NodeSource)
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: 1. Install prerequisites
      become: yes
      apt:
        name:
          - curl
        state: present
        update_cache: yes

    - name: 2. Run NodeSource LTS setup script
      become: yes
      shell: curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: 3. Install Node.js
      become: yes
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: 4. Verify Node.js installation
      command: node --version
      register: node_version_output
      changed_when: false

    - name: 5. Verify npm installation
      command: npm --version
      register: npm_version_output
      changed_when: false

    - name: 6. Install Yarn Classic globally
      become: yes
      command: npm install -g yarn
      args:
        creates: /usr/bin/yarn

    - name: 7. Verify Yarn installation
      command: yarn --version
      register: yarn_version_output
      changed_when: false

    - name: 8. Install pnpm globally
      become: yes
      command: npm install -g pnpm
      args:
        creates: /usr/bin/pnpm

    - name: 9. Verify pnpm installation
      command: pnpm --version
      register: pnpm_version_output
      changed_when: false

    - name: 10. Print installed versions and instructions
      debug:
        msg:
          - "Node.js version: {{ node_version_output.stdout }}"
          - "npm version:     {{ npm_version_output.stdout }}"
          - "Yarn version:    {{ yarn_version_output.stdout }}"
          - "pnpm version:    {{ pnpm_version_output.stdout }}"
          - ""
          - "Node.js, Yarn, and pnpm have been installed system-wide."
          - ""
          - "Common commands:"
          - "  node --version          - Show Node.js version"
          - "  npm --version           - Show npm version"
          - "  yarn --version          - Show Yarn version"
          - "  pnpm --version          - Show pnpm version"
          - "  npm install -g <pkg>    - Install a global package"
          - "  yarn global add <pkg>   - Install a global package with Yarn"
          - "  pnpm add -g <pkg>       - Install a global package with pnpm"
          - "  npm install             - Install project dependencies"
          - "  yarn install            - Install project dependencies with Yarn"
          - "  pnpm install            - Install project dependencies with pnpm"
          - "  node <file.js>          - Run a Node.js script"
